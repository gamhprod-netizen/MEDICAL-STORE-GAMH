"ord-125"],"r":""},{"id":"chloramphenicol","n":"Chloramphénicol","d":"chloramphénicol","f":["sol"],"dz":[],"g":"chloramphenicol","o":["ord-138"],"r":"","cl":"Antibiotique à large spectre","q":{"cl":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"pos":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ind":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"cix":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ei":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ma":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."}},"pos":"Adulte (valeur usuelle indicative) : PO/IV 500 mg–1 g toutes les 6 h","ind":"Typhoïde, méningite, rickettsioses (si autre option impossible)","cix":"Aplasie médullaire, nouveau-né (syndrome gris), grossesse","ei":"Aplasie médullaire, anémie, syndrome gris","ma":"Inhibe la sous-unité 50S du ribosome","sr":[122],"nc":["Chloromycétine"]},{"id":"cibetaine","n":"Cibetaine","d":"","f":["amp"],"dz":[],"g":null,"o":["ord-029"],"r":""},{"id":"ciclo-3-fort","n":"Ciclo 3 fort","d":"petit houx + hespéridine méthylchalcone + vitamine C","f":["gel"],"dz":[],"g":"petit-houx-hesperidine-methylchalcone-vitamine-c","o":["ord-038"],"r":""},{"id":"ciprolon","n":"Ciprolon","d":"ciprofloxacine","f":["cp"],"dz":["250mg","500mg"],"g":"ciprofloxacine","o":["ord-041","ord-081","ord-104","ord-120","ord-122"],"r":"","cl":"Antibiotique, fluoroquinolone","q":{"cl":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"pos":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ind":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"cix":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ei":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ma":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."}},"pos":"Adulte (valeur usuelle indicative) : 250–750 mg 2x/j","ind":"Infections urinaires, digestives, typhoïde, prostatite","cix":"Grossesse, enfant (sauf exceptions), antécédents de tendinopathie","ei":"Nausées, tendinopathie, QT long, photosensibilité","ma":"Inhibe l'ADN gyrase et la topoisomérase IV","sr":[122],"nc":["Ciflox","Cipro"]},{"id":"citrate-de-betaine","n":"Citrate de bétaïne","d":"citrate de bétaïne","f":[],"dz":[],"g":"citrate-de-betaine","o":["ord-048"],"r":""},{"id":"clamoxyl","n":"Clamoxyl","d":"amoxicilline","f":["cp"],"dz":["01g"],"g":"amoxicilline","o":["ord-024","ord-140","ord-142"],"r":"","cl":"Pénicillines à large spectre, bêta-lactamines (ATC J01CA04)","ind":"Sinusite bactérienne aiguë, otite moyenne aiguë, angine/pharyngite à streptocoque documentée, exacerbations aiguës de bronchite chronique, pneumonie communautaire, cystite aiguë, bactériurie asymptomatique gravidique, pyélonéphrite aiguë, fièvre typhoïde et paratyphoïde, abcès dentaire avec cellulite, infections articulaires sur prothèse, éradication d'Helicobacter pylori, maladie de Lyme ; prophylaxie de l'endocardite. Tenir compte des recommandations officielles sur l'usage des antibiotiques.","ma":"Pénicilline semi-synthétique (bêta-lactamine) : inhibe les protéines de liaison aux pénicillines de la synthèse du peptidoglycane, ce qui fragilise la paroi bactérienne puis provoque la lyse. Inactivée par les bêta-lactamases (spectre sans activité sur les germes qui en produisent).","pos":"Adulte et enfant ≥ 40 kg : pneumonie communautaire 500 mg–1 g toutes les 8 h ; fièvre typhoïde/paratyphoïde 500 mg–2 g toutes les 8 h ; infections articulaires sur prothèse 500 mg–1 g toutes les 8 h ; sinusite 250–500 mg toutes les 8 h ou 750 mg–1 g toutes les 12 h (infections sévères 750 mg–1 g toutes les 8 h) ; cystite aiguë : jusqu'à 3 g deux fois par jour pendant 1 jour ; prophylaxie de l'endocardite : 2 g en dose unique 30–60 min avant l'acte ; H. pylori : 750 mg–1 g deux fois par jour avec un IPP et un autre antibiotique pendant 7 jours. Autres indications (otite, angine, pyélonéphrite, abcès dentaire, bronchite chronique, Lyme) : se référer au tableau du RCP (regroupement des indications à confirmer). Durée la plus courte possible selon l'infection.","cix":"Hypersensibilité à l'amoxicilline, aux pénicillines ou à un excipient ; antécédent de réaction d'hypersensibilité immédiate sévère (anaphylaxie) à une autre bêta-lactamine (céphalosporine, carbapénème, monobactame).","ei":"Les plus fréquents : diarrhées, nausées, éruptions cutanées. Peu fréquents : vomissements, urticaire, prurit. Très rares : réactions allergiques sévères (œdème de Quincke, anaphylaxie, maladie sérique), réactions cutanées sévères (érythème polymorphe, Stevens-Johnson, nécrolyse épidermique toxique, PEAG, DRESS), colite associée aux antibiotiques, leucopénie, thrombopénie et anémie hémolytique réversibles, hépatite et ictère cholestatique, néphrite interstitielle, convulsions, vertiges, candidose. Fréquence indéterminée : syndrome de Kounis, lymphohistiocytose hémophagocytaire, entérocolite induite par le médicament (surtout enfant), cristallurie, méningite aseptique, réaction de Jarisch-Herxheimer.","pr":"Rechercher une allergie aux pénicillines/céphalosporines avant traitement ; arrêt immédiat en cas de manifestation allergique. Éviter en cas de suspicion de mononucléose infectieuse. Convulsions possibles (insuffisance rénale, fortes doses, antécédents). Colite associée aux antibiotiques : arrêt et avis médical, ne pas utiliser de freinateurs du péristaltisme. Traitement prolongé : surveiller fonctions rénale, hépatique et hématologique. Fortes doses : bonne hydratation (cristallurie). Anticoagulants oraux : surveiller le temps de Quick/INR. Glycosurie : utiliser la méthode enzymatique à la glucose oxydase.","it":"Probénécide : association non recommandée (↑ taux d'amoxicilline) ; allopurinol : ↑ risque de réactions cutanées allergiques ; tétracyclines et autres bactériostatiques : possible interférence avec l'effet bactéricide ; anticoagulants oraux (acénocoumarol, warfarine) : ↑ possible de l'INR, surveillance ; méthotrexate : ↑ de sa toxicité (excrétion réduite).","pen":"Enfant \u003c 40 kg : 20–90 mg/kg/j en plusieurs prises (sinusite, otite, pneumonie, cystite, pyélonéphrite, abcès dentaire) ; 40–90 mg/kg/j (angine) ; 100 mg/kg/j en 3 prises (fièvre typhoïde/paratyphoïde) ; prophylaxie de l'endocardite : 50 mg/kg en dose unique 30–60 min avant l'acte. Le schéma en 2 prises/jour est réservé aux doses les plus élevées. Première semaine de vie : limiter à 2 prises/jour. La notice patient donne une posologie usuelle plus simple (40–90 mg/kg/j, maximum 100 mg/kg/j) : le RCP, plus détaillé, a été retenu.","pgr":"Utilisable si le bénéfice attendu l'emporte sur le risque ; pas d'augmentation du risque de malformation sur données limitées. Peut fausser le dosage de l'œstriol.","pal":"Excrétée en petites quantités dans le lait (risque de sensibilisation, diarrhée et candidose possibles chez le nourrisson) ; utilisation après évaluation du rapport bénéfice/risque par le médecin.","pag":"Aucune adaptation posologique jugée nécessaire.","pir":"Adulte et enfant ≥ 40 kg : DFG > 30 mL/min aucune adaptation ; 10–30 : maximum 500 mg deux fois par jour ; \u003c 10 : maximum 500 mg/jour ; hémodialyse : 500 mg/24 h avec 500 mg supplémentaires avant et après la séance ; dialyse péritonéale : maximum 500 mg/jour. Enfant \u003c 40 kg : DFG 10–30 : 15 mg/kg deux fois par jour (maximum 500 mg deux fois par jour) ; \u003c 10 : 15 mg/kg une fois par jour (maximum 500 mg).","pih":"À utiliser avec précaution, avec surveillance régulière de la fonction hépatique.","q":{"cl":{"st":"av","s":[2,122],"n":"Divergence résolue : libellé de classe du Word plus général ; classification ATC du RCP de l'ANSM conservée. Valeur du Word non reprise : « Antibiotique, β-lactamine (aminopénicilline) »."},"ind":{"st":"av","s":[2,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Infections ORL, respiratoires, urinaires, otite, helicobacter »."},"ma":{"st":"av","s":[2,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Inhibe la synthèse de la paroi bactérienne (liaison aux PLP) »."},"pos":{"st":"av","s":[2,122],"n":"Divergence résolue : la posologie du Word est compatible avec le tableau du RCP ANSM (18/09/2026), plus détaillé. Valeur du RCP conservée. Valeur du Word non reprise : « Adulte (valeur usuelle indicative) : 500 mg 3x/j ou 1 g 2–3x/j »."},"cix":{"st":"av","s":[2,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Allergie aux pénicillines »."},"ei":{"st":"av","s":[2,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Diarrhée, éruption, candidose, allergie »."},"pr":{"st":"av","s":[2]},"it":{"st":"av","s":[2]},"pen" d":"dalfon","n":"Dalfon","d":"","f":["cp"],"dz":["500mg"],"g":null,"o":["ord-038","ord-068","ord-069","ord-070","ord-145"],"r":""},{"id":"debridat","n":"Débridat","d":"trimébutine","f":["cp"],"dz":["100mg","400mg"],"g":"trimebutine","o":["ord-034","ord-045","ord-070"],"r":""},{"id":"denoral","n":"Denoral","d":"","f":["srp"],"dz":[],"g":null,"o":["ord-005"],"r":""},{"id":"desomedine","n":"Desomedine","d":"hexamidine","f":["collyre"],"dz":[],"g":"hexamidine","o":["ord-107"],"r":""},{"id":"dexametazone","n":"Dexametazone","d":"dexaméthasone","f":[],"dz":["100mg/j"],"g":"dexamethasone","o":["ord-100"],"r":"","cl":"Corticoïde","q":{"cl":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"pos":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ind":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"cix":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ei":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ma":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."}},"pos":"Adulte (valeur usuelle indicative) : Collyre : 1 goutte 3–4x/j ; IV/IM 4–8 mg (jusqu'à 16 mg/j)","ind":"Inflammation oculaire, œdème cérébral, allergie, nausées chimio","cix":"Infection virale/fongique oculaire ; infection non contrôlée","ei":"Hypertension oculaire, hyperglycémie","ma":"Active les récepteurs glucocorticoïdes","sr":[122],"nc":["Dexaméthasone","Maxidrol"]},{"id":"diantalvic","n":"Diantalvic","d":"paracétamol + dextropropoxyphène","f":["gel"],"dz":["10mg","300mg"],"g":"paracetamol-dextropropoxyphene","o":["ord-056","ord-068"],"r":"Dextropropoxyphène : retiré du marché en Europe"},{"id":"diclofenac","n":"Diclofenac","d":"diclofénac","f":["gel","inj"],"dz":["100mg/25mg","75mg"],"g":"diclofenac","o":["ord-056","ord-105","ord-118","ord-131"],"r":"","cl":"Anti-inflammatoires non stéroïdiens (AINS), antirhumatismaux (ATC M01AB05)","ind":"Voltarène 50 mg comprimé, adulte et enfant dès 15 ans : traitement symptomatique au long cours des rhumatismes inflammatoires chroniques (polyarthrite rhumatoïde, spondylarthrite ankylosante et syndromes apparentés, rhumatisme psoriasique) et de certaines arthroses douloureuses et invalidantes ; traitement de courte durée des poussées aiguës de rhumatismes abarticulaires (épaule douloureuse aiguë, tendinites, bursites), d'arthrites microcristallines, d'arthroses, de lombalgies et radiculalgies sévères ; dysménorrhées essentielles après bilan étiologique. Enfant à partir de 35 kg (environ 12 ans) : rhumatismes inflammatoires infantiles uniquement.","ma":"Inhibition de la biosynthèse des prostaglandines, impliquées dans l'inflammation, la douleur et la fièvre ; propriétés anti-inflammatoires, antirhumatismales, analgésiques et antipyrétiques.","pos":"Comprimé 50 mg, adulte : poussées aiguës de rhumatologie 150 mg/j (1 comprimé 3 fois par jour), 7 jours maximum ; traitement d'entretien 75–100 mg/j en 2 ou 3 prises ; dysménorrhée essentielle 100 mg/j en 2 prises (1 comprimé matin et soir). Avaler entier avec de l'eau, de préférence avant le repas. Dose efficace la plus faible, pendant la durée la plus courte. Autres présentations de Voltarène (LP 75 mg, suppositoires, solution injectable) : posologies propres, non incluses (À valider).","cix":"Hypersensibilité ; antécédent d'allergie ou d'asthme déclenché par le diclofénac, un autre AINS ou l'aspirine ; hémorragie ou perforation digestive, ulcère évolutif, antécédents d'ulcère ou d'hémorragie digestive récidivants ou liés aux AINS ; insuffisance hépatique sévère ; insuffisance rénale sévère ; insuffisance cardiaque congestive avérée (NYHA II–IV), cardiopathie ischémique, artériopathie périphérique et/ou maladie vasculaire cérébrale ; traitement par mifamurtide ; enfant de moins de 35 kg (dosage inadapté) ; grossesse à partir du début du 6e mois (24 semaines d'aménorrhée), même après une seule prise.","ei":"Les plus fréquents : digestifs (nausées, vomissements, diarrhée, dyspepsie, douleurs abdominales, flatulence, anorexie), céphalées, étourdissements, vertiges, élévation des transaminases, éruption cutanée. Peu fréquents : infarctus du myocarde, insuffisance cardiaque, palpitations, douleur thoracique. Rares : hypersensibilité et réactions anaphylactiques, hémorragie, ulcère ou perforation gastro-intestinaux, gastrite, hépatite, urticaire, asthme, somnolence. Très rares : thrombopénie, leucopénie, anémie, agranulocytose, œdème de Quincke, atteinte rénale aiguë (néphrite interstitielle, syndrome néphrotique, nécrose papillaire), hépatite fulminante, réactions cutanées sévères (Stevens-Johnson, Lyell, dermatite exfoliative), hypertension, pneumopathie, méningite aseptique, convulsions, AVC, colite, pancréatite. Fréquence indéterminée : syndrome de Kounis, rétention hydrosodée, œdème, hyperkaliémie, érythème pigmenté fixe, colite ischémique. Risque accru d'événements thrombotiques artériels (infarctus, AVC), surtout à 150 mg/j et en traitement prolongé. Surdosage : pas de tableau caractéristique ; transfert hospitalier, traitement symptomatique.","pr":"Dose la plus faible, durée la plus courte. Risque digestif (hémorragie, ulcération, perforation) accru avec la dose, chez le sujet âgé, fragile ou de faible poids et en cas d'antécédents : envisager un protecteur gastrique (misoprostol ou IPP) ; arrêt en cas d'hémorragie ou d'ulcération. Facteurs de risque cardiovasculaire (hypertension, hyperlipidémie, diabète, tabac) : évaluation attentive. Asthme, rhinite allergique, polypose nasale, BPCO : réactions aux AINS plus fréquentes. Arrêt dès un rash cutané, une lésion des muqueuses ou tout signe d'hypersensibilité. Surveillance rénale (diurèse, fonction rénale, kaliémie), notamment avec IEC, sartans, diurétiques, chez le sujet âgé ou en cas d'hypovolémie. Traitement prolongé : contrôle de la formule sanguine et des fonctions hépatique et rénale. Porphyrie hépatique : prudence. Peut masquer les signes d'une infection. Éviter d'associer un autre AINS ou l'aspirine. Fertilité féminine : peut être altérée de façon réversible. Conduite : prudence en cas de vertiges, somnolence ou troubles visuels. Contient du lactose et du ricinoléate de macrogolglycérol (effet laxatif possible).","it":"Contre-indiquée : mifamurtide. Déconseillées : aspirine (doses antalgiques ou anti-inflammatoires), anticoagulants oraux, autres AINS, héparines (doses curatives et/ou sujet âgé), lithium, méthotrexate > 20 mg/semaine, nicorandil, pémétrexed (fonction rénale faible à modérée). Précautions d'emploi : autres anticoagulants et antiagrégants, ciclosporine, tacrolimus, cobimétinib, diurétiques, IEC et sartans (insuffisance rénale aiguë : hydratation et surveillance), méthotrexate ≤ 20 mg/semaine (hémogramme hebdomadaire), pémétrexed (fonction rénale normale), ténofovir disoproxil. À prendre en compte : aspirine antiagrégante, corticoïdes, ISRS, antidiabétiques (surveiller la glycémie), bêta-bloquants, digoxine (digoxinémie), inhibiteurs du CYP2C9 (voriconazole), phénytoïne, quinolones, déférasirox, pentoxifylline, autres hyperkaliémiants.","pgr":"Contre-indiqué à partir du début du 6e mois (24 SA), même en prise unique (toxicité cardio-pulmonaire, constriction du canal artériel, atteinte rénale fœtale, oligoamnios) ; surveillance échographique cardiaque et rénale après une prise à partir de 24 SA. Avant 24 SA ou en cas de projet de grossesse : ne pas prescrire sauf nécessité absolue, dose la plus faible, durée la plus courte ; risque de fausse couche et, pour certains AINS, de malformations au 1er trimestre. Atteinte rénale fœtale possible dès 12 SA, constriction du canal artériel dès 20 SA.","pal":"Passe dans le lait maternel : déconseillé pendant l'allaitement.","pag":"Pas d'ajustement de la dose initiale ; dose minimale efficace et prudence chez le sujet fragile ou de faible poids (risque accru d'effets digestifs graves).","pir":"Contre-indiqué en insuffisance rénale sévère ; prudence en insuffisance rénale légère à modérée (aucune recommandation d'ajustement posologique faute d'étude spécifique).","pih":"Contre-indiqué en insuffisance hépatique sévère ; prudence en insuffisance hépatique légère à modérée, avec surveillance de la fonction hépatique (aucune recommandation d'ajustement posologique faute d'étude spécifique).","pen":"Enfant à partir de 35 kg (environ 12 ans) : rhumatismes inflammatoires infantiles uniquement, 2–3 mg/kg/j en 2 ou 3 prises (35–50 kg : 100–150 mg/j, maximum 150 mg/j). Contre-indiqué en dessous de 35 kg (dosage inadapté).","q":{"cl":{"st":"av","s":[4,122],"n":"Divergence résolue : libellé de classe du Word plus général ; classification ATC du RCP de l'ANSM conservée. Valeur du Word non reprise : « AINS »."},"ind":{"st":"av","s":[4,122],"n":"Divergence résolue : la colique néphrétique du Word relève d'autres présentations (injectable) ; le RCP lu concerne le comprimé 50 mg. Indications du RCP conservées. Valeur du Word non reprise : « Douleur, inflammation, arthrose, colique néphrétique »."},"ma":{"st":"av","s":[4,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Inhibe COX-1 et COX-2 »."},"pos":{"st":"av","s":[4,122],"n":"Divergence résolue : le Word couvre aussi l'IM et le gel (présentations non lues) ; sa posologie orale (50 mg 2–3×/j) est compatible avec le RCP (100–150 mg/j). Valeur du RCP conservée. Valeur du Word non reprise : « Adulte (valeur usuelle indicative) : PO 50 mg 2–3x/j ; IM 75 mg 1–2x/j ; gel 2–4x/j »."},"cix":{"st":"av","s":[4,122],"n":"Divergence résolue : le Word cite le 3e trimestre ; le RCP ANSM (25/07/2025) contre-indique dès 24 semaines d'aménorrhée (début du 6e mois), plus protecteur. Valeur du RCP conservée. Valeur du Word non reprise : « Ulcère, insuffisance rénale/cardiaque/hépatique sévère, 3e trimestre »."},"ei":{"st":"av","s":[4,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Gastralgies, ulcère, ↑ risque CV, néphrotoxicité »."},"pr":{"st":"av","s":[4]},"it":{"st":"av","s":[4]},"pgr":{"st":"av","s":[4]},"pal":{"st":"av","s":[4]},"pag":{"st":"av","s":[4]},"pir":{"st":"av","s":[4]},"pih":{"st":"av","s":[4]},"pen":{"st":"av","s":[4]}},"sr":[4,122],"nc":["Cataflam","Voltarène"]},{"id":"dicynone","n":"Dicynone","d":"étamsylate","f":["cp"],"dz":["250mg"],"g":"etamsylate","o":["ord-058"],"r":""},{"id":"diffu-k","n":"Diffu-K","d":"chlorure de potassium","f":["gel"],"dz":[],"g":"chlorure-de-potassium","o":["ord-110"],"r":""},{"id":"dihydroergotamine","n":"Dihydroergotamine","d":"dihydroergotamine","f":["cp"],"dz":[],"g":"dihydroergotamine","o":["ord-096"],"r":""},{"id":"dimepra","n":"Dimépra","d":"","f":["gel"],"dz":["02mg"],"g":null,"o":["ord-086"],"r":""},{"id":"diovenor","n":"Diovenor","d":"diosmine","f":["cp"],"dz":["600mg"],"g":"diosmine","o":["ord-038"],"r":""},{"id":"divido","n":"Divido","d":"","f":["cp"],"dz":[],"g":null,"o":["ord-093"],"r":""},{"id":"dogmatil","n":"Dogmatil","d":"sulpiride","f":["gel"],"dz":[],"g":"sulpiride","o":["ord-082"],"r":""},{"id":"doliprane","n":"Doliprane","d":"paracétamol","f":["cp"],"dz":["01g","500mg","50mg/kg"],"g":"paracetamol","o":["ord-015","ord-019","ord-050","ord-058","ord-086","ord-146"],"r":"","cl":"Autres analgésiques et antipyrétiques – anilides (ATC N02BE01)","ind":"Traitement symptomatique des douleurs légères à modérées et/ou de la fièvre (présentation 1 g : adulte et enfant à partir de 50 kg, environ 15 ans).","ma":"Mécanisme d'action central et périphérique (le RCP consulté n'en donne pas davantage).","pos":"Présentation 1 g, adulte et enfant ≥ 50 kg : 1 g par prise, intervalle ≥ 4 h, maximum 3 g/jour ; jusqu'à 4 g/jour uniquement sur avis médical et sans facteur de risque. Posologie recommandée : environ 60 mg/kg/jour en plusieurs prises. Dose maximale 60 mg/kg/j sans dépasser 3 g/j chez l'adulte \u003c 50 kg, en cas de réserves basses en glutathion (dénutrition, jeûne, cachexie) ou de déshydratation. Dose efficace la plus faible, le moins longtemps possible ; réévaluer si douleur > 5 jours ou fièvre > 3 jours. Tenir compte de tous les médicaments contenant du paracétamol.","cix":"Hypersensibilité au paracétamol ou à un excipient ; insuffisance hépatique sévère.","ei":"Rares : hypersensibilité (érythème, urticaire, rash), purpura, diarrhées, douleurs abdominales. Très rares : thrombopénie, leucopénie, neutropénie, réactions cutanées graves. Fréquence indéterminée : anaphylaxie, choc, œdème de Quincke, bronchospasme (surtout asthmatiques sensibles à l'aspirine ou aux AINS), acidose métabolique à trou anionique élevé, élévation des enzymes hépatiques, érythème pigmenté fixe. Surdosage : atteinte hépatique grave (antidote : N-acétylcystéine).","pr":"Ne pas associer d'autres médicaments contenant du paracétamol (surdosage hépatotoxique). Prudence : adulte \u003c 50 kg, insuffisance hépatique légère à modérée, alcoolisme chronique, insuffisance rénale, syndrome de Gilbert, déficit en G6PD, déshydratation, dénutrition, sujet âgé, inducteurs enzymatiques (phénobarbital, phénytoïne, carbamazépine, topiramate, rifampicine). Arrêt en cas d'hépatite virale aiguë. Alcool déconseillé. Usage fréquent ou prolongé sans avis médical déconseillé.","it":"Précaution : antivitamines K (↑ effet et risque hémorragique à 4 g/j pendant ≥ 4 jours : INR plus fréquent) ; flucloxacilline (risque d'acidose métabolique à trou anionique élevé). Interférence avec le dosage de la glycémie (glucose oxydase-peroxydase) et de l'acide urique.","pgr":"Utilisable si cliniquement nécessaire, à la dose efficace la plus faible, le moins longtemps et le moins souvent possible. Pas de malformation ni de toxicité fœtale/néonatale démontrée ; études sur le neurodéveloppement non concluantes.","pal":"Éliminé en petites quantités dans le lait maternel ; utilisation possible aux doses thérapeutiques.","pag":"La posologie adulte convient en général ; l'adapter aux facteurs de risque associés.","pir":"Adulte, clairance de la créatinine 10–50 mL/min : intervalle ≥ 6 h, maximum 3 g/j ; \u003c 10 mL/min : intervalle ≥ 8 h, maximum 2 g/j.","pih":"Insuffisance hépatique légère à modérée, alcoolisme chronique, syndrome de Gilbert : réduire la dose et espacer les prises, maximum 2 g/j. Contre-indiqué si insuffisance hépatique sévère.","pen":"Dose recommandée : environ 60 mg/kg/j en plusieurs prises (≈ 15 mg/kg toutes les 6 h ou 10 mg/kg toutes les 4 h), intervalle ≥ 4 h, au moins 3 prises/j ; c'est aussi la dose maximale journalière retenue par l'ANSM (3 g/j maximum sans ordonnance). Enfants et adultes \u003c 50 kg : adapter la dose au poids ; la présentation 1 g n'est pas adaptée à l'enfant \u003c 50 kg (des formes pédiatriques existent). Dose efficace la plus faible, durée la plus courte (sans avis médical : 3 jours en cas de fièvre, 5 jours en cas de douleur). Remarque : un RCP de l'association paracétamol-codéine mis à jour le 31/07/2026 cite encore un maximum de 80 mg/kg/j chez l'enfant \u003c 40 kg ; la valeur la plus prudente (60 mg/kg/j) est affichée.","q":{"cl":{"st":"av","s":[0,122],"n":"Divergence résolue : libellé de classe du Word plus général ; classification ATC du RCP de l'ANSM conservée. Valeur du Word non reprise : « Antalgique, antipyrétique »."},"ind":{"st":"av","s":[0,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Douleur légère à modérée, fièvre »."},"ma":{"st":"av","s":[0,122],"n":"Divergence résolue : le Word précise une inhibition de la COX centrale, non retrouvée dans la source officielle lue (RCP : mécanisme central et périphérique). Précision non reprise, à valider. Valeur du Word non reprise : « Inhibe la COX centrale »."},"pos":{"st":"av","s":[0,122],"n":"Divergence résolue : le Word cite 4 g/j comme maximum. C'est la limite haute admise par les RCP (4 g/j sur avis médical sans facteur de risque, RCP Doliprane 2025 ; maximum absolu de 4 g/j chez l'adulte > 50 kg, RCP Dafalgan codéine 2026), alors que la dose usuelle et le maximum sans ordonnance sont de 3 g/j (ANSM). Valeur du RCP conservée avec cette précision. Valeur du Word non reprise : « Adulte (valeur usuelle indicative) : 500–1000 mg toutes les 6 h (max 4 g/j) ; IV 1 g »."},"cix":{"st":"av","s":[0,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Insuffisance hépatique sévère »."},"ei":{"st":"av","s":[0,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Hépatotoxicité en surdosage »."},"pr":{"st":"av","s":[0]},"it":{"st":"av","s":[0]},"pgr":{"st":"av","s":[0]},"pal":{"st":"av","s":[0]},"pag":{"st":"av","s":[0]},"pir":{"st":"av","s":[0]},"pih":{"st":"av","s":[0]},"pen":{"st":"cf","s":[0,9,10,11,20],"n":"Contradiction non résolue entre RCP officiels : 60 mg/kg/j (RCP Doliprane 1 g du 25/08/2025, dossier ANSM, fiche ANSM 2023) contre 80 mg/kg/j pour l'enfant \u003c 40 kg (RCP Dafalgan codéine du 31/07/2026 et anciens RCP). Valeur la plus prudente (60 mg/kg/j) affichée ; à valider selon le référentiel national applicable."},"dci":{"st":"av","s":[0]}},"sr":[0,9,10,11,20,122],"nc":["Doliprane","Efferalgan","Panadol"]},{"id":"duflucan  la marque non relu (posologies non propagées). Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Insuffisance hépatique sévère »."},"ei":{"st":"av","s":[0,5,122],"n":"Information « substance » issue du RCP DOLIPRANE 1000 mg ; RCP propre à la marque non relu (posologies non propagées). Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Hépatotoxicité en surdosage »."},"it":{"st":"av","s":[0,5],"n":"Information « substance » issue du RCP DOLIPRANE 1000 mg ; RCP propre à la marque non relu (posologies non propagées)."},"pgr":{"st":"av","s":[0,5],"n":"Information « substance » issue du RCP DOLIPRANE 1000 mg ; RCP propre à la marque non relu (posologies non propagées)."},"pal":{"st":"av","s":[0,5],"n":"Information « substance » issue du RCP DOLIPRANE 1000 mg ; RCP propre à la marque non relu (posologies non propagées)."},"dci":{"st":"av","s":[5]},"pos":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ind":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."}},"ma":"Mécanisme d'action central et périphérique (le RCP consulté n'en donne pas davantage).","cix":"Hypersensibilité au paracétamol ou à un excipient ; insuffisance hépatique sévère.","ei":"Rares : hypersensibilité (érythème, urticaire, rash), purpura, diarrhées, douleurs abdominales. Très rares : thrombopénie, leucopénie, neutropénie, réactions cutanées graves. Fréquence indéterminée : anaphylaxie, choc, œdème de Quincke, bronchospasme (surtout asthmatiques sensibles à l'aspirine ou aux AINS), acidose métabolique à trou anionique élevé, élévation des enzymes hépatiques, érythème pigmenté fixe. Surdosage : atteinte hépatique grave (antidote : N-acétylcystéine).","it":"Précaution : antivitamines K (↑ effet et risque hémorragique à 4 g/j pendant ≥ 4 jours : INR plus fréquent) ; flucloxacilline (risque d'acidose métabolique à trou anionique élevé). Interférence avec le dosage de la glycémie (glucose oxydase-peroxydase) et de l'acide urique.","pgr":"Utilisable si cliniquement nécessaire, à la dose efficace la plus faible, le moins longtemps et le moins souvent possible. Pas de malformation ni de toxicité fœtale/néonatale démontrée ; études sur le neurodéveloppement non concluantes.","pal":"Éliminé en petites quantités dans le lait maternel ; utilisation possible aux doses thérapeutiques.","sr":[0,5,9,10,11,20,122],"pos":"Adulte (valeur usuelle indicative) : 500–1000 mg toutes les 6 h (max 4 g/j) ; IV 1 g","ind":"Douleur légère à modérée, fièvre","nc":["Doliprane","Efferalgan","Panadol"]},{"id":"efferalgan-codeine","n":"Efferalgan codéine","d":"paracétamol + codéine","f":[],"dz":[],"g":"paracetamol-codeine","o":["ord-051","ord-139"],"r":"","cl":"Opioïdes en association avec des analgésiques non opioïdes (ATC N02AJ06)","ind":"Patients de plus de 12 ans : traitement des douleurs aiguës d'intensité modérée qui ne peuvent pas être soulagées par d'autres antalgiques comme le paracétamol ou l'ibuprofène (seul).","ma":"Paracétamol : antalgique et antipyrétique. Codéine : antalgique central de faible action, agissant sur les récepteurs opioïdes µ (faible affinité) ; l'effet analgésique est dû à sa conversion en morphine par le CYP2D6. L'association est significativement plus active que chaque composant isolé, avec un effet plus prolongé.","pos":"Comprimé effervescent 500 mg/30 mg, à dissoudre dans un verre d'eau ; dose efficace la plus faible, durée la plus courte (3 jours maximum ; avis médical si la douleur n'est pas soulagée) ; intervalle minimum de 6 h. Adulte : 1 (à 2) comprimé par prise, en général jusqu'à 6 comprimés/j (3 g de paracétamol + 180 mg de codéine), jusqu'à 8 comprimés/j (4 g + 240 mg) en cas de douleurs plus intenses. Adolescent > 50 kg : 1 (à 2) comprimé par prise, maximum 6 comprimés/j. Codéine : maximum 240 mg/j. Tenir compte de tous les médicaments contenant du paracétamol ou de la codéine.","pen":"Contre-indiqué avant 12 ans. De 12 à 18 ans, respecter la posologie selon le poids : 31–50 kg : 1 comprimé par prise (6 h minimum), maximum 4 comprimés/j (2 g de paracétamol + 120 mg de codéine) ; > 50 kg : 1 (à 2) comprimé, maximum 6 comprimés/j. Doses recommandées : environ 60 mg/kg/j de paracétamol en 4 prises (≈ 15 mg/kg toutes les 6 h) et environ 3 mg/kg/j de codéine en 4 prises (0,5 à 1 mg/kg toutes les 6 h). Maximum de paracétamol cité par ce RCP : 80 mg/kg/j si \u003c 40 kg, 3 g/j de 41 à 50 kg. Contre-indiqué à tout âge \u003c 18 ans après amygdalectomie/adénoïdectomie pour syndrome d'apnée obstructive du sommeil ; codéine non recommandée en cas de fonction respiratoire altérée.","cix":"Hypersensibilité au paracétamol, à la codéine ou à un excipient ; insuffisance hépatique sévère ; enfant de moins de 12 ans ; asthmatiques et insuffisants respiratoires (quel que soit le degré) ; allaitement ; patients \u003c 18 ans après amygdalectomie/adénoïdectomie pour apnée obstructive du sommeil ; métaboliseurs CYP2D6 ultra-rapides connus ; association avec l'oxybate de sodium.","ei":"Paracétamol : rares : hypersensibilité, érythème, urticaire, rash, purpura, diarrhées, douleurs abdominales ; très rares : thrombopénie, leucopénie, neutropénie, réactions cutanées graves ; fréquence indéterminée : anaphylaxie, choc, œdème de Quincke, bronchospasme, acidose métabolique à trou anionique élevé, élévation des enzymes hépatiques, érythème pigmenté fixe. Codéine (fréquence indéterminée) : hypersensibilité, confusion, dysphorie, euphorie, hallucinations, sédation, somnolence, vertiges, myoclonies, paresthésies, syncope, tremblements, myosis, dépression respiratoire, dyspnée, bronchospasme, constipation, nausées, vomissements, pancréatite, colique biliaire, dysfonction du sphincter d'Oddi, hépatite, rhabdomyolyse, insuffisance rénale, rétention urinaire, asthénie, œdème ; abus, dépendance et syndrome de sevrage (y compris chez le nouveau-né) en cas d'utilisation prolongée. Surdosage : toxicité hépatique du paracétamol (antidote : N-acétylcystéine) ; dépression respiratoire de la codéine (naloxone).","pr":"Ne pas associer d'autres médicaments contenant du paracétamol ou de la codéine. Paracétamol : prudence si adulte \u003c 50 kg, insuffisance hépatique légère à modérée, alcoolisme chronique, insuffisance rénale, syndrome de Gilbert, déficit en G6PD, déshydratation, dénutrition, sujet âgé, inducteurs enzymatiques ; arrêt en cas d'hépatite virale aiguë ; alcool déconseillé. Codéine : métabolisme variable par le CYP2D6 (inefficacité chez les métaboliseurs lents, risque de toxicité opioïde chez les métaboliseurs rapides ou ultra-rapides ; prévalence des ultra-rapides citée par le RCP : 29 % chez les Africains/Éthiopiens, 1 à 7 % dans d'autres populations) ; dépression respiratoire et effets sur le SNC ; troubles respiratoires liés au sommeil ; constipation ; hyperalgésie ; épilepsie ; hypertension intracrânienne ; masquage d'une affection abdominale aiguë ; spasme du sphincter d'Oddi (cholécystectomisés) ; rétention urinaire (rétrécissement urétral, prostate) ; tolérance, dépendance et trouble de l'usage d'opioïde (durée limitée à 3 jours). La forme effervescente contient du sodium (385 mg), du sorbitol, de l'aspartam et des sulfites.","it":"Contre-indiquée : oxybate de sodium. Déconseillées : alcool ; bupropion, cinacalcet, duloxétine, terbinafine (inefficacité de la codéine) ; fluoxétine, paroxétine, quinidine (efficacité diminuée) ; morphiniques agonistes-antagonistes et antagonistes partiels. À prendre en compte : autres morphiniques et antitussifs morphiniques, méthadone, autres sédatifs, barbituriques, benzodiazépines et apparentés, gabapentinoïdes (dépression respiratoire, sédation), médicaments atropiniques (akinésie colique, constipation sévère). Paracétamol : antivitamines K (INR à 4 g/j pendant ≥ 4 jours), flucloxacilline (acidose métabolique), interférence avec les dosages de glycémie et d'acide urique.","pgr":"Utilisation ponctuelle possible si cliniquement nécessaire, à la dose la plus faible, le moins longtemps et le moins souvent possible. Paracétamol : aucune malformation ni toxicité fœtale démontrée. Codéine : la plupart des études écartent un risque malformatif, effet tératogène chez l'animal. En fin de grossesse : risque de dépression respiratoire du nouveau-né après de fortes doses avant l'accouchement et de syndrome de sevrage en cas d'administration chronique.","pal":"Contre-indiqué pendant l'allaitement : le paracétamol et la codéine passent dans le lait maternel ; chez une mère métaboliseur CYP2D6 ultra-rapide, des quantités importantes de morphine peuvent être transmises (toxicité opioïde possible chez le nourrisson, parfois fatale).","pag":"Diminuer de moitié la posologie initiale de l'adulte, puis augmenter selon la tolérance et les besoins ; risque accru de dépression respiratoire, de constipation et d'interactions médicamenteuses.","pir":"Risque d'accumulation de codéine et de paracétamol. Adulte, clairance de la créatinine 10–50 mL/min : intervalle ≥ 6 h, paracétamol maximum 3 g/j ; \u003c 10 mL/min : intervalle ≥ 8 h, maximum 2 g/j. Enfant : surveillance rapprochée.","pih":"Insuffisance hépatique légère à modérée, alcoolisme chronique, syndrome de Gilbert : réduire la dose et espacer les prises, paracétamol maximum 2 g/j. Contre-indiqué en cas d'insuffisance hépatique sévère.","q":{"cl":{"st":"av","s":[20]},"ind":{"st":"av","s":[20]},"ma":{"st":"av","s":[20]},"pos":{"st":"av","s":[20]},"pen":{"st":"av","s":[20]},"cix":{"st":"av","s":[20]},"ei":{"st":"av","s":[20]},"pr":{"st":"av","s":[20]},"it":{"st":"av","s":[20]},"pgr":{"st":"av","s":[20]},"pal":{"st":"av","s":[20]},"pag":{"st":"av","s":[20]},"pir":{"st":"av","s":[20]},"pih":{"st":"av","s":[20]},"dci":{"st":"av","s":[21]}},"sr":[20,21]},{"id":"elastoplaste","n":"Elastoplaste","d":"","f":[],"dz":[],"g":null,"o":["ord-139"],"r":""},{"id":"eosine-aqueuse","n":"Eosine aqueuse","d":"éosine","f":["sol"],"dz":[],"g":"eosine","o":["ord-060"],"r":""},{"id":"ercefuryl","n":"Ercefuryl","d":"nifuroxazide","f":["gel"],"dz":["20mg"],"g":"nifuroxazide","o":["ord-044","ord-047"],"r":""},{"id":"erythromycine","n":"Erythromycine","d":"érythromycine","f":["cp"],"dz":["500mg"],"g":"erythromycine","o":["ord-059","ord-060"],"r":"","cl":"Antibiotique, macrolide","q":{"cl":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"pos":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ind":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"cix":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ei":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ma":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."}},"pos":"Adulte (valeur usuelle indicative) : 250–500 mg 4x/j","ind":"Infections respiratoires, cutanées, coqueluche, alternative en allergie à la pénicilline","cix":"Allongement QT, hépatopathie","ei":"Troubles digestifs, QT long, hépatite cholestatique","ma":"Inhibe la sous-unité 50S du ribosome","sr":[122],"nc":["Abboticine","Érythrocine"]},{"id":"esoprotion","n":"Esoprotion","d":"","f":["gel"],"dz":[],"g":null,"o":["ord-131"],"r":""},{"id":"eucarbon","n":"Eucarbon","d":"","f":["cp"],"dz":[],"g":null,"o":["ord-029"],"r":""},{"id":"eurax","n":"Eurax","d":"crotamiton","f":["Pde"],"dz":[],"g":"crotamiton","o":["ord-080"],"r":""},{"id":"extencilline","n":"Extencilline","d":"benzathine benzylpénicilline","f":["amp"],"dz":[],"g":"benzathine-benzylpenicilline","o":["ord-065"],"r":""},{"id":"feldene","n":"Feldene","d":"piroxicam","f":["inj"],"dz":[],"g":"piroxicam","o":["ord-093"],"r":""},{"id":"flagyl","n":"Flagyl","d":"métronidazole","f":["cp","inj","ovule"],"dz":["250mg","500mg"],"g":"metronidazole","o":["ord-001","ord-002","ord-019","ord-024","ord-045","ord-046","ord-080","ord-086","ord-140","ord-141","ord-142"],"r":"","cl":"Antibiotiques antibactériens et antiparasitaires, nitro-5-imidazolés (ATC J01XD01, P01AB01)","ind":"Infections à germes sensibles : amibiases, trichomonases urogénitales, vaginites non spécifiques, lambliases, traitement curatif des infections médico-chirurgicales à germes anaérobies sensibles, relais des traitements injectables des infections à anaérobies. Tenir compte des recommandations officielles sur l'usage des antibactériens.","ma":"Nitro-5-imidazolé à activité antibactérienne (germes anaérobies) et antiparasitaire (Entamoeba histolytica, Giardia intestinalis, Trichomonas vaginalis). Le RCP consulté ne détaille pas le mécanisme moléculaire.","pos":"Comprimé 250 mg, voie orale. Amibiase : adulte 1,5 g/j en 3 prises, enfant 30–40 mg/kg/j en 3 prises, 7 jours consécutifs. Trichomonase : femme, traitement mixte de 10 jours (0,5 g/j par voie orale en 2 prises + 1 ovule/j) ; homme 0,5 g/j en 2 prises pendant 10 jours (exceptionnellement 0,75–1 g/j) ; traiter le partenaire en même temps. Lambliase : adulte 0,75–1 g/j pendant 5 jours ; enfant 6–10 ans 375 mg/j, 10–15 ans 500 mg/j. Vaginites non spécifiques : 500 mg 2 fois par jour pendant 7 jours, avec traitement du partenaire. Infections à anaérobies : adulte 1–1,5 g/j, enfant 20–30 mg/kg/j. Autres présentations (ovule, suspension, injectable) : posologies propres, non incluses (À valider).","cix":"Hypersensibilité au métronidazole, aux imidazolés ou à un excipient. Pour les comprimés Flagyl : allergie au blé (hors maladie cœliaque) et enfant de moins de 6 ans (risque de fausse route).","ei":"Hématologiques : neutropénie, agranulocytose, thrombopénie. Psychiatriques : hallucinations, réactions psychotiques (paranoïa, délire, idées suicidaires), humeur dépressive. Neurologiques : neuropathies sensitives périphériques, céphalées, vertiges, confusion, convulsions, encéphalopathie (modifications d'IRM le plus souvent réversibles ; rares cas fatals), syndrome cérébelleux subaigu, méningite aseptique ; PRES (fréquence indéterminée). Oculaires : troubles visuels transitoires, névrite optique. Digestifs : douleurs épigastriques, nausées, vomissements, diarrhée, glossite, stomatite, troubles du goût, anorexie, pancréatite réversible. Hépatobiliaires : élévation des enzymes hépatiques, rares atteintes hépatiques aiguës (dont de rares insuffisances ayant nécessité une transplantation), hépatotoxicité sévère chez les patients atteints du syndrome de Cockayne. Cutanés : bouffées congestives, prurit, éruption, urticaire, œdème de Quincke, choc anaphylactique, très rares PEAG, syndromes de Lyell et de Stevens-Johnson, érythème pigmenté fixe. Cardiaques : allongement du QT (fréquence indéterminée). Urines brun-rougeâtre. Surdosage : jusqu'à 12 g rapportés (vomissements, ataxie, désorientation légère) ; pas d'antidote spécifique, traitement symptomatique.","pr":"Arrêt immédiat en cas de choc anaphylactique, de PEAG, de syndrome de Stevens-Johnson ou de Lyell (nouvelle administration contre-indiquée), de signes d'encéphalopathie ou de syndrome cérébelleux, de réaction psychotique. Surveiller les neuropathies périphériques (traitement prolongé, affection neurologique). Méningite aseptique sous métronidazole : réintroduction déconseillée, sauf infection grave après évaluation bénéfice/risque. Antécédents hématologiques, fortes doses ou traitement prolongé : contrôle régulier de la formule leucocytaire. Syndrome de Cockayne : utiliser seulement si le bénéfice dépasse le risque et sans alternative, avec bilan hépatique avant, pendant et après. Alcool déconseillé (effet antabuse). Conduite et machines : risque de vertiges, confusion, hallucinations, convulsions, troubles visuels. Interférences biologiques : faux positif du test de Nelson ; ALAT, ASAT, LDH, triglycérides et glucose possiblement faussement bas.","it":"Déconseillées : alcool (effet antabuse), busulfan à fortes doses (concentrations de busulfan doublées), disulfirame (psychose aiguë, confusion), médicaments allongeant le QT. Précautions d'emploi : anticonvulsivants inducteurs enzymatiques et rifampicine (concentrations de métronidazole diminuées : surveillance, adaptation éventuelle), lithium (lithémie pouvant devenir toxique : surveillance stricte). À prendre en compte : fluoro-uracile et apparentés (toxicité augmentée). Antivitamines K et antibiotiques : déséquilibre de l'INR rapporté.","pgr":"Peut être prescrit pendant la grossesse si besoin : pas d'effet tératogène chez l'animal, aucun effet malformatif ou fœtotoxique particulier apparent dans un nombre élevé de grossesses exposées (études épidémiologiques manquantes).","pal":"Passe dans le lait maternel : éviter l'administration pendant l'allaitement.","pen":"Comprimé contre-indiqué avant 6 ans (fausse route) : d'autres présentations existent pour le jeune enfant. Doses : amibiase 30–40 mg/kg/j en 3 prises ; lambliase 375 mg/j (6–10 ans) et 500 mg/j (10–15 ans) ; infections à anaérobies 20–30 mg/kg/j. La notice patient donne une fourchette usuelle moins détaillée : le RCP a été retenu.","q":{"cl":{"st":"av","s":[3,122],"n":"Divergence résolue : libellé de classe du Word plus général ; classification ATC du RCP de l'ANSM conservée. Valeur du Word non reprise : « Antibiotique/antiparasitaire, nitro-imidazolé »."},"ind":{"st":"av","s":[3,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Amibiase, giardiase, trichomonase, vaginose, anaérobies »."},"ma":{"st":"av","s":[3,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Dommages à l'ADN du microbe après réduction »."},"pos":{"st":"av","s":[3,122],"n":"Divergence résolue : la posologie orale du Word (1,2–1,5 g/j) est compatible avec le RCP ; la voie IV relève d'une autre présentation non lue. Valeur du RCP (comprimé 250 mg) conservée. Valeur du Word non reprise : « Adulte (valeur usuelle indicative) : PO 400–500 mg 3x/j ; IV 500 mg toutes les 8 h »."},"cix":{"st":"av","s":[3,122],"n":"NON RÉSOLUE : le Word contre-indique le 1er trimestre de la grossesse ; le RCP ANSM 2025 admet la prescription si besoin ; Merck Manual et une information suisse conseillent d'éviter ou contre-indiquent le 1er trimestre ; BCCDC 2025 : possible après discussion. Valeur du RCP français conservée, contradiction signalée au champ Grossesse. Valeur du Word non reprise : « 1er trim., alcool, hypersensibilité »."},"ei":{"st":"av","s":[3,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Goût métallique, nausées, neuropathie, effet antabuse »."},"pr":{"st":"av","s":[3]},"it":{"st":"av","s":[3]},"pgr":{"st":"cf","s":[3,12,13,14],"n":"Contradiction non résolue : le RCP ANSM 2025 admet la prescription pendant la grossesse si besoin ; le Manuel Merck conseille d'éviter le 1er trimestre, une information suisse le contre-indique, le BCCDC 2025 l'autorise après discussion et le document Word le contre-indique. Valeur du RCP français conservée ; à valider selon le référentiel national applicable."},"pal":{"st":"av","s":[3]},"pen":{"st":"av","s":[3]},"dci":{"st":"av","s":[3]}},"sr":[3,12,13,14,122],"nc":["Flagyl","Rozex"]},{"id":"flammazin oles nationaux)."},"pos":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ind":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"cix":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ei":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ma":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."}},"pos":"Adulte (valeur usuelle indicative) : 1–2 cp à croquer ou 10 mL après repas et au coucher","ind":"Brûlures d'estomac, reflux, dyspepsie","cix":"Insuffisance rénale sévère","ei":"Constipation (Al), diarrhée (Mg)","ma":"Neutralise l'acide gastrique","sr":[122],"nc":["Gaviscon","Gelusil","Maalox"]},{"id":"malathion","n":"Malathion","d":"malathion","f":["lotion"],"dz":[],"g":"malathion","o":["ord-114"],"r":""},{"id":"maxilase","n":"Maxilase","d":"alpha-amylase","f":["srp"],"dz":[],"g":"alpha-amylase","o":["ord-005","ord-105","ord-108"],"r":""},{"id":"mebo","n":"Mébo","d":"bêta-sitostérol","f":["crème"],"dz":[],"g":"beta-sitosterol","o":["ord-019"],"r":"Pommade cicatrisante (brûlures)"},{"id":"meteospasmyl","n":"Meteospasmyl","d":"alvérine + siméticone","f":["gel"],"dz":[],"g":"alverine-simeticone","o":["ord-029"],"r":""},{"id":"metronidazole","n":"Metronidazole","d":"métronidazole","f":["cp","ovule"],"dz":[],"g":"metronidazole","o":["ord-092"],"r":"","cl":"Antibiotiques antibactériens et antiparasitaires, nitro-5-imidazolés (ATC J01XD01, P01AB01)","ind":"Infections à germes sensibles : amibiases, trichomonases urogénitales, vaginites non spécifiques, lambliases, traitement curatif des infections médico-chirurgicales à germes anaérobies sensibles, relais des traitements injectables des infections à anaérobies. Tenir compte des recommandations officielles sur l'usage des antibactériens.","ma":"Nitro-5-imidazolé à activité antibactérienne (germes anaérobies) et antiparasitaire (Entamoeba histolytica, Giardia intestinalis, Trichomonas vaginalis). Le RCP consulté ne détaille pas le mécanisme moléculaire.","pos":"Comprimé 250 mg, voie orale. Amibiase : adulte 1,5 g/j en 3 prises, enfant 30–40 mg/kg/j en 3 prises, 7 jours consécutifs. Trichomonase : femme, traitement mixte de 10 jours (0,5 g/j par voie orale en 2 prises + 1 ovule/j) ; homme 0,5 g/j en 2 prises pendant 10 jours (exceptionnellement 0,75–1 g/j) ; traiter le partenaire en même temps. Lambliase : adulte 0,75–1 g/j pendant 5 jours ; enfant 6–10 ans 375 mg/j, 10–15 ans 500 mg/j. Vaginites non spécifiques : 500 mg 2 fois par jour pendant 7 jours, avec traitement du partenaire. Infections à anaérobies : adulte 1–1,5 g/j, enfant 20–30 mg/kg/j. Autres présentations (ovule, suspension, injectable) : posologies propres, non incluses (À valider).","cix":"Hypersensibilité au métronidazole, aux imidazolés ou à un excipient. Pour les comprimés Flagyl : allergie au blé (hors maladie cœliaque) et enfant de moins de 6 ans (risque de fausse route).","ei":"Hématologiques : neutropénie, agranulocytose, thrombopénie. Psychiatriques : hallucinations, réactions psychotiques (paranoïa, délire, idées suicidaires), humeur dépressive. Neurologiques : neuropathies sensitives périphériques, céphalées, vertiges, confusion, convulsions, encéphalopathie (modifications d'IRM le plus souvent réversibles ; rares cas fatals), syndrome cérébelleux subaigu, méningite aseptique ; PRES (fréquence indéterminée). Oculaires : troubles visuels transitoires, névrite optique. Digestifs : douleurs épigastriques, nausées, vomissements, diarrhée, glossite, stomatite, troubles du goût, anorexie, pancréatite réversible. Hépatobiliaires : élévation des enzymes hépatiques, rares atteintes hépatiques aiguës (dont de rares insuffisances ayant nécessité une transplantation), hépatotoxicité sévère chez les patients atteints du syndrome de Cockayne. Cutanés : bouffées congestives, prurit, éruption, urticaire, œdème de Quincke, choc anaphylactique, très rares PEAG, syndromes de Lyell et de Stevens-Johnson, érythème pigmenté fixe. Cardiaques : allongement du QT (fréquence indéterminée). Urines brun-rougeâtre. Surdosage : jusqu'à 12 g rapportés (vomissements, ataxie, désorientation légère) ; pas d'antidote spécifique, traitement symptomatique.","pr":"Arrêt immédiat en cas de choc anaphylactique, de PEAG, de syndrome de Stevens-Johnson ou de Lyell (nouvelle administration contre-indiquée), de signes d'encéphalopathie ou de syndrome cérébelleux, de réaction psychotique. Surveiller les neuropathies périphériques (traitement prolongé, affection neurologique). Méningite aseptique sous métronidazole : réintroduction déconseillée, sauf infection grave après évaluation bénéfice/risque. Antécédents hématologiques, fortes doses ou traitement prolongé : contrôle régulier de la formule leucocytaire. Syndrome de Cockayne : utiliser seulement si le bénéfice dépasse le risque et sans alternative, avec bilan hépatique avant, pendant et après. Alcool déconseillé (effet antabuse). Conduite et machines : risque de vertiges, confusion, hallucinations, convulsions, troubles visuels. Interférences biologiques : faux positif du test de Nelson ; ALAT, ASAT, LDH, triglycérides et glucose possiblement faussement bas.","it":"Déconseillées : alcool (effet antabuse), busulfan à fortes doses (concentrations de busulfan doublées), disulfirame (psychose aiguë, confusion), médicaments allongeant le QT. Précautions d'emploi : anticonvulsivants inducteurs enzymatiques et rifampicine (concentrations de métronidazole diminuées : surveillance, adaptation éventuelle), lithium (lithémie pouvant devenir toxique : surveillance stricte). À prendre en compte : fluoro-uracile et apparentés (toxicité augmentée). Antivitamines K et antibiotiques : déséquilibre de l'INR rapporté.","pgr":"Peut être prescrit pendant la grossesse si besoin : pas d'effet tératogène chez l'animal, aucun effet malformatif ou fœtotoxique particulier apparent dans un nombre élevé de grossesses exposées (études épidémiologiques manquantes).","pal":"Passe dans le lait maternel : éviter l'administration pendant l'allaitement.","pen":"Comprimé contre-indiqué avant 6 ans (fausse route) : d'autres présentations existent pour le jeune enfant. Doses : amibiase 30–40 mg/kg/j en 3 prises ; lambliase 375 mg/j (6–10 ans) et 500 mg/j (10–15 ans) ; infections à anaérobies 20–30 mg/kg/j. La notice patient donne une fourchette usuelle moins détaillée : le RCP a été retenu.","q":{"cl":{"st":"av","s":[3,122],"n":"Divergence résolue : libellé de classe du Word plus général ; classification ATC du RCP de l'ANSM conservée. Valeur du Word non reprise : « Antibiotique/antiparasitaire, nitro-imidazolé »."},"ind":{"st":"av","s":[3,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Amibiase, giardiase, trichomonase, vaginose, anaérobies »."},"ma":{"st":"av","s":[3,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Dommages à l'ADN du microbe après réduction »."},"pos":{"st":"av","s":[3,122],"n":"Divergence résolue : la posologie orale du Word (1,2–1,5 g/j) est compatible avec le RCP ; la voie IV relève d'une autre présentation non lue. Valeur du RCP (comprimé 250 mg) conservée. Valeur du Word non reprise : « Adulte (valeur usuelle indicative) : PO 400–500 mg 3x/j ; IV 500 mg toutes les 8 h »."},"cix":{"st":"av","s":[3,122],"n":"NON RÉSOLUE : le Word contre-indique le 1er trimestre de la grossesse ; le RCP ANSM 2025 admet la prescription si besoin ; Merck Manual et une information suisse conseillent d'éviter ou contre-indiquent le 1er trimestre ; BCCDC 2025 : possible après discussion. Valeur du RCP français conservée, contradiction signalée au champ Grossesse. Valeur du Word non reprise : « 1er trim., alcool, hypersensibilité »."},"ei":{"st":"av","s":[3,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Goût métallique, nausées, neuropathie, effet antabuse »."},"pr":{"st":"av","s":[3]},"it":{"st":"av","s":[3]},"pgr":{"st":"cf","s":[3,12,13,14],"n":"Contradiction non résolue : le RCP ANSM 2025 admet la prescription pendant la grossesse si besoin ; le Manuel Merck conseille d'éviter le 1er trimestre, une information suisse le contre-indique, le BCCDC 2025 l'autorise après discussion et le document Word le contre-indique. Valeur du RCP français conservée ; à valider selon le référentiel national applicable."},"pal":{"st":"av","s":[3]},"pen":{"st":"av","s":[3]}},"sr":[3,12,13,14,122],"nc":["Flagyl","Rozex"]},{"id":"microlax","n":"Microlax","d":"citrate de sodium + laurylsulfoacétate + sorbitol","f":[],"dz":[],"g":"citrate-de-sodium-laurylsulfoacetate-sorbitol","o":["ord-034"],"r":""},{"id":"mopral","n":"Mopral","d":"oméprazole","f":["gel"],"dz":["200mg"],"g":"omeprazole","o":["ord-142"],"r":"","cl":"Inhibiteurs de la pompe à protons (ATC A02BC01)","ind":"Adulte : traitement des ulcères duodénaux et gastriques et prévention de leurs récidives ; éradication d'Helicobacter pylori avec des antibiotiques appropriés ; ulcères gastroduodénaux associés aux AINS (traitement, et prévention chez les patients à risque) ; œsophagite par reflux (traitement et entretien) ; reflux gastro-œsophagien symptomatique ; syndrome de Zollinger-Ellison. Enfant à partir d'un an et ≥ 10 kg : œsophagite par reflux, pyrosis et régurgitations acides ; enfant de plus de 4 ans et adolescent : ulcère duodénal à H. pylori, avec antibiotiques.","ma":"Inhibiteur spécifique de la pompe à protons (H+/K+-ATPase) de la cellule pariétale gastrique : réduit la sécrétion acide basale et stimulée, de façon dose-dépendante. Base faible concentrée et activée dans le milieu acide des canalicules de la cellule pariétale ; inhibition réversible avec une prise par jour, effet maximal après 4 jours.","pos":"Gélule 20 mg, adulte, le matin, à avaler entière avec un demi-verre d'eau (gélule ouvrable en cas de difficulté de déglutition, granulés non mâchés). Ulcère duodénal : 20 mg/j (cicatrisation en général en 2 semaines, 2 semaines de plus si besoin ; 40 mg/j si faible réponse, environ 4 semaines). Ulcère gastrique : 20 mg/j (4 semaines, 4 de plus si besoin ; 40 mg/j si faible réponse, environ 8 semaines). Prévention des récidives : 20 mg/j (10 mg parfois suffisant ; 40 mg si échec). Éradication d'H. pylori : 20 mg deux fois par jour pendant une semaine avec deux antibiotiques (par exemple clarithromycine 500 mg + amoxicilline 1 g, chacun deux fois par jour), en tenant compte des résistances et recommandations. Ulcères liés aux AINS : 20 mg/j (4 semaines, 4 de plus si besoin) ; prévention chez le patient à risque (> 60 ans, antécédent d'ulcère ou d'hémorragie digestive) : 20 mg/j. Œsophagite par reflux : 20 mg/j (4 semaines, 4 de plus si besoin), 40 mg/j si sévère (8 semaines) ; entretien : 10 mg/j (20–40 mg si nécessaire). RGO symptomatique : 20 mg/j (10 mg parfois suffisant) ; investigations si symptômes non contrôlés après 4 semaines. Zollinger-Ellison : 60 mg/j au départ, ajusté ; au-delà de 80 mg/j, en 2 prises.","cix":"Hypersensibilité à l'oméprazole, aux dérivés benzimidazolés ou à un excipient ; association avec le nelfinavir. La notice cite aussi l'allergie à un autre inhibiteur de la pompe à protons. Association avec la rilpivirine (contre-indication inscrite au RCP de la rilpivirine).","ei":"Les plus fréquents (1 à 10 %) : céphalées, douleurs abdominales, constipation, diarrhée, flatulences, nausées/vomissements, polypes bénins des glandes fundiques. Peu fréquents : insomnie, étourdissements, paresthésies, somnolence, vertiges, élévation des enzymes hépatiques, dermatite, prurit, rash, urticaire, fractures (hanche, poignet, vertèbres), malaise, œdème périphérique. Rares : leucopénie, thrombopénie, hypersensibilité (angio-œdème, choc anaphylactique), hyponatrémie, agitation, confusion, dépression, troubles du goût, vision trouble, bronchospasme, sécheresse buccale, stomatite, candidose digestive, hépatite, alopécie, photosensibilité, PEAG, DRESS, arthralgies, myalgies, néphrite tubulo-interstitielle, sudation. Très rares : agranulocytose, pancytopénie, agressivité, hallucinations, insuffisance hépatique, érythème polymorphe, Stevens-Johnson, Lyell, faiblesse musculaire, gynécomastie. Fréquence indéterminée : hypomagnésémie (parfois avec hypocalcémie et hypokaliémie), colite microscopique, lupus érythémateux cutané subaigu. Surdosage : effets transitoires (nausées, vomissements, étourdissements, douleurs abdominales, diarrhée, céphalées), traitement symptomatique.","pr":"Symptômes d'alarme (perte de poids involontaire, vomissements répétés, dysphagie, hématémèse, méléna) ou ulcère gastrique suspecté : écarter une lésion maligne avant traitement. Atazanavir : association non recommandée. Réduction possible de l'absorption de la vitamine B12 au long cours. Inhibiteur du CYP2C19 ; association avec le clopidogrel déconseillée. Hypomagnésémie possible après au moins 3 mois : dosage du magnésium avant et pendant un traitement prolongé ou associé à la digoxine ou aux diurétiques. Réactions cutanées sévères (Stevens-Johnson, NET, DRESS, PEAG) : arrêt. Risque modérément accru de fractures (hanche, poignet, vertèbres) en cas de fortes doses et de traitement > 1 an. Lupus cutané subaigu : arrêt si lésions sur zones exposées. Néphrite tubulo-interstitielle : arrêt si suspicion. Chromogranine A : arrêter l'oméprazole au moins 5 jours avant le dosage. Enfant : traitement long déconseillé, risque légèrement accru d'infections digestives. Contient du lactose.","it":"Contre-indiquée : nelfinavir ; rilpivirine (RCP EDURANT : IPP dont l'oméprazole contre-indiqués, baisse d'absorption de la rilpivirine). Déconseillées ou à éviter : atazanavir, clopidogrel, posaconazole, erlotinib. Absorption diminuée : kétoconazole, itraconazole. Surveillance : digoxine (biodisponibilité +10 %, prudence chez le sujet âgé à fortes doses), phénytoïne (concentrations pendant les 2 premières semaines), antivitamines K dont la warfarine (INR), cilostazol (exposition augmentée), tacrolimus (concentrations et fonction rénale), saquinavir, méthotrexate (arrêt temporaire possible à forte dose). Concentrations d'oméprazole augmentées par les inhibiteurs du CYP2C19/3A4 (clarithromycine, voriconazole) et diminuées par les inducteurs (rifampicine, millepertuis).","pen":"Enfant à partir d'un an et ≥ 10 kg (œsophagite par reflux, pyrosis et régurgitations) : 10–20 kg : 10 mg une fois par jour (20 mg si nécessaire) ; ≥ 2 ans et > 20 kg : 20 mg une fois par jour (40 mg si nécessaire) ; durée 4 à 8 semaines pour l'œsophagite, 2 à 4 semaines pour les symptômes. Enfant de plus de 4 ans et adolescent, ulcère duodénal à H. pylori (suivi par un spécialiste, 7 jours, parfois 14) : 15–30 kg : oméprazole 10 mg + amoxicilline 25 mg/kg + clarithromycine 7,5 mg/kg ; 31–40 kg : 20 mg + amoxicilline 750 mg + clarithromycine 7,5 mg/kg ; > 40 kg : 20 mg + amoxicilline 1 g + clarithromycine 500 mg, le tout deux fois par jour. Non recommandé avant 1 an ou \u003c 10 kg (notice).","pgr":"Peut être utilisé pendant la grossesse : trois études épidémiologiques prospectives (plus de 1 000 grossesses exposées) n'indiquent aucun effet indésirable sur la grossesse ni sur le fœtus ou le nouveau-né.","pal":"Excrété dans le lait maternel, mais probablement sans influence sur l'enfant aux doses thérapeutiques.","pag":"Aucune adaptation posologique nécessaire (métabolisme légèrement réduit à 75–79 ans).","pir":"Aucun ajustement posologique nécessaire en cas d'insuffisance rénale.","pih":"Une dose journalière de 10 à 20 mg peut suffire ; un ajustement peut être nécessaire en cas d'insuffisance hépatique sévère avec traitement prolongé.","q":{"cl":{"st":"av","s":[16,122],"n":"Divergence résolue : libellé de classe du Word plus général ; classification ATC du RCP de l'ANSM conservée. Valeur du Word non reprise : « Inhibiteur de la pompe à protons »."},"ind":{"st":"av","s":[16,122],"n":"Divergence résolue : l'hémorragie digestive du Word relève de la forme injectable (non lue) ; le RCP lu concerne la gélule 20 mg. Indications du RCP conservées. Valeur du Word non reprise : « RGO, ulcère, Helicobacter, hémorragie digestive »."},"ma":{"st":"av","s":[16,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Inhibe H+/K+-ATPase gastrique »."},"pos":{"st":"av","s":[16,122],"n":"Divergence résolue : le Word (20–40 mg/j) est compatible avec le RCP MOPRAL ; la voie IV relève d'une autre présentation non lue. Valeur du RCP conservée. Valeur du Word non reprise : « Adulte (valeur usuelle indicative) : 20–40 mg/j ; IV 40 mg »."},"cix":{"st":"av","s":[16,17,122],"n":"Complété à partir du RCP EDURANT (EMA, rubrique 4.3), cité par le document Word : association avec la rilpivirine contre-indiquée. Absente du RCP MOPRAL lu. Divergence résolue : la rilpivirine citée par le Word est confirmée par le RCP EDURANT (EMA, rubrique 4.3 : IPP dont l'oméprazole contre-indiqués) ; ajoutée aux contre-indications et aux interactions de la fiche. Valeur du Word non reprise : « Hypersensibilité, rilpivirine »."},"ei":{"st":"av","s":[16,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Céphalées, diarrhée, hypomagnésémie (long cours
