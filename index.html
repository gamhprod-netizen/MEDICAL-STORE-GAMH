<script id="d" type="application/json">{"p":[{"id":"abces-peri-anal","n":"Abcès péri-anal","o":["ord-001"]},{"id":"abces-collecte","n":"Abcès collecté","o":["ord-002"],"df":"Poche de pus sous la peau, causée par une infection bactérienne, le plus souvent à staphylocoques ; la bactérie pénètre par une lésion cutanée ou un follicule pileux. Le furoncle (abcès autour d'un follicule pileux) et l'anthrax staphylococcique (plusieurs furoncles liés sous la peau) en sont deux formes. Terrain favorisant : âge avancé, lésions cutanées, obésité, diabète, immunodépression.","sc":"Bosse rouge, gonflée, très douloureuse et sensible au toucher. Furoncle : rouge, brillant, en général \u003c 2,5 cm ; autres abcès : jusqu'à 5 à 7 cm. Sans traitement, l'abcès grossit, s'ouvre et le pus s'écoule. Fièvre et nausées possibles.","sa":"Extension de l'infection à la peau voisine (cellulite). Passage des bactéries dans le sang (septicémie) : forte fièvre, hypotension, atteinte de certains organes. Abcès multiples ou terrain immunodéprimé : antibiothérapie à discuter.","ct":"Petit abcès : chaleur douce locale (linge tiède, bouillotte). En cas d'échec : incision et drainage du pus, nettoyage au sérum physiologique, parfois mèche de gaze 1 à 2 jours pour laisser le pus s'écouler. La majorité des abcès cutanés ne nécessitent pas d'antibiotiques ; en prescrire en cas d'abcès nombreux, d'extension à la peau voisine (cellulite) ou de système immunitaire affaibli. Abcès récidivants : lavage avec un savon antiseptique liquide, antibiotiques pendant 1 à 2 mois, éventuellement bilan sanguin. La source ne donne pas de doses.","q":{"df":{"st":"av","s":[86],"n":"Complété par : Claude (IA) d'après le Manuel MSD. Page MSD sur les abcès cutanés (peau). Abcès profonds ou viscéraux non couverts par cette source."},"sc":{"st":"av","s":[86]},"sa":{"st":"av","s":[86]},"ct":{"st":"av","s":[86]}},"sr":[86]},{"id":"adenome-de-la-prostate","n":"Adénome de la prostate","o":["ord-003"]},{"id":"allergie","n":"Allergie","o":["ord-004"]},{"id":"angine-bacterienne","n":"Angine bactérienne","o":["ord-005"],"df":"Inflammation aiguë des amygdales et du pharynx, due principalement au streptocoque du groupe A pour les formes bactériennes ; touche surtout les enfants de 3 à 14 ans. Le rhumatisme articulaire aigu (RAA), complication grave et tardive, peut être prévenu par l'antibiothérapie.","sc":"Mal de gorge, dysphagie, inflammation des amygdales et du pharynx, adénopathies cervicales antérieures sensibles, avec ou sans fièvre. Angine érythémateuse (gorge rouge) ou érythémato-pultacée (enduit blanchâtre), aspect commun aux formes virales et streptococciques. Critères de Centor (1 point chacun) : température > 38 °C, absence de toux, adénopathie cervicale sensible, atteinte amygdalienne (augmentation de volume ou exsudat). Scarlatine : langue rouge écarlate « framboisée » avec éruption cutanée (streptocoque A). Chez le patient de plus de 14 ans, la probabilité d'angine streptococcique est faible.","sa":"Complications locales : abcès péri-amygdalien, rétro-pharyngé ou latéral (fièvre, douleurs intenses, dysphagie, voix étouffée, trismus, déviation unilatérale de la luette). Complications générales : RAA, glomérulonéphrite aiguë. Signes de gravité chez l'enfant : déshydratation sévère, gêne importante à la déglutition, atteinte respiratoire haute, altération de l'état général. Autres formes à reconnaître : angine pseudo-membraneuse (diphtérie), épiglottite.","ct":"Critères de Centor ≥ 2 ou scarlatine : antibiothérapie anti-streptococcique. Benzathine benzylpénicilline IM en dose unique si matériel à usage unique disponible (enfant \u003c 30 kg ou \u003c 10 ans : 600 000 UI ; ≥ 30 kg ou ≥ 10 ans et adulte : 1,2 MUI). Pénicilline V per os pendant 10 jours (\u003c 1 an : 125 mg 2 fois/j ; 1 à \u003c 6 ans : 250 mg 2 fois/j ; 6 à \u003c 12 ans : 500 mg 2 fois/j ; ≥ 12 ans et adulte : 1 g 2 fois/j). Amoxicilline per os pendant 6 jours (enfant : 25 mg/kg 2 fois/j ; adulte : 1 g 2 fois/j), à éviter si une mononucléose infectieuse n'est pas écartée. Macrolides réservés aux allergiques à la pénicilline (azithromycine 3 jours : enfant 20 mg/kg/j, max 500 mg ; adulte 500 mg/j). Facteurs de risque post-streptococciques (immunodépression, antécédent personnel ou familial de RAA) ou complications : antibiothérapie d'emblée, sans passer par les critères de Centor. Abcès péri-amygdalien, rétro-pharyngé ou latéral : référer pour drainage chirurgical. Signes de gravité ou épiglottite chez l'enfant : hospitaliser.","q":{"df":{"st":"av","s":[22]},"sc":{"st":"av","s":[22]},"sa":{"st":"av","s":[22]},"ct":{"st":"av","s":[22]}},"sr":[22]},{"id":"angine-virale","n":"Angine virale","o":["ord-006"],"df":"Inflammation aiguë des amygdales et du pharynx, d'origine virale dans la majorité des cas ; elle ne nécessite pas d'antibiotique. Guérison en général spontanée en quelques jours (ou semaines en cas de mononucléose infectieuse).","sc":"Mal de gorge, dysphagie, inflammation des amygdales et du pharynx, adénopathies cervicales antérieures sensibles, avec ou sans fièvre. Angine érythémateuse ou érythémato-pultacée (commune aux formes virales et streptococciques). Angine vésiculeuse (bouquets de petites vésicules ou ulcérations sur les amygdales) : toujours virale (virus coxsackie ou primo-infection herpétique). Mononucléose infectieuse (virus d'Epstein-Barr) à suspecter chez l'adolescent ou l'adulte jeune avec fatigue intense et adénopathies diffuses, souvent splénomégalie. Une angine érythémateuse peut aussi survenir lors de la primo-infection par le VIH.","sa":"Signes de gravité chez l'enfant : déshydratation sévère, gêne importante à la déglutition, atteinte respiratoire haute, altération de l'état général. Complications locales : abcès péri-amygdalien, rétro-pharyngé ou latéral (fièvre, douleurs intenses, dysphagie, voix étouffée, trismus). Rechercher une angine pseudo-membraneuse (diphtérie) ou une épiglottite chez l'enfant.","ct":"Critères de Centor ≤ 1 : angine virale, pas d'antibiothérapie ; guérison en général spontanée en quelques jours. Si Centor ≥ 2 ou scarlatine : traiter comme une angine streptococcique. Mononucléose infectieuse : éviter l'amoxicilline (réactions cutanées). Abcès : référer pour drainage chirurgical. Signes de gravité ou épiglottite chez l'enfant : hospitaliser. Le traitement symptomatique n'est pas détaillé dans la source consultée (à compléter).","q":{"df":{"st":"av","s":[22]},"sc":{"st":"av","s":[22]},"sa":{"st":"av","s":[22]},"ct":{"st":"av","s":[22]}},"sr":[22]},{"id":"anite","n":"Anite","o":["ord-007"]},{"id":"anthrax","n":"Anthrax","o":["ord-008"]},{"id":"appendicite","n":"Appendicite","o":["ord-009"]},{"id":"asthenie","n":"Asthénie","o":["ord-010"]},{"id":"asthme","n":"Asthme","o":["ord-011"],"sc":"L'asthme doit être suspecté chez un patient se plaignant de symptômes respiratoires récurrents (respiration sifflante, essoufflement, oppression thoracique et/ou toux), de fréquence, gravité et durée variables, le réveillant la nuit et l'obligeant à s'asseoir pour respirer ; ils peuvent apparaître pendant ou après un effort. L'auscultation peut être normale ou retrouver des râles sibilants diffus. Des antécédents personnels ou familiaux d'atopie (eczéma, rhinite/conjonctivite allergique) ou familiaux d'asthme renforcent la probabilité, leur absence n'exclut pas le diagnostic. Après exclusion d'autres diagnostics, les patients ayant des signes typiques et des antécédents évocateurs sont considérés comme asthmatiques.","sa":"Une crise d'asthme sévère ou la perte de contrôle des symptômes impose de réévaluer le traitement. Signes de crise sévère ou engageant le pronostic vital : voir la fiche « Crise d'asthme » (incapacité à finir une phrase, fréquence respiratoire > 30/min, SpO2 \u003c 90 %, altération de la conscience, silence auscultatoire, cyanose).","ct":"Traitement de fond selon la sévérité (enfant ≥ 6 ans et adulte), fondé sur les corticoïdes inhalés et les bêta-2 agonistes de longue durée d'action (LABA, jamais seuls). Asthme intermittent (symptômes diurnes \u003c 2 fois/mois) : béclométasone/formotérol en cas de symptômes (≥ 12 ans) ou salbutamol (6–11 ans). Persistant léger : béclométasone/formotérol en cas de symptômes, ou béclométasone faible dose quotidienne + salbutamol à la demande. Persistant modéré : béclométasone/formotérol faible dose quotidienne et à la demande (≥ 12 ans). Persistant sévère : dose moyenne. Salbutamol 100 µg/bouffée : 2 à 4 bouffées jusqu'à 4 fois par jour si besoin. Chez l'enfant, utiliser une chambre d'inhalation ; éduquer à la technique d'inhalation et aux symptômes de crise. Éliminer les facteurs de risque (allergène, pollution, tabac). Symptômes mal contrôlés depuis 2 à 3 mois : vérifier technique et observance avant de passer au palier supérieur ; bien contrôlés depuis au moins 3 mois : réduire progressivement. Ne pas restreindre l'activité physique (1 à 2 bouffées de salbutamol 10 minutes avant l'effort). Grossesse : poursuivre le traitement de fond sous surveillance étroite (un asthme mal contrôlé augmente les risques maternels et fœtaux).","q":{"sc":{"st":"av","s":[24]},"sa":{"st":"av","s":[24]},"ct":{"st":"av","s":[24]},"df":{"st":"av","s":[24],"n":"Définition non retrouvée dans la source consultée (guide MSF) : à compléter par une source officielle (OMS, GINA, HAS)."}},"sr":[24]},{"id":"balanite","n":"Balanite","o":["ord-012"]},{"id":"blepharite","n":"Blépharite","o":["ord-013"],"df":"Inflammation du bord libre de la paupière, avec écailles, croûtes, ulcérations superficielles ou inflammation des glandes sébacées du bord palpébral. Causes : infection bactérienne (typiquement staphylocoque), infection virale (surtout herpès simplex), réaction allergique (pollen, maquillage, collyres), maladies de la peau (dermatite séborrhéique, rosacée, eczéma), obstruction des glandes tarsiennes (Meibomius), infestation par Demodex ; parfois idiopathique.","sc":"Sensation de corps étranger, yeux et paupières qui grattent ou brûlent, bord palpébral rouge, larmoiement, sensibilité à la lumière. Démangeaisons plus fréquentes si cause allergique. Forme bactérienne aiguë : paupières gonflées, cils blanchis ou qui tombent, petites pustules, croûtes collant les paupières au réveil. Forme chronique (glandes obstruées) : orgelets ou chalazions fréquents, sécheresse oculaire possible. Tendance aux récidives.","sa":"Blépharite touchant une seule paupière avec perte de cils : rechercher un cancer de la paupière. La blépharite ulcéreuse peut laisser perte de cils et cicatrices et, rarement, atteindre la cornée.","ct":"Mesures de soutien : larmes artificielles le jour, pommade lubrifiante la nuit ; compresse humide (froide si allergie ou contact, chaude pour les autres causes) ; nettoyage doux des bords palpébraux 2 fois par jour (shampooing bébé dilué : 2 à 3 gouttes dans un demi-verre d'eau tiède, ou lingettes à l'huile d'arbre à thé / acide hypochloreux) ; massage des paupières si glandes de Meibomius obstruées. Traiter la cause : arrêter le collyre en cause ; blépharite ulcéreuse bactérienne : pommade ou collyre antibiotique (bacitracine, polymyxine B, gentamicine, érythromycine, sulfacétamide) ou doxycycline orale, en général sans stéroïdes ; blépharite virale : antiviral oral (valaciclovir) ; dermatite séborrhéique : traiter aussi visage et cuir chevelu ; suspicion de Demodex : ectoparasiticide ; pommade corticoïde en cas d'échec des mesures. La source ne donne pas de doses.","q":{"df":{"st":"av","s":[107],"n":"Complété par : Claude (IA) d'après le Manuel MSD."},"sc":{"st":"av","s":[107]},"sa":{"st":"av","s":[107]},"ct":{"st":"av","s":[107]}},"sr":[107]},{"id":"bouchon-de-cerumen","n":"Bouchon de cérumen","o":["ord-014"]},{"id":"bouffee-de-chaleur-chez-une-femme-menopausee","n":"Bouffée de chaleur chez une femme ménopausée","o":["ord-015"]},{"id":"bronchite-aigue","n":"Bronchite aigue","o":["ord-016","ord-017","ord-018"],"df":"Inflammation aiguë de la muqueuse bronchique, d'origine virale le plus souvent, parfois due à Mycoplasma pneumoniae chez le grand enfant.","sc":"Début souvent par une rhinopharyngite qui « descend » (pharyngite, laryngite, trachéite puis trachéo-bronchite) ; toux importante, sèche au début puis productive ; fièvre modérée ; pas de tachypnée ni de dyspnée ; râles bronchiques à l'examen pulmonaire.","sa":"Apparition d'une dyspnée avec fièvre > 38,5 °C et expectoration purulente : surinfection bactérienne probable (Haemophilus influenzae ou pneumocoque). Mauvais terrain : malnutrition, rougeole, rachitisme, anémie sévère, cardiopathie, patient âgé. Bronchites aiguës à répétition ou « sifflantes » chez l'enfant de plus de 2 ans : évoquer un asthme ; enfant de moins de 2 ans : penser à une bronchiolite.","ct":"Fièvre : paracétamol per os. Bien hydrater, humidifier l'atmosphère ; chez l'enfant, désobstruction du rhinopharynx par lavage au chlorure de sodium 0,9 % ou Ringer lactate 4 à 6 fois/j. Bon terrain ou contexte de rhinopharyngite/grippe : antibiotiques inutiles. Antibiothérapie uniquement en cas de mauvais terrain ou de surinfection probable : amoxicilline per os 5 jours (enfant 30 mg/kg 3 fois/j, max 3 g/j ; adulte 1 g 3 fois/j).","q":{"df":{"st":"av","s":[32]},"sc":{"st":"av","s":[32]},"sa":{"st":"av","s":[32]},"ct":{"st":"av","s":[32]}},"sr":[32]},{"id":"brulure","n":"Brulure","o":["ord-019"],"df":"Lésion traumatique de la peau, parfois des tissus sous-jacents, d'origine thermique, chimique ou électrique. À évaluer selon quatre points : étiologie, localisation, profondeur, étendue.","sc":"**Profondeur** : 1er degré = érythème douloureux sans phlyctène (comme un coup de soleil) ; 2e degré = phlyctènes ; 3e degré = lésion peu sensible, souvent phlyctènes rompues, voire carbonisation. À l'arrivée, seule la brûlure du 1er degré et la brûlure très profonde sont identifiables avec certitude ; la distinction entre 2e degré superficiel et profond ne doit pas être faite en urgence (erreurs fréquentes). Guérison spontanée en 5 à 15 jours pour les brûlures superficielles ; brûlures intermédiaires : guérison éventuelle en 3 à 5 semaines avec risque élevé d'infection et de séquelles ; brûlures très profondes : pas de guérison sans chirurgie. **Étendue** : comptée dès le 2e degré ; la paume de la main, doigts compris, équivaut à environ 1 % de la surface corporelle ; table de Lund-Browder selon l'âge.","sa":"**Brûlure grave (MSF)** : surface brûlée supérieure à 10 % chez l'enfant et à 15 % chez l'adulte ; brûlures électriques, chimiques ou par explosion. **Hospitalisation (HUG)** : 3e degré, 2e degré de plus de 10 % ; à plus de 10 % de surface brûlée, l'hémodynamique est atteinte. **Localisations à problème** : mains, pieds, face, régions périorificielles (bouche, anus), brûlures circulaires des membres ou du cou, inhalation de fumées, enfant de moins de 1 an, suspicion de maltraitance. Brûlures oculaires ou de zones fonctionnelles à évaluer.","ct":"**Brûlure grave (MSF)** : évaluer étendue, profondeur, carbonisation, brûlures oculaires ou de zones fonctionnelles, caractère circulaire ; morphine SC 0,2 mg/kg (antalgiques de niveaux 1 et 2 inefficaces) ; sonde urinaire si surface brûlée supérieure à 15 %, électrisation ou brûlure du périnée ; sonde nasogastrique si surface brûlée supérieure à 20 % ; premier pansement au bloc opératoire. **Gestes initiaux (HUG)** : retirer les vêtements non adhérents ; brûlure thermique : recouvrir de compresses imbibées de NaCl 0,9 % à température ambiante ; brûlure chimique : laver abondamment à l'eau tiède ; attention au risque d'hypothermie chez le jeune enfant et la personne âgée ; pas de refroidissement ni de trempage en cas de brûlure électrique ; antalgiques ; avis chirurgical sans délai selon la clinique. Pansement, antalgiques de la brûlure minime et indications de suivi : à compléter avec le guide MSF « Brûlures » (page non consultée en entier).","q":{"df":{"st":"av","s":[66,67,68]},"sc":{"st":"av","s":[66,67,68]},"sa":{"st":"av","s":[66,67,68]},"ct":{"st":"av","s":[66,67,68]}},"sr":[66,67,68]},{"id":"candidose-cutanee","n":"Candidose cutanée","o":["ord-020"],"df":"Infection de la peau par la levure Candida, normalement présente sur la peau, dans la bouche, le tube digestif et le vagin. Elle touche surtout les zones humides : contour de la bouche, aine, aisselles, espaces entre doigts et orteils, sous les seins, plis du ventre, ongles. Favorisée par : climat chaud et humide, sous-vêtements synthétiques serrés, manque d'hygiène, couches ou sous-vêtements changés trop rarement, diabète, immunodépression (VIH avancé, corticoïdes, immunosuppresseurs), grossesse, obésité, antibiotiques, autres maladies de peau (intertrigo, psoriasis).","sc":"Plis cutanés ou ombilic : éruption rouge vif, parfois peau fissurée, petites pustules surtout sur les bords, démangeaisons intenses ou brûlure. Autour de l'anus : zone à vif, blanchâtre ou rougeâtre, avec démangeaisons. Nourrisson : érythème fessier à Candida.","sa":"Chez certaines personnes, surtout immunodéprimées, Candida peut gagner les tissus profonds et le sang : candidose systémique potentiellement mortelle.","ct":"Crème, poudre ou solution antimycosique locale (miconazole, clotrimazole, oxiconazole, kétoconazole, éconazole, ciclopirox, nystatine) ; garder la zone sèche (solution de Burow, antitranspirants locaux) pour guérir et éviter les récidives ; si de nombreux plis sont infectés : antimycosique oral (fluconazole). La source ne donne pas de doses. Érythème fessier : changer plus souvent les couches (super-absorbantes), crème antimycosique (butoconazole, clotrimazole, fluconazole, kétoconazole, miconazole) et crème barrière à l'oxyde de zinc.","q":{"df":{"st":"av","s":[108],"n":"Complété par : Claude (IA) d'après le Manuel MSD. Page MSD « Candidose » : le muguet et la candidose vaginale y sont aussi traités (non repris ici). La ligne générique « Candidose » est laissée vide (localisation non précisée)."},"sc":{"st":"av","s":[108]},"sa":{"st":"av","s":[108]},"ct":{"st":"av","s":[108]}},"sr":[108]},{"id":"candidose","n":"Candidose","o":["ord-021"]},{"id":"cellulite","n":"Cellulite","o":["ord-022"]},{"id":"chalazion","n":"Chalazion","o":["ord-023"],"df":"Petit kyste de la paupière provoqué par l'obstruction d'une glande sébacée ; ce n'est pas une infection.","sc":"Petite grosseur de la paupière, parfois rouge, enflée, irritée ou sensible ; gonflement qui augmente lentement, non douloureux dans la description illustrée. Les symptômes disparaissent en général en quelques jours, mais la grosseur peut persister jusqu'à 8 semaines.","ct":"Compresse humide, tiède et propre sur la paupière 5 à 10 minutes, 2 à 3 fois par jour ; ne pas tenter de percer ; nettoyer les paupières au savon doux et à l'eau ; ne pas porter de lentilles ni de maquillage des yeux jusqu'à guérison. Disparaît en général spontanément en 2 à 8 semaines. Si le chalazion persiste plus de 8 semaines : ponction du liquide ou injection de corticoïdes dans la paupière par le médecin. La source ne donne pas de doses.","q":{"df":{"st":"av","s":[109],"n":"Complété par : Claude (IA) d'après le Manuel MSD. Page « Les faits en bref » : signes d'alarme non précisés, champ laissé vide."},"sc":{"st":"av","s":[109]},"ct":{"st":"av","s":[109]},"sa":{"st":"av","s":[],"n":"Champ laissé vide par la source consultée : à compléter. Page « Les faits en bref » : signes d'alarme non précisés, champ laissé vide."}},"sr":[109]},{"id":"cholecystite","n":"Cholécystite","o":["ord-024"]},{"id":"cocktail-antalgique","n":"Cocktail antalgique","o":["ord-025"]},{"id":"colique-nephretique","n":"Colique néphrétique","o":["ord-026","ord-027"],"df":"La lithiase urinaire est la formation et l'élimination de calculs dans les voies urinaires. La colique néphrétique en est la manifestation douloureuse, lorsque le calcul entraîne une obstruction partielle ou complète des voies urinaires.","sc":"Douleurs lombaires ou pelviennes aiguës intermittentes, parfois sévères, avec nausées et vomissements habituels ; abdomen ou flanc parfois douloureux à la palpation ; patient agité, aucune position ne soulage. Hématurie avec ou sans « sable » dans les urines. Les calculs sont souvent asymptomatiques (découverte fortuite à la radiographie). L'échographie, si disponible, peut montrer des calculs et une hydronéphrose.","sa":"Fièvre et signes de pyélonéphrite en cas de surinfection. Troubles rénaux significatifs. Surinfection qui ne s'améliore pas sous antibiotiques.","ct":"Encourager le patient à boire. Antalgiques adaptés à l'intensité de la douleur (voir Douleur, chapitre 1 du guide MSF). Surinfection : antibiothérapie comme pour une pyélonéphrite (son efficacité dépend de l'élimination du calcul). La majorité des calculs sont éliminés spontanément ; envisager une prise en charge chirurgicale en cas de troubles rénaux significatifs ou de surinfection non améliorée par l'antibiothérapie.","q":{"df":{"st":"av","s":[45]},"sc":{"st":"av","s":[45]},"sa":{"st":"av","s":[45]},"ct":{"st":"av","s":[45]}},"sr":[45]},{"id":"colopathie","n":"Colopathie","o":["ord-028"]},{"id":"colopathie-fonctionnelle","n":"Colopathie fonctionnelle","o":["ord-029"]},{"id":"conjonctivite-bacterienne","n":"Conjonctivite bactérienne","o":["ord-030","ord-031"],"df":"Inflammation de la conjonctive provoquée par des bactéries ; très contagieuse (d'une personne à l'autre, ou de l'œil infecté à l'œil sain). Formes particulières : conjonctivite à inclusion (Chlamydia trachomatis, par contact sexuel), conjonctivite gonococcique (Neisseria gonorrhoeae), conjonctivite du nouveau-né (Chlamydia ou gonocoque contractés à l'accouchement).","sc":"Conjonctive rose (vaisseaux dilatés), écoulement plus épais, blanc, vert ou jaune, yeux collés surtout la nuit ; vision floue qui s'améliore en clignant ; irritation et sensibilité à la lumière parfois. Pas de ganglion douloureux devant l'oreille en général. Conjonctivite à inclusion ou gonococcique : signes d'infection génitale (écoulement, brûlures mictionnelles).","sa":"Vision floue qui ne s'améliore pas en clignant : infection de la cornée. Les infections sévères peuvent s'étendre à la cornée. Nouveau-né : inflammation sévère de la paupière avec pus, risque de cécité sans traitement. Symptômes sévères ou récidivants, immunodépression, greffe de cornée : prélèvement de sécrétions (culture).","ct":"Laver délicatement la paupière à l'eau tiède du robinet avec une serviette propre ; compresses chaudes humides. Collyre ou pommade antibiotique (moxifloxacine, ciprofloxacine, triméthoprime-polymyxine) pendant 7 à 10 jours ; la pommade dure plus longtemps mais trouble la vue environ 20 minutes. Conjonctivite à inclusion de l'adulte : antibiotique oral (érythromycine, azithromycine ou doxycycline) et traitement des partenaires. Conjonctivite gonococcique : une injection de ceftriaxone et azithromycine en monodose (ou doxycycline 1 semaine). Nouveau-né : traitement selon la bactérie. Hygiène : lavage des mains, serviettes et compresses non partagées, éviter de toucher l'œil sain, éviter la piscine, éviction scolaire/professionnelle de quelques jours. Certains médecins prescrivent un antibiotique quel que soit le type car la distinction avec la forme virale est parfois difficile.","q":{"df":{"st":"av","s":[111],"n":"Complété par : Claude (IA) d'après le Manuel MSD. La page MSD couvre la conjonctivite infectieuse (bactérienne et virale)."},"sc":{"st":"av","s":[111]},"sa":{"st":"av","s":[111]},"ct":{"st":"av","s":[111]}},"sr":[111]},{"id":"conjonctivite-virale","n":"Conjonctivite virale","o":["ord-032"],"df":"Inflammation de la conjonctive provoquée par un virus, le plus souvent un adénovirus ; d'autres virus (rougeole, oreillons, rubéole, varicelle, Zika, virus du rhume, SARS-CoV-2) peuvent aussi l'entraîner. Très contagieuse. La kératoconjonctivite épidémique (souches particulières d'adénovirus) est extrêmement contagieuse et provoque des épidémies (écoles, lieux publics).","sc":"Conjonctive rose, écoulement très liquide, irritation, sensibilité à la lumière ; infection des voies respiratoires supérieures associée ; ganglion enflé et douloureux devant l'oreille. Kératoconjonctivite épidémique : sensation de poussière dans l'œil, douleur à la lumière vive, conjonctive gonflée autour de la cornée ; symptômes 1 à 3 semaines, vision floue parfois plusieurs semaines ou mois.","sa":"Douleur oculaire intense à la lumière vive ou baisse de la vision : consultation (corticoïdes en collyre parfois nécessaires). Les infections sévères peuvent s'étendre à la cornée.","ct":"Guérison spontanée en 1 à 3 semaines dans la plupart des cas, sans traitement spécifique ; compresses froides pour l'irritation. Collyre corticoïde parfois pour les formes sévères (douleur intense à la lumière, vision altérée, kératoconjonctivite épidémique). Les collyres antiviraux ne sont pas utiles. Mesures d'hygiène : lavage ou désinfection des mains, serviettes séparées, éviction quelques jours ou semaines selon gravité, éviter la piscine. La source ne donne pas de doses.","q":{"df":{"st":"av","s":[112],"n":"Complété par : Claude (IA) d'après le Manuel MSD. La page MSD couvre la conjonctivite infectieuse (bactérienne et virale)."},"sc":{"st":"av","s":[112]},"sa":{"st":"av","s":[112]},"ct":{"st":"av","s":[112]}},"sr":[112]},{"id":"conjonctivite-allergique-secretions-claires-avec-prurit","n":"Conjonctivite allergique (Sécrétions claires avec prurit)","o":["ord-033"],"df":"Inflammation de la conjonctive due à une réaction allergique aux allergènes de l'air (pollens, spores de moisissures, acariens, poils et squames d'animaux). Formes : saisonnière, perannuelle, et kératoconjonctivite vernale (plutôt garçons de 5 à 20 ans, souvent avec eczéma, asthme ou allergies saisonnières).","sc":"Picotements et brûlures intenses aux deux yeux, conjonctive rouge parfois gonflée, paupières qui démangent et gonflent ; larmoiement important, écoulement parfois filandreux ; vision rarement altérée ; nez qui coule avec démangeaisons fréquent. Kératoconjonctivite vernale : écoulement épais, filandreux, semblable à du mucus.","sa":"Kératoconjonctivite vernale : atteinte possible de la cornée avec petits ulcères douloureux et douleur sévère à la lumière vive (photophobie) ; baisse permanente de la vision rare.","ct":"Éviter les allergènes connus (pollen, poussière, squames) ; larmes artificielles fraîches et compresses froides. Collyre antihistaminique (kétotifène, en vente libre, pour les cas bénins ; olopatadine, cétirizine) ou stabilisateur des mastocytes (nédocromil) ; ciclosporine en collyre pour les symptômes chroniques ; collyre AINS (kétorolac) contre la douleur ; collyre corticoïde plus puissant mais pas plus de quelques semaines sans suivi ophtalmologique (risque de glaucome, cataracte, infection). Antihistaminique oral (fexofénadine, cétirizine, hydroxyzine) utile si d'autres organes sont touchés (nez, gorge, oreilles). La source ne donne pas de doses.","q":{"df":{"st":"av","s":[110],"n":"Complété par : Claude (IA) d'après le Manuel MSD. Correspond à la page MSD « Conjonctivite allergique »."},"sc":{"st":"av","s":[110]},"sa":{"st":"av","s":[110]},"ct":{"st":"av","s":[110]}},"sr":[110]},{"id":"constipation","n":"Constipation","o":["ord-034"],"df":"Symptôme courant dont il faut distinguer la forme aiguë de la forme chronique. Les complications sont souvent bénignes (douleurs anales, crises hémorroïdaires) mais la constipation altère la qualité de vie.","sa":"Écarter une cause organique avant d'initier un laxatif (RCP du macrogol). Une constipation chronique ou persistante justifie une évaluation médicale. Définition, signes cliniques et critères d'alerte détaillés non présents dans ces extraits : à compléter.","ct":"Le traitement médicamenteux n'est qu'un adjuvant des mesures hygiéno-diététiques : boissons abondantes, alimentation riche en fibres. **Macrogol 4000 (Forlax 10 g)** : adulte et enfant à partir de 8 ans ; de 1 sachet un jour sur deux (surtout chez l'enfant) à 2 sachets par jour ; traitement temporaire, durée de 3 mois maximum chez l'enfant ; en cas de diarrhée par excès, arrêt temporaire ou réduction de la dose (forme à 4 g pour l'enfant de 6 mois à 8 ans). **Lactulose** (laxatif osmotique) : effet après 48 heures, parfois plus, donc inadapté si un résultat rapide est attendu ; le guide MSF le positionne dans la prévention de la constipation induite par les opioïdes : moins de 1 an 5 mL/j ; 1 à 6 ans 5 à 10 mL/j ; 7 à 14 ans 10 à 15 mL/j ; plus de 14 ans et adulte 15 à 45 mL/j (solution à 10 g/15 mL) ; association possible à un laxatif stimulant. Autres classes (laxatifs de lest, suppositoires de glycérine) citées par Unisanté sans posologie dans l'extrait.","q":{"df":{"st":"av","s":[74,75,76]},"sa":{"st":"av","s":[74,75,76]},"ct":{"st":"av","s":[74,75,76]}},"sr":[74,75,76]},{"id":"coqueluche","n":"Coqueluche","o":["ord-035"],"df":"Infection très contagieuse des voies respiratoires due à la bactérie Bordetella pertussis, transmise par inhalation de gouttelettes, surtout dans les 3 semaines suivant l'apparition de la toux. Elle reste une cause importante de morbidité et de mortalité, en particulier chez les nourrissons.","sc":"Incubation de 7 à 10 jours en moyenne (jusqu'à 21 jours), puis 3 phases. Catarrhale (1 à 2 semaines) : écoulement nasal, toux légère, fièvre légère ou absente, indistinguable d'une infection respiratoire banale. Paroxystique (1 à 6 semaines) : toux de plus en plus sévère par quintes au cours d'une expiration, suivies d'une reprise inspiratoire bruyante (« chant du coq ») et/ou de vomissements ; fièvre légère ou absente ; apnée et cyanose chez le nourrisson ; toux prolongée parfois sans quintes chez l'enfant plus âgé et l'adulte. Convalescence (quelques semaines ou mois) : quintes de moins en moins fréquentes et intenses.","sa":"Complications : pneumonie bactérienne secondaire (apparition de fièvre), déshydratation et malnutrition, convulsions, encéphalopathie, mort subite, hémorragie intracrânienne, pétéchies, fracture de côtes, hernie, prolapsus rectal. Plus grave et risque de décès élevé chez le nourrisson ; formes graves possibles chez la personne âgée, l'immunodéprimé ou le patient ayant une maladie respiratoire. À hospitaliser : forme sévère (détresse respiratoire, apnée, cyanose, pneumonie, convulsions, troubles de la conscience), nourrisson jusqu'à 3 mois, difficultés à boire ou à s'alimenter.","ct":"Antibiothérapie dès la suspicion : tous les patients ≥ 1 an dans les 3 semaines suivant le début de la toux ; nourrissons et femmes enceintes dans les 6 semaines. Première ligne : azithromycine per os 5 jours (enfant \u003c 6 mois : 10 mg/kg/j ; ≥ 6 mois : 10 mg/kg (max 500 mg) à J1 puis 5 mg/kg (max 250 mg) de J2 à J5 ; adulte : 500 mg à J1 puis 250 mg de J2 à J5). Alternatives : érythromycine 7 jours (enfant 15 mg/kg 3 fois/j ; adulte 1 g 3 fois/j) ; cotrimoxazole 14 jours si macrolides contre-indiqués, non tolérés ou indisponibles (à éviter au 1er trimestre de grossesse, après 36 semaines et chez la femme allaitant un nouveau-né). Contagiosité jusqu'à la fin de 5 jours d'antibiotique approprié ou, sans traitement, jusqu'à 21 jours après le début de la phase paroxystique : éviter le contact avec les jeunes enfants et les femmes enceintes, éviter les lieux de rassemblement ; précautions gouttelettes à l'hôpital. Soins de support : hydratation et nutrition (alimentation fractionnée, allaitement poursuivi), position semi-assise, oxygène si SpO2 \u003c 92 %, détresse respiratoire sévère ou apnées récurrentes, aspiration douce. Sujets contacts : prophylaxie post-exposition (même antibiotique) pour les contacts étroits asymptomatiques dans les 3 semaines, quel que soit le statut vaccinal, et pour les personnes à risque (femmes enceintes au 3e trimestre, nourrissons \u003c 1 an, immunodéprimés, asthme modéré à sévère). Vaccination : primovaccination à 3 doses dès 6 semaines, rappel de préférence dans la 2e année de vie.","q":{"df":{"st":"av","s":[31]},"sc":{"st":"av","s":[31]},"sa":{"st":"av","s":[31]},"ct":{"st":"av","s":[31]}},"sr":[31]},{"id":"cors","n":"Cors","o":["ord-036"]},{"id":"crise-hemorroidaire","n":"Crise hémorroïdaire","o":["ord-038"]},{"id":"crise-d-asthme-moderee","n":"Crise d’asthme modérée","o":["ord-037"],"df":"Accès paroxystique de symptômes d'asthme, dont la durée et la gravité sont variables et imprévisibles.","sc":"Crise légère ou modérée : le patient est capable de faire des phrases complètes ; augmentation légère ou modérée de la fréquence respiratoire ; fréquence cardiaque normale ou légèrement augmentée (≤ 120/min chez l'enfant de plus de 5 ans et l'adulte) ; SpO2 ≥ 90 % (≥ 92 % chez l'enfant de 2 à 5 ans) ; aucun critère de crise sévère.","sa":"Crise sévère : incapable de finir une phrase sans reprendre sa respiration, ou trop essoufflé pour parler ou s'alimenter ; fréquence respiratoire > 30/min (enfant > 5 ans et adulte) ou > 40/min (2 à 5 ans) ; fréquence cardiaque > 120/min (enfant > 5 ans et adulte) ; SpO2 \u003c 90 % (\u003c 92 % chez l'enfant de 2 à 5 ans). Crise mettant en jeu le pronostic vital : altération de la conscience (somnolence, confusion, coma), épuisement, silence auscultatoire, cyanose, arythmie ou hypotension chez l'adulte.","ct":"Rassurer, position demi-assise. Salbutamol aérosol-doseur 100 µg/bouffée : 2 à 10 bouffées toutes les 20 minutes pendant la première heure (chambre d'inhalation chez l'enfant, masque facial avant 3 ans). Prednisolone per os 1 à 2 mg/kg (max 50 mg) chez l'enfant de plus de 5 ans et l'adulte. Oxygène si SpO2 \u003c 94 %. Amélioration complète : observation 1 heure (4 heures si le patient habite loin), puis salbutamol 2 à 4 bouffées toutes les 4 à 6 h pendant 24 à 48 h et prednisolone une fois par jour pour compléter 5 jours ; réévaluer à 1–2 jours. Amélioration incomplète : poursuivre le salbutamol jusqu'à résolution. Absence d'amélioration ou aggravation : traiter comme une crise sévère (hospitaliser, oxygène pour SpO2 94–98 %, salbutamol + ipratropium en nébulisation, corticothérapie, sulfate de magnésium IV si pas d'amélioration après 1 heure). Rechercher et traiter une infection pulmonaire sous-jacente ; grossesse : même traitement.","q":{"df":{"st":"av","s":[23]},"sc":{"st":"av","s":[23]},"sa":{"st":"av","s":[23]},"ct":{"st":"av","s":[23]}},"sr":[23]},{"id":"crise-ulcero-hemorragique","n":"Crise ulcéro-hémorragique","o":["ord-039"]},{"id":"crise-ulcereuse-hyperalgique","n":"Crise ulcéreuse hyperalgique","o":["ord-040"],"df":"Poussée douloureuse intense d'un ulcère gastro-duodénal. La forme « hyperalgique » n'est pas décrite en tant que telle dans le guide MSF : la fiche reprend la prise en charge de l'ulcère non compliqué, après avoir éliminé une complication.","sc":"Douleur épigastrique à type de brûlure ou de crampes entre les repas, réveillant la nuit, parfois nausées et vomissements.","sa":"Devant une douleur intense, rechercher en priorité les complications les plus fréquentes de l'ulcère : perforation et hémorragie digestive (prise en charge hospitalière, chirurgie en urgence en cas de perforation).","ct":"Ulcère non compliqué : arrêter l'aspirine et les AINS (contre-indiqués) ; éviter alcool et tabac ; oméprazole PO 20 mg une fois par jour le matin pendant 7 à 10 jours (MSF). L'antalgique adapté à la crise n'est pas précisé dans la source consultée : à compléter. Récidives fréquentes : éradication d'H. pylori (voir fiche Ulcère gastroduodénal).","q":{"df":{"st":"av","s":[62]},"sc":{"st":"av","s":[62]},"sa":{"st":"av","s":[62]},"ct":{"st":"av","s":[62]}},"sr":[62]},{"id":"cystite","n":"Cystite","o":["ord-041"],"df":"Infection de la vessie et de l'urètre, touchant essentiellement les femmes et, chez l'enfant, les filles à partir de 2 ans. Le germe en cause est Escherichia coli dans au moins 70 % des cas (autres germes : Proteus mirabilis, Enterococcus, Klebsiella et, chez la femme jeune, Staphylococcus saprophyticus).","sc":"Brûlures ou douleurs mictionnelles et pollakiurie (émission fréquente de petites quantités d'urine) ; chez l'enfant : pleurs en urinant, fuites urinaires chez un enfant continent ; absence de fièvre (ou fièvre modérée) et de douleurs lombaires, absence de signes systémiques chez l'enfant. Des brûlures mictionnelles seules sont insuffisantes pour le diagnostic. Bandelette urinaire : nitrites (entérobactéries) et/ou leucocytes positifs confortent le diagnostic ; chez la femme, un test négatif pour les deux exclut une infection urinaire ; ECBU si disponible, surtout chez l'enfant et la femme enceinte.","sa":"Toujours éliminer une pyélonéphrite (fièvre, douleur lombaire). Cystites récidivantes (plus de 3 à 4 épisodes par an) ou échec du traitement : chercher des calculs vésicaux, une schistosomiase urinaire, une tuberculose urinaire, une gonococcie (examiner le partenaire). Zones d'endémie de schistosomiase urinaire : une hématurie macroscopique ou du sang à la bandelette chez l'enfant de 5 à 15 ans doit la faire suspecter. Femme enceinte : nitrofurantoïne contre-indiquée pendant le dernier mois de grossesse.","ct":"Fillette ≥ 2 ans : céfixime PO 8 mg/kg une fois par jour pendant 3 jours, ou amoxicilline/acide clavulanique PO (dose en amoxicilline) 12,5 mg/kg 2 fois par jour pendant 3 jours. Femme jeune hors grossesse, bandelette positive pour nitrites et leucocytes : fosfomycine-trométamol PO 3 g en dose unique ou nitrofurantoïne PO 100 mg 3 fois par jour pendant 5 jours ; leucocytes positifs et nitrites négatifs (S. saprophyticus possible, fosfomycine inefficace) : nitrofurantoïne. Les signes peuvent persister 2 à 3 jours malgré un traitement efficace. Échec ou récidive (> 3 à 4 épisodes par an) : ciprofloxacine PO 500 mg 2 fois par jour pendant 3 jours. Femme enceinte ou allaitante : fosfomycine-trométamol 3 g en dose unique, ou nitrofurantoïne 100 mg 3 fois par jour pendant 7 jours (contre-indiquée le dernier mois de grossesse), ou céfixime 200 mg 2 fois par jour pendant 5 jours.","q":{"df":{"st":"av","s":[36]},"sc":{"st":"av","s":[36]},"sa":{"st":"av","s":[36]},"ct":{"st":"av","s":[36]}},"sr":[36]},{"id":"dermite-de-siege","n":"Dermite de siège","o":["ord-042"]},{"id":"diarrhee-aigue-shigellose","n":"Diarrhée aigue (Shigellose)","o":["ord-043"],"df":"Diarrhée sanglante d'origine bactérienne, très contagieuse, due aux shigelles (S. dysenteriae, S. sonnei, S. flexneri, S. boydii). S. dysenteriae type 1 est la seule souche pouvant provoquer des épidémies de grande ampleur et celle qui a la plus forte létalité (jusqu'à 10 %).","sc":"Diarrhée avec sang frais visible dans les selles, avec ou sans fièvre ; douleurs abdominales et rectales fréquentes. (Cette définition exclut le sang détecté au microscope, le méléna et les traînées de sang à la surface de selles normales, hémorroïdes ou lésions de l'anus ou du rectum.)","sa":"Signes de gravité : fièvre > 39 °C, déshydratation sévère, convulsions, troubles de la conscience. Complications (plus fréquentes avec S. dysenteriae 1) : convulsions fébriles (5 à 30 % des enfants), prolapsus rectal (3 %), septicémie, occlusion ou perforation intestinale, syndrome hémolytique et urémique modéré à sévère. Patients à risque de mortalité : enfants de moins de 5 ans, malnutris, enfants après une rougeole, adultes de plus de 50 ans.","ct":"Hospitaliser les patients avec signes de gravité ou facteurs de risque de mortalité ; les autres sont traités en ambulatoire. Première intention : ciprofloxacine PO 3 jours (enfant 15 mg/kg 2 fois par jour, max 1 g/j ; adulte 500 mg 2 fois par jour) si la souche est sensible ou sans antibiogramme et si la voie orale est possible ; ceftriaxone IM 3 jours (enfant 50 à 100 mg/kg une fois par jour, max 1 g/j ; adulte 1 à 2 g une fois par jour) en cas d'infection sévère, de voie orale impossible ou chez la femme enceinte (la ciprofloxacine est à éviter pendant la grossesse). Résistance, contre-indication ou absence d'amélioration à 48 h : azithromycine PO 5 jours (enfant 12 mg/kg à J1 puis 6 mg/kg/j de J2 à J5 ; adulte 500 mg à J1 puis 250 mg/j de J2 à J5) ou céfixime PO 5 jours (enfant 8 mg/kg/j, max 400 mg/j ; adulte 400 mg/j). Sans amélioration 48 h après le traitement de deuxième intention : traiter une amibiase. Douleur et fièvre : paracétamol ; antalgiques opioïdes contre-indiqués. Soutien : alimentation supplémentaire (+ 2500 kcal/j si hospitalisé, + 1000 kcal/j en ambulatoire), SRO selon le protocole de l'OMS, zinc chez l'enfant de moins de 5 ans ; jamais de lopéramide ni d'autre antidiarrhéique. Complications : réduction d'un prolapsus rectal, prise en charge d'une septicémie. En épidémie : culture et antibiogramme chaque mois (résistances rapides), isolement des patients hospitalisés, éviction scolaire des enfants traités en ambulatoire, hygiène (lavage des mains, conservation des aliments).","q":{"df":{"st":"av","s":[39]},"sc":{"st":"av","s":[39]},"sa":{"st":"av","s":[39]},"ct":{"st":"av","s":[39]}},"sr":[39]},{"id":"diarrhee-aqueuse-d-origine-virale","n":"Diarrhée aqueuse d’origine virale","o":["ord-044"],"df":"Diarrhée aiguë : émission d'au moins 3 selles liquides par jour depuis moins de 2 semaines. Les diarrhées non sanglantes sont d'origine virale dans 60 % des cas (rotavirus, entérovirus), parfois bactérienne (Vibrio cholerae, Escherichia coli entérotoxinogène, Salmonella non Typhi, Yersinia enterocolitica) ou parasitaire (giardiase).","sc":"Rechercher en priorité des signes de déshydratation, puis : selles profuses et afécales (choléra, E. coli entérotoxinogène), vomissements abondants (choléra), fièvre (salmonellose, diarrhée virale). D'autres maladies (paludisme, otite moyenne aiguë, infections respiratoires) peuvent s'accompagner de diarrhée. Transmission directe (mains sales) ou indirecte (eau ou aliments contaminés).","sa":"La déshydratation aiguë et la dénutrition sont responsables de la forte mortalité liée aux diarrhées, même bénignes. Déshydratation sévère d'installation rapide chez un patient de plus de 5 ans : suspecter un choléra. Enfants malnutris : protocoles de réhydratation adaptés.","ct":"Prévenir ou traiter la déshydratation par les sels de réhydratation orale (SRO), au fur et à mesure des pertes jusqu'à l'arrêt de la diarrhée ; le lait maternel ne remplace pas la SRO (donner la SRO entre les tétées). Zinc chez l'enfant de moins de 5 ans : sulfate de zinc PO une fois par jour pendant 10 jours (\u003c 6 mois : 10 mg, soit ½ comprimé ; 6 mois à 5 ans : 20 mg, soit 1 comprimé), dissous dans une cuillère à café d'eau. Poursuivre l'alimentation normale à volonté (augmenter la fréquence des tétées chez l'enfant allaité). Pas d'antibiotique systématique (la plupart des diarrhées sont virales) ; ni antidiarrhéique ni antiémétique ; traiter la maladie associée. Choléra : réhydratation et antibiothérapie selon la sensibilité (guide choléra) ; giardiase : traitement antiparasitaire. Prévention : allaitement, hygiène des aliments au sevrage, eau propre et lavage des mains, vaccination contre le rotavirus de 6 semaines à 24 mois recommandée par l'OMS là où la mortalité est élevée.","q":{"df":{"st":"av","s":[38]},"sc":{"st":"av","s":[38]},"sa":{"st":"av","s":[38]},"ct":{"st":"av","s":[38]}},"sr":[38]},{"id":"diarrhee-glairo-sanglante-d-origine-bacterienne","n":"Diarrhée glairo-sanglante d’origine bactérienne","o":["ord-045"],"df":"Diarrhée sanglante d'origine bactérienne, très contagieuse, due aux shigelles (S. dysenteriae, S. sonnei, S. flexneri, S. boydii). S. dysenteriae type 1 est la seule souche pouvant provoquer des épidémies de grande ampleur et celle qui a la plus forte létalité (jusqu'à 10 %).","sc":"Diarrhée avec sang frais visible dans les selles, avec ou sans fièvre ; douleurs abdominales et rectales fréquentes. (Cette définition exclut le sang détecté au microscope, le méléna et les traînées de sang à la surface de selles normales, hémorroïdes ou lésions de l'anus ou du rectum.)","sa":"Signes de gravité : fièvre > 39 °C, déshydratation sévère, convulsions, troubles de la conscience. Complications (plus fréquentes avec S. dysenteriae 1) : convulsions fébriles (5 à 30 % des enfants), prolapsus rectal (3 %), septicémie, occlusion ou perforation intestinale, syndrome hémolytique et urémique modéré à sévère. Patients à risque de mortalité : enfants de moins de 5 ans, malnutris, enfants après une rougeole, adultes de plus de 50 ans.","ct":"Hospitaliser les patients avec signes de gravité ou facteurs de risque de mortalité ; les autres sont traités en ambulatoire. Première intention : ciprofloxacine PO 3 jours (enfant 15 mg/kg 2 fois par jour, max 1 g/j ; adulte 500 mg 2 fois par jour) si la souche est sensible ou sans antibiogramme et si la voie orale est possible ; ceftriaxone IM 3 jours (enfant 50 à 100 mg/kg une fois par jour, max 1 g/j ; adulte 1 à 2 g une fois par jour) en cas d'infection sévère, de voie orale impossible ou chez la femme enceinte (la ciprofloxacine est à éviter pendant la grossesse). Résistance, contre-indication ou absence d'amélioration à 48 h : azithromycine PO 5 jours (enfant 12 mg/kg à J1 puis 6 mg/kg/j de J2 à J5 ; adulte 500 mg à J1 puis 250 mg/j de J2 à J5) ou céfixime PO 5 jours (enfant 8 mg/kg/j, max 400 mg/j ; adulte 400 mg/j). Sans amélioration 48 h après le traitement de deuxième intention : traiter une amibiase. Douleur et fièvre : paracétamol ; antalgiques opioïdes contre-indiqués. Soutien : alimentation supplémentaire (+ 2500 kcal/j si hospitalisé, + 1000 kcal/j en ambulatoire), SRO selon le protocole de l'OMS, zinc chez l'enfant de moins de 5 ans ; jamais de lopéramide ni d'autre antidiarrhéique. Complications : réduction d'un prolapsus rectal, prise en charge d'une septicémie. En épidémie : culture et antibiogramme chaque mois (résistances rapides), isolement des patients hospitalisés, éviction scolaire des enfants traités en ambulatoire, hygiène (lavage des mains, conservation des aliments).","q":{"df":{"st":"av","s":[39,40],"n":"Rattaché à la shigellose, première cause de diarrhée sanglante bactérienne (guide MSF) ; l'amibiase, plus rare, réalise aussi une diarrhée glairo-sanglante (voir fiche Amibiase)."},"sc":{"st":"av","s":[39]},"sa":{"st":"av","s":[39]},"ct":{"st":"av","s":[39]}},"sr":[39,40]},{"id":"diarrhee-parasitaire-amibiase","n":"Diarrhée parasitaire (Amibiase)","o":["ord-046"],"df":"Infection parasitaire due au protozoaire intestinal Entamoeba histolytica, de transmission féco-orale (mains, eau et aliments contaminés par des kystes). 90 % des porteurs sont asymptomatiques ; chez un petit nombre, des amibes pathogènes pénètrent la muqueuse du côlon (dysenterie amibienne) et peuvent migrer par voie sanguine pour former des abcès à distance, le plus souvent un abcès amibien du foie.","sc":"Dysenterie amibienne : diarrhée avec glaires et sang rouge, douleurs abdominales, ténesme, absence de fièvre ou fièvre modérée, signes de déshydratation possibles (tableau proche de la shigellose). Abcès amibien du foie : hépatomégalie douloureuse, ictère parfois, anorexie, nausées, vomissements, perte de poids, fièvre intermittente, sueurs et frissons nocturnes, altération de l'état général. Examens : trophozoïtes mobiles dans les selles fraîches (dysenterie) ; hémagglutination indirecte et ELISA, échographie (abcès du foie).","sa":"Abcès amibien du foie (forme extra-intestinale la plus fréquente) : hépatomégalie douloureuse, fièvre, altération de l'état général. Rechercher une déshydratation dans la dysenterie. La présence de kystes seuls ne doit pas faire traiter une amibiase.","ct":"Amibiase intestinale confirmée : tinidazole PO (enfant 50 mg/kg une fois par jour pendant 3 jours, max 2 g/j ; adulte 2 g une fois par jour pendant 3 jours) ou métronidazole PO (enfant 15 mg/kg 3 fois par jour pendant 5 jours ; adulte 500 mg 3 fois par jour pendant 5 jours). Sans laboratoire : traiter d'abord comme une shigellose, et traiter l'amibiase en cas d'échec d'un traitement de shigellose bien conduit. Abcès amibien du foie : tinidazole pendant 5 jours ou métronidazole pendant 5 à 10 jours (mêmes doses). SRO en cas de risque ou de signes de déshydratation.","q":{"df":{"st":"av","s":[40]},"sc":{"st":"av","s":[40]},"sa":{"st":"av","s":[40]},"ct":{"st":"av","s":[40]}},"sr":[40]},{"id":"diarrhee-sanglante","n":"Diarrhée sanglante","o":["ord-047"],"df":"Diarrhée aiguë avec sang rouge dans les selles, d'origine bactérienne (Shigella dans 50 % des cas, Campylobacter jejuni, E. coli entéro-invasif et entérohémorragique, Salmonella) ou parasitaire (amibiase intestinale).","sc":"Au moins 3 selles liquides par jour depuis moins de 2 semaines, avec sang rouge ; rechercher d'abord les signes de déshydratation, puis fièvre et douleurs abdominales. Transmission directe (mains sales) ou indirecte (eau ou aliments contaminés).","sa":"La déshydratation aiguë et la dénutrition sont responsables de la forte mortalité liée aux diarrhées. Signes de gravité de la shigellose : fièvre > 39 °C, déshydratation sévère, convulsions, troubles de la conscience (voir fiche Shigellose).","ct":"La shigellose est la diarrhée sanglante la plus fréquente (l'amibiase est beaucoup plus rare) : en l'absence de laboratoire, traitement de première intention de la shigellose (voir fiche). Amibiase : traitement antiparasitaire uniquement si des amibes hématophages mobiles sont présentes dans les selles ou en cas d'échec d'un traitement de shigellose bien conduit. SRO, zinc chez l'enfant de moins de 5 ans, alimentation à volonté ; jamais d'antidiarrhéique.","q":{"df":{"st":"av","s":[38]},"sc":{"st":"av","s":[38]},"sa":{"st":"av","s":[38]},"ct":{"st":"av","s":[38]}},"sr":[38]},{"id":"douleur-abdominale","n":"Douleur abdominale","o":["ord-048"]},{"id":"douleur-cancereuse","n":"Douleur cancéreuse","o":["ord-049"]},{"id":"douleur-lombosciatique-lombosciatalgie","n":"Douleur lombosciatique (Lombosciatalgie)","o":["ord-050"]},{"id":"douleur-thoracique","n":"Douleur thoracique","o":["ord-051"]},{"id":"dysmenorrhee-chez-une-jeune-fille","n":"Dysménorrhée chez une jeune fille","o":["ord-052"]},{"id":"dystonie-neurovegetative-dnv","n":"Dystonie neurovégétative (DNV)","o":["ord-053"]},{"id":"eczema-atopique","n":"Eczéma atopique","o":["ord-054"]},{"id":"embolie-pulmonaire","n":"Embolie pulmonaire","o":["ord-055"]},{"id":"entorse","n":"Entorse","o":["ord-056"]},{"id":"enuresie","n":"Enurésie","o":["ord-057"]},{"id":"epistaxis","n":"Epistaxis","o":["ord-058"]},{"id":"eruption","n":"Eruption","o":["ord-059"]},{"id":"erysipele","n":"Erysipèle","o":["ord-060"],"df":"Infection de la couche la plus superficielle de la peau (épiderme), type de cellulite, le plus souvent due à des streptocoques (parfois Staphylococcus aureus, Klebsiella pneumoniae, Haemophilus influenzae, E. coli). Les bactéries entrent par une coupure, un ulcère, une morsure, une lésion d'immersion ou une plaie chirurgicale. Touche enfants et adultes ; plus fréquent en cas d'immunodépression.","sc":"Plaque cutanée rouge, luisante, douloureuse et en relief, aux bords nets, chaude et ferme au toucher ; parfois vésicules (érysipèle bulleux). Forte fièvre, frissons et malaise général fréquents. Siège le plus souvent aux jambes et au visage.","sa":"Patient très malade : prélèvements (sang, peau) et antibiotiques par voie intraveineuse. Suspicion de SARM : traitement élargi. Les récidives peuvent entraîner un lymphœdème (gonflement chronique).","ct":"Antibiotiques par voie orale (pénicilline ou amoxicilline). Infection sévère : voie intraveineuse (pénicilline ou ceftriaxone). Si SARM suspecté : ajout d'un antibiotique oral (sulfaméthoxazole/triméthoprime, clindamycine ou doxycycline) ou, si infection sévère, vancomycine ou linézolide IV. Repos au lit, jambe surélevée en cas d'atteinte du membre inférieur, bas de contention pour réduire le gonflement, compresses froides et antalgiques. La source ne donne pas de doses.","q":{"df":{"st":"av","s":[87],"n":"Complété par : Claude (IA) d'après le Manuel MSD."},"sc":{"st":"av","s":[87]},"sa":{"st":"av","s":[87]},"ct":{"st":"av","s":[87]}},"sr":[87]},{"id":"erytheme-fessier-engelure-gercure-crevasse-des-seins","n":"Erythème fessier, Engelure, Gerçure, Crevasse des seins","o":["ord-061"]},{"id":"furoncle","n":"Furoncle","o":["ord-062"],"df":"Abcès cutané qui se forme autour d'un follicule pileux, causé par une infection bactérienne, le plus souvent à staphylocoques. Plusieurs furoncles liés les uns aux autres sous la peau forment un anthrax. Terrain favorisant : âge avancé, lésions cutanées, obésité, diabète, immunodépression.","sc":"Zone rouge, brillante, gonflée, très douloureuse et sensible, remplie de pus, mesurant en général moins de 2,5 cm. Sans traitement, le furoncle grossit, s'ouvre et le pus s'écoule. Fièvre et nausées possibles.","sa":"Extension de l'infection à la peau voisine (cellulite). Passage des bactéries dans le sang (septicémie) : forte fièvre, hypotension, atteinte de certains organes.","ct":"Chaleur douce locale (linge tiède, bouillotte). En cas d'échec : incision et drainage du pus, nettoyage au sérum physiologique, parfois mèche de gaze 1 à 2 jours. Antibiotiques non systématiques : à prescrire en cas de lésions nombreuses, d'extension à la peau voisine (cellulite) ou de système immunitaire affaibli. Furoncles récidivants : savon antiseptique liquide, antibiotiques pendant 1 à 2 mois, éventuellement bilan sanguin. La source ne donne pas de doses.","q":{"df":{"st":"av","s":[89],"n":"Complété par : Claude (IA) d'après le Manuel MSD. Le Manuel MSD traite le furoncle comme un type d'abcès cutané."},"sc":{"st":"av","s":[89]},"sa":{"st":"av","s":[89]},"ct":{"st":"av","s":[89]}},"sr":[89]},{"id":"folliculite","n":"Folliculite","o":["ord-063"],"df":"Inflammation ou infection d'un follicule pileux ; lorsqu'elle est infectieuse, c'est un tout petit abcès cutané. Le plus souvent d'origine bactérienne (staphylocoques) ; d'autres bactéries ou des champignons peuvent la causer. Elle peut aussi survenir sans infection après rasage (poils incarnés). La « folliculite du jacuzzi » est liée à des bactéries se développant dans les bains à remous. Survient surtout sur peau humide ou irritée par les frottements ; plus probable en cas de lésions cutanées, obésité, diabète, immunodépression.","sc":"Petites pustules rouges ou blanches à la base d'un poil, qui démangent ou sont légèrement douloureuses ; un ou plusieurs follicules atteints.","sa":"Les follicules infectés qui grossissent et s'enfoncent sous la peau peuvent devenir des abcès (furoncles).","ct":"Lavage au savon antibactérien ; linge mouillé d'eau tiède salée plusieurs fois par jour ; crème, gel ou lotion antibiotique locale ; antibiotiques oraux si de nombreux follicules sont infectés. Poils incarnés fréquents : arrêter temporairement de se raser ; antibiotiques si les follicules sont infectés. Folliculite du jacuzzi : guérison spontanée ; contrôler et corriger le taux de chlore du bain. La source ne donne pas de doses.","q":{"df":{"st":"av","s":[88],"n":"Complété par : Claude (IA) d'après le Manuel MSD."},"sc":{"st":"av","s":[88]},"sa":{"st":"av","s":[88]},"ct":{"st":"av","s":[88]}},"sr":[88]},{"id":"gale","n":"Gale","o":["ord-064"],"df":"Infestation parasitaire de la peau causée par un acarien, Sarcoptes scabiei : la femelle creuse des sillons dans les couches superficielles de la peau et y pond ses œufs ; l'infestation provoque des démangeaisons intenses, probablement par réaction allergique aux acariens. Elle se transmet par contact direct et n'est pas liée à une mauvaise hygiène.","sc":"Symptômes environ 4 à 6 semaines après l'exposition initiale. Démangeaisons intenses, aggravées la nuit ; sillons fins jusqu'à 1 cm de long, parfois avec une petite papule rougeâtre à leur extrémité, vésicules, papules excoriées. Siège : entre les doigts, poignets, creux des coudes, aisselles, taille, fesses, seins, pénis ; le visage est épargné chez l'adulte. Jeune enfant : paumes, plantes des pieds, visage et cuir chevelu (derrière les oreilles). Climat chaud : petites papules rouges avec peu de sillons ; peau foncée : zones solides en relief ; adulte âgé : démangeaison intense avec symptômes cutanés très bénins. Diagnostic clinique (démangeaisons, papules et sillons), confirmation possible par grattage cutané examiné au microscope.","sa":"Formes sévères (gale croûteuse ou norvégienne) : zones étendues de peau épaisse et croûteuse (paumes, plantes des pieds, cuir chevelu chez l'enfant), pouvant ressembler à de l'eczéma sans démangeaisons ; chez les personnes immunodéprimées (VIH, cancer du sang, corticoïdes ou immunosuppresseurs prolongés), avec handicap physique ou déficit intellectuel. Gale « incognito » après corticoïdes locaux prolongés (diagnostic difficile). Surinfection bactérienne de la peau après grattage (antibiotique oral parfois nécessaire).","ct":"Perméthrine (crème) ou autre scabicide sur tout le corps à partir du cou (enfant plus âgé et adulte), à rincer après 8 à 14 heures, traitement répété une semaine plus tard. Nourrisson et jeune enfant : tête et cou (en évitant yeux et bouche) et corps entier, plis cutanés, ongles et nombril ; moufles pour éviter l'ingestion ; pommade soufrée dans de la vaseline possible la nuit chez le nourrisson. Spinosad (adulte et enfant de 4 ans et plus) : suspension sur toute la peau, laissée 6 heures, à renouveler une semaine plus tard. Ivermectine orale en deux doses à une semaine d'intervalle si les topiques échouent ou ne sont pas utilisables, et dans les infestations graves des immunodéprimés. Lindane non recommandé (toxicité). Démangeaisons et papules possibles jusqu'à 3 semaines après guérison : antihistaminiques oraux ; dermocorticoïde léger seulement après élimination des acariens. Traiter la famille et les contacts intimes. Linge, serviettes et draps utilisés les 2 à 3 derniers jours : lavage à l'eau chaude (au moins 50 °C) et séchage à haute température, nettoyage à sec, ou sac plastique fermé de 3 jours à 1 semaine. Traitement de masse efficace pour contrôler les épidémies.","q":{"df":{"st":"av","s":[34]},"sc":{"st":"av","s":[34]},"sa":{"st":"av","s":[34]},"ct":{"st":"av","s":[34]}},"sr":[34]},{"id":"gna","n":"GNA","o":["ord-065"]},{"id":"grippe","n":"Grippe","o":["ord-066"],"df":"Infection virale respiratoire très contagieuse, saisonnière, due aux virus grippaux A(H1N1)pdm09, A(H3N2) et B. Le virus A(H1N1)pdm09 touche surtout les sujets jeunes et les enfants de moins de 5 ans, les personnes fortement obèses et les femmes enceintes ; A(H3N2) est responsable d'épidémies plus importantes avec de nombreux décès chez les plus de 65 ans ; les virus de type B touchent surtout les enfants.","sa":"Signes de gravité et complications à rechercher, notamment respiratoires, y compris surinfection bactérienne. Complications des voies aériennes supérieures : otites, sinusites, laryngites ; des voies inférieures : bronchites, pneumopathies ; plus rarement d'autres organes. Terrain à risque très élevé de complications : comorbidités graves ou instables, ou fort risque de décompensation (affections cardiopulmonaires graves, immunodépression). Fréquemment concernés : sujets âgés, enfants de moins de 5 ans, femmes enceintes, obésité sévère.","ct":"Évoquer le diagnostic de grippe devant tout syndrome grippal en période d'épidémie hivernale ; prélèvement naso-pharyngé si nécessaire. Traitement le plus souvent symptomatique. **Grippe compliquée ou grave et/ou terrain à risque** : antiviral spécifique, oseltamivir, le plus tôt possible sans attendre la confirmation virologique. D'après la HAS (Commission de la Transparence), l'oseltamivir n'a pas de place pour les patients sans facteur de risque ; son intérêt en épidémie saisonnière est limité aux personnes à risque de forme sévère ou compliquée ou d'emblée graves. **Au moindre doute de co-infection bactérienne** : antibiothérapie probabiliste — amoxicilline seule si S. pneumoniae fortement suspecté ; amoxicilline/acide clavulanique ou C3G si autres pyogènes (Staphylococcus, Haemophilus, bacilles à Gram négatif), alternative lévofloxacine ; en soins intensifs : C3G (céfotaxime) avec ou sans macrolide, ou fluoroquinolone antipneumococcique IV. **Mesures d'hygiène** : masque chirurgical et friction hydro-alcoolique ; isolement relatif, distanciation ou masque si personnes fragiles à proximité. **Vaccination** : surtout pour les personnes à risque et leur entourage, idéalement au moins 15 jours avant le début de l'épidémie. Signes cliniques détaillés et posologies non présents dans ces sources : à compléter (RCP, guide national).","q":{"df":{"st":"av","s":[47,48]},"sa":{"st":"av","s":[47,48]},"ct":{"st":"av","s":[47,48]}},"sr":[47,48]},{"id":"hematurie","n":"Hématurie","o":["ord-067"]},{"id":"hemorroides","n":"Hémorroïdes","o":["ord-068"],"df":"Maladie hémorroïdaire, interne (non visible sauf procidence) ou externe (tuméfaction sous-cutanée bleutée plus ou moins œdémateuse, souvent douloureuse : thrombose hémorroïdaire externe). La « crise hémorroïdaire » désigne la poussée symptomatique. Facteurs favorisants : constipation, diarrhée.","sc":"Saignements anaux, prolapsus, suintement, démangeaisons, douleurs. Aucun symptôme n'est spécifique de la maladie hémorroïdaire : risque d'erreur diagnostique.","sa":"Adresser au spécialiste (proctologue ou gastro-entérologue) en cas de non-réponse au traitement médical, de symptômes récidivants, de signes d'alerte ou de doute diagnostique.","ct":"**Poussée œdémateuse** : traitement topique symptomatique (suppositoires, crèmes, pommades ; VIDAL : les topiques sans corticoïde ni anesthésique ne font pas l'objet de recommandations). SNFCP : topiques recommandés dans les manifestations aiguës (grade B). **Maladie hémorroïdaire interne** : veinotoniques en cure courte, à forte dose, dans la crise (douleurs, prolapsus, saignements). **Thrombose hémorroïdaire externe** : antalgiques ; aucune étude ne valide les veinotoniques dans cette indication. **Transit** : régularisation du transit (fibres, mucilages, laxatifs osmohydratants) partie intégrante du traitement ; régime apportant 20 à 40 g de fibres par jour et 1 000 à 1 500 mL de boisson, à poursuivre au long cours pour limiter les récidives (Quotidien du Médecin). Molécules et posologies précises non données dans ces extraits : à compléter (RCP).","q":{"df":{"st":"av","s":[70,71,72,73]},"sc":{"st":"av","s":[70,71,72,73]},"sa":{"st":"av","s":[70,71,72,73]},"ct":{"st":"av","s":[70,71,72,73]}},"sr":[70,71,72,73]},{"id":"hemorroides-externes","n":"Hémorroïdes externes","o":["ord-069"],"df":"Maladie hémorroïdaire externe : tuméfaction sous-cutanée bleutée, plus ou moins œdémateuse, en général douloureuse (thrombose hémorroïdaire externe).","sc":"Tuméfaction anale bleutée, douloureuse. Aucun symptôme n'est spécifique : risque d'erreur diagnostique.","sa":"Douleur importante ou thrombose suspectée : consultation médicale. Adresser au spécialiste en cas de non-réponse, de récidive ou de doute diagnostique.","ct":"Thrombose hémorroïdaire externe : traitement antalgique ; aucune étude ne valide l'emploi de veinotoniques (VIDAL). Poussée œdémateuse : topiques (SNFCP : recommandés dans les manifestations aiguës, grade B). Régularisation du transit (fibres, mucilages, laxatifs osmohydratants). Posologies : à compléter (RCP).","q":{"df":{"st":"av","s":[70,71,73]},"sc":{"st":"av","s":[70,71,73]},"sa":{"st":"av","s":[70,71,73]},"ct":{"st":"av","s":[70,71,73]}},"sr":[70,71,73]},{"id":"hemorroides-constipation","n":"Hémorroïdes + Constipation","o":["ord-070"],"df":"Association d'une maladie hémorroïdaire et d'une constipation, qui s'entretiennent : la constipation est un facteur favorisant de la poussée hémorroïdaire.","ct":"La régularisation du transit intestinal (fibres, mucilages, laxatifs osmohydratants) fait partie intégrante du traitement de la maladie hémorroïdaire (VIDAL). Traitement de la poussée : voir fiche Hémorroïdes (topiques, veinotoniques en cure courte à forte dose pour la crise interne, antalgiques pour la thrombose externe). Posologies : à compléter (RCP).","q":{"df":{"st":"av","s":[70,71]},"ct":{"st":"av","s":[70,71]}},"sr":[70,71]},{"id":"herpes","n":"Herpes","o":["ord-071"],"df":"Infection virale récidivante de la peau et des muqueuses due au virus herpes simplex. La primo-infection a lieu typiquement dans l'enfance (6 mois à 5 ans) et se manifeste par une gingivo-stomatite aiguë parfois sévère ; le virus persiste ensuite dans l'organisme et provoque, chez certains patients, des poussées d'herpès labial par réactivation, habituellement bénignes.","sc":"**Herpès labial récidivant** : sensation d'irritation puis éruption de vésicules en bouquet sur fond érythémateux, à la jonction cutanéo-muqueuse des lèvres (« bouton de fièvre »), autour de la bouche, avec extension possible au visage ; pas de malaise, d'adénopathie ni de fièvre. **Gingivo-stomatite herpétique aiguë (primo-infection)** : vésicules multiples sur la muqueuse buccale et les lèvres, qui se rompent en ulcérations jaunâtres douloureuses parfois étendues, avec malaise général, adénopathies satellites et fièvre. Facteurs favorisant les récurrences : fatigue, stress, fièvre, infections, règles, rayons ultraviolets, lésions tissulaires, rapports sexuels (herpès génital).","sa":"Être très attentif aux autres localisations : buccale, génitale, oculaire, et aux surinfections bactériennes. Gingivo-stomatite sévère de l'enfant avec impossibilité de boire et douleur importante : risque important de déshydratation. Récidives fréquentes ou formes extensives : penser à une infection par le VIH. Formes graves ou compliquées : herpès oculaire, herpès de l'immunodéprimé (chronique ou atteinte systémique), herpès néonatal.","ct":"**Herpès labial récidivant** : nettoyer à l'eau et au savon 2 fois par jour jusqu'à guérison ; en cas de surinfection bactérienne, antibiothérapie comme pour l'impétigo. **Gingivo-stomatite herpétique aiguë** : traiter la douleur (paracétamol ou ibuprofène PO) ; si lésions sévères, impossibilité de boire et douleur importante, hospitaliser l'enfant (risque de déshydratation) ; si vu dans les 96 heures suivant le début des symptômes, aciclovir PO pendant 5 à 7 jours : enfant de moins de 2 ans 200 mg 5 fois par jour ; enfant de 2 ans et plus et adulte 400 mg 5 fois par jour (MSF). **Récurrences fréquentes** (plus de 6 par an) d'herpès orofacial non induit par le soleil ou d'herpès génital : aciclovir ou valaciclovir (ou famciclovir pour l'herpès génital) per os pendant 6 à 12 mois, traitement dit suppressif (VIDAL). Herpès génital : voir « Ulcérations génitales » du guide MSF (page non consultée dans ce lot).","q":{"df":{"st":"av","s":[49,50,51]},"sc":{"st":"av","s":[49,50,51]},"sa":{"st":"av","s":[49,50,51]},"ct":{"st":"av","s":[49,50,51]}},"sr":[49,50,51]},{"id":"hypercholesterolemie","n":"Hypercholestérolémie","o":["ord-072"]},{"id":"hyperglycemie-avec-acetonurie","n":"Hyperglycémie avec acétonurie","o":["ord-073"]},{"id":"hyper-tension-arterielle-hta","n":"Hyper Tension Artérielle (HTA)","o":["ord-074"],"df":"Pression trop élevée dans les vaisseaux sanguins (140/90 mmHg ou plus). On parle d'hypertension lorsque l'on constate, à deux reprises et pas le même jour, une tension systolique ≥ 140 mmHg et/ou diastolique ≥ 90 mmHg. Fréquente, elle peut être grave si elle n'est pas traitée.","sc":"La plupart des personnes ne ressentent aucun symptôme : la seule façon de la dépister est de mesurer la tension artérielle. Les pressions très élevées (habituellement 180/120 ou plus) peuvent causer des maux de tête intenses, des douleurs thoraciques, des vertiges, une difficulté à respirer, des nausées, des vomissements, une vision floue, de l'anxiété, une confusion, des bourdonnements d'oreille, des saignements de nez ou une anomalie du rythme cardiaque. Facteurs de risque : âge avancé (> 65 ans), bagage génétique, surpoids ou obésité, manque d'activité physique, alimentation riche en sel, graisses saturées et acides gras trans, consommation excessive d'alcool, tabac, pollution de l'air, diabète ou maladie rénale associés.","sa":"Pression très élevée (habituellement 180/120 ou plus) avec maux de tête intenses, douleurs thoraciques, difficulté à respirer, troubles de la vision, confusion, vomissements ou anomalie du rythme cardiaque : consulter immédiatement un professionnel de santé. Complications d'une hypertension non maîtrisée : angine de poitrine, infarctus du myocarde, insuffisance cardiaque, trouble du rythme pouvant conduire à la mort subite, accident vasculaire cérébral (rupture ou obstruction d'une artère cérébrale), lésions puis insuffisance rénales.","ct":"Faire mesurer la tension par un professionnel de santé. Mode de vie : alimentation saine pauvre en sel (rester en dessous de 2 grammes par jour selon l'OMS), perte de poids, activité physique (au moins 150 minutes par semaine d'activité aérobique modérée ou 75 minutes d'activité soutenue, et renforcement musculaire 2 jours ou plus par semaine), arrêt du tabac, alcool limité (1 verre par jour maximum pour les femmes, 2 pour les hommes). Traitement médicamenteux possible, selon l'avis du médecin : inhibiteurs de l'enzyme de conversion (énalapril, lisinopril), antagonistes des récepteurs de l'angiotensine 2 (losartan, telmisartan), inhibiteurs calciques (amlodipine, félodipine), diurétiques (hydrochlorothiazide, chlorthalidone). Objectif : tension inférieure à 140/90 pour la plupart des personnes ; inférieure à 130/80 en cas de maladie cardiovasculaire, de diabète, de maladie rénale chronique ou de risque cardiovasculaire élevé. Suivi régulier ; ne pas interrompre les médicaments ni les partager.","q":{"df":{"st":"av","s":[33]},"sc":{"st":"av","s":[33]},"sa":{"st":"av","s":[33]},"ct":{"st":"av","s":[33]}},"sr":[33]},{"id":"hypertrophie-benigne-de-la-prostate-hbp","n":"Hypertrophie Bénigne de la Prostate (HBP)","o":["ord-075"]},{"id":"hypotension-orthostatique","n":"Hypotension orthostatique","o":["ord-076"]},{"id":"impetigo","n":"Impétigo","o":["ord-077"],"df":"Infection bactérienne superficielle de la peau, due à Staphylococcus aureus et/ou Streptococcus pyogenes, avec lésions croûteuses jaunes et parfois petites cloques. Fréquente, touche surtout les enfants, extrêmement contagieuse (autres zones du corps ou autres personnes). L'ecthyma est une forme plus profonde (derme). Favorisée par une mauvaise hygiène, un environnement humide, des lésions cutanées (eczéma, piqûre, coup de soleil) et le portage nasal de staphylocoques ou streptocoques.","sc":"Démangeaisons, parfois légère douleur ; le grattage propage l'infection. Groupes de petites cloques qui se rompent et forment une croûte jaunâtre, surtout au visage, aux bras et aux jambes. Impétigo bulleux : cloques plus larges qui laissent une peau à vif puis une croûte jaunâtre. Ecthyma : petits ulcères peu profonds en « coup de poinçon », croûte épaisse brun-noir, peau rouge et gonflée autour, souvent aux jambes, avec risque de cicatrice.","ct":"Petites zones d'impétigo : pommade ou crème antibiotique locale. Atteinte étendue, immunodépression ou épidémie : antibiotique par voie orale. Ecthyma : antibiotiques oraux. Laver doucement à l'eau et au savon plusieurs fois par jour pour enlever les croûtes. Porteur nasal : pommade ou crème antibiotique dans les narines. La source ne donne pas de doses.","q":{"df":{"st":"av","s":[90],"n":"Complété par : Claude (IA) d'après le Manuel MSD. Signes d'alarme non précisés dans la page MSD grand public : champ laissé vide."},"sc":{"st":"av","s":[90]},"ct":{"st":"av","s":[90]},"sa":{"st":"av","s":[],"n":"Champ laissé vide par la source consultée : à compléter. Signes d'alarme non précisés dans la page MSD grand public : champ laissé vide."}},"sr":[90]},{"id":"ingestion-d-un-caustique","n":"Ingestion d’un caustique","o":["ord-078"]},{"id":"infection-broncho-pulmonaire","n":"Infection broncho-pulmonaire","o":["ord-079"],"df":"Les germes les plus fréquents des pneumonies de l'enfant de plus de 5 ans et de l'adulte sont les virus, le pneumocoque et Mycoplasma pneumoniae.","sc":"Toux, plus ou moins expectoration purulente, fièvre, douleur thoracique, tachypnée ; examen pulmonaire : diminution du murmure vésiculaire, matité, foyer de crépitants, parfois souffle tubaire. Un début brutal avec fièvre > 39 °C, douleur thoracique et herpès labial est en faveur du pneumocoque ; le tableau peut être trompeur chez l'enfant (douleurs abdominales, syndrome méningé).","sa":"Signes de gravité : cyanose (lèvres, muqueuse buccale, ongles), battements des ailes du nez, tirage intercostal ou sus-claviculaire, fréquence respiratoire > 30/min, fréquence cardiaque > 125/min, troubles de la conscience (somnolence, confusion). Patients à risque : sujets âgés, insuffisance cardiaque, drépanocytose, bronchite chronique sévère, déficit immunitaire (malnutrition sévère, VIH avec CD4 \u003c 200).","ct":"Sans signe de gravité (ambulatoire) : amoxicilline PO pendant 5 jours (enfant 30 mg/kg 3 fois par jour, max 3 g/j ; adulte 1 g 3 fois par jour) ; revoir à 48–72 h : amélioration, poursuivre ; pas d'amélioration au 3e jour, ajouter azithromycine (pneumonie atypique) ; aggravation, hospitaliser. Pneumonie sévère (hôpital) : ceftriaxone IM/IV (enfant 50 mg/kg une fois par jour ; adulte 1 g une fois par jour) au moins 3 jours, puis amoxicilline PO pour compléter 7 à 10 jours, ou ampicilline IV/IM (enfant 50 mg/kg toutes les 6 h ; adulte 1 g toutes les 6 à 8 h) ; sans amélioration à 48 h : ceftriaxone + cloxacilline IV (enfant 25 à 50 mg/kg toutes les 6 h ; adulte 2 g toutes les 6 h), puis relais par amoxicilline/acide clavulanique PO pour 10 à 14 jours après amélioration et 3 jours d'apyrexie ; penser à la tuberculose si pas d'amélioration après 48 h de ceftriaxone + cloxacilline, sinon ajouter l'azithromycine. Traitement adjuvant : paracétamol, désobstruction du rhinopharynx, oxygène pour SpO2 ≥ 90 %, hydratation et alimentation.","q":{"df":{"st":"av","s":[35],"n":"Contenu rattaché à la pneumonie de l'enfant de plus de 5 ans et de l'adulte (guide MSF) : à confirmer par rapport au sens de « infection broncho-pulmonaire » dans vos ordonnances. La définition précise de la pneumonie n'est pas donnée par la source."},"sc":{"st":"av","s":[35]},"sa":{"st":"av","s":[35]},"ct":{"st":"av","s":[35]}},"sr":[35]},{"id":"infection-genitale-chez-la-femme","n":"Infection génitale chez la femme","o":["ord-080"]},{"id":"infection-urinaire","n":"Infection urinaire","o":["ord-081"],"df":"Infection des voies urinaires : cystite (vessie et urètre) ou pyélonéphrite (parenchyme rénal), le plus souvent due à Escherichia coli (au moins 70 % des cas de cystite). La pyélonéphrite est potentiellement sévère, en particulier chez la femme enceinte, le nouveau-né et le nourrisson.","sc":"Cystite : brûlures mictionnelles et pollakiurie, sans fièvre (ou fièvre modérée) ni douleur lombaire. Pyélonéphrite : signes de cystite avec fièvre > 38 °C et douleur lombaire unilatérale ou abdominale, nausées et vomissements ; nourrisson : fièvre isolée, irritabilité, vomissements, refus de s'alimenter. Bandelette urinaire (nitrites, leucocytes) et ECBU si disponible.","sa":"Éliminer une pyélonéphrite devant toute fièvre ou douleur lombaire. Hospitaliser les patients à risque (enfants, femmes enceintes, hommes, anomalie des voies urinaires, immunodépression grave), les formes compliquées et les signes de gravité (sepsis, choc, déshydratation). Cystites récidivantes (> 3 à 4 par an) : chercher calculs, schistosomiase urinaire, tuberculose urinaire, gonococcie.","ct":"Voir les fiches « Cystite » et « PNA ». Cystite de la femme jeune hors grossesse : fosfomycine-trométamol PO 3 g en dose unique ou nitrofurantoïne PO 100 mg 3 fois par jour pendant 5 jours ; fillette ≥ 2 ans : céfixime PO 8 mg/kg une fois par jour pendant 3 jours. Pyélonéphrite : antibiothérapie selon la gravité (ceftriaxone, gentamicine, ciprofloxacine, amoxicilline/acide clavulanique), hydratation, pas d'AINS.","q":{"df":{"st":"av","s":[36,37],"n":"Fiche de synthèse rattachée aux guides MSF « Cystite aiguë » et « Pyélonéphrite aiguë » : à adapter au sens donné à « infection urinaire » dans vos ordonnances."},"sc":{"st":"av","s":[36,37]},"sa":{"st":"av","s":[36,37]},"ct":{"st":"av","s":[36,37]}},"sr":[36,37]},{"id":"insomnie","n":"Insomnie","o":["ord-082"]},{"id":"insomnie-occasionnelle","n":"Insomnie occasionnelle","o":["ord-083"]},{"id":"intertrigo-inter-orteil","n":"Intertrigo inter-orteil","o":["ord-084"],"df":"Dans le Manuel MSD, l'atteinte mycosique des espaces entre les orteils correspond au pied d'athlète (tinea pedis) : infection à dermatophytes (généralement Trichophyton) de la peau des pieds, la dermatophytose la plus fréquente. Favorisée par la transpiration et l'humidité entre les orteils et les chaussures étroites ; transmission dans les bains publics, douches communes et lieux humides où l'on marche pieds nus.","sc":"Peau entre les orteils qui se craquelle, desquame et rougit souvent ; démangeaisons possibles. La desquamation peut toucher toute la plante du pied, avec parfois fissures douloureuses et vésicules ; la peau de la plante peut s'épaissir avec le temps.","sa":"Les fissures peuvent se compliquer d'infection bactérienne, surtout chez les adultes âgés et les personnes dont la circulation sanguine du pied est réduite.","ct":"Antimycosique local (traitement le plus sûr) ; récidives fréquentes, traitement souvent prolongé. Antimycosiques oraux (itraconazole, terbinafine) efficaces mais avec effets secondaires ; parfois association locale + orale. Limiter l'humidité : chaussures ouvertes ou qui respirent, chaussettes changées souvent, espaces entre les orteils bien séchés après bain ou douche ; poudres antimycosiques (miconazole), violet de gentiane, solution de chlorure d'aluminium ou bains de solution de Burow. La source ne donne pas de doses.","q":{"df":{"st":"av","s":[113],"n":"Complété par : Claude (IA) d'après le Manuel MSD. Équivalence retenue : intertrigo inter-orteil mycosique = pied d'athlète. Une intertrigo bactérien ou candidosique serait à traiter différemment."},"sc":{"st":"av","s":[113]},"sa":{"st":"av","s":[113]},"ct":{"st":"av","s":[113]}},"sr":[113]},{"id":"intertrigo-a-candida-albicans","n":"Intertrigo à Candida Albicans","o":["ord-085"],"df":"Candidose des plis cutanés (aine, aisselles, sous les seins, plis du ventre, espaces interdigitaux) due à la levure Candida. Favorisée par : climat chaud et humide, sous-vêtements synthétiques serrés, manque d'hygiène, couches ou sous-vêtements changés trop rarement, diabète, immunodépression (VIH avancé, corticoïdes, immunosuppresseurs), grossesse, obésité, antibiotiques, autres maladies de peau (intertrigo, psoriasis).","sc":"Éruption rouge vif des plis, parfois fissurée, avec petites pustules surtout sur les bords, démangeaisons intenses ou sensation de brûlure.","sa":"Chez certaines personnes, surtout immunodéprimées, Candida peut gagner les tissus profonds et le sang : candidose systémique potentiellement mortelle.","ct":"Crème, poudre ou solution antimycosique locale (miconazole, clotrimazole, oxiconazole, kétoconazole, éconazole, ciclopirox, nystatine) ; garder la zone sèche (solution de Burow, antitranspirants locaux) pour guérir et éviter les récidives ; si de nombreux plis sont infectés : antimycosique oral (fluconazole). La source ne donne pas de doses.","q":{"df":{"st":"av","s":[114],"n":"Complété par : Claude (IA) d'après le Manuel MSD. Page MSD « Candidose » (rubrique candidose des plis). Une page « Intertrigo » existe aussi dans le Manuel MSD (non lue)."},"sc":{"st":"av","s":[114]},"sa":{"st":"av","s":[114]},"ct":{"st":"av","s":[114]}},"sr":[114]},{"id":"intoxication-alimentaire","n":"Intoxication alimentaire","o":["ord-086"],"df":"Au sens strict (MSD) : gastro-entérite due à l'ingestion d'une plante ou d'un produit animal contenant une toxine (champignons ou plantes vénéneuses, poissons ou mollusques contaminés, aliments souillés par des toxines externes comme le plomb, l'arsenic, les insecticides, le cadmium, ou toxine bactérienne comme dans l'intoxication à staphylocoque). L'expression est souvent employée à tort pour toute gastro-entérite : la plupart des vomissements et diarrhées relèvent d'une infection digestive virale ou bactérienne. Diarrhée aiguë (MSF) : au m
