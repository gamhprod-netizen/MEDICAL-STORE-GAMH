ique : 20 mg/j (4 semaines, 4 de plus si besoin ; 40 mg/j si faible réponse, environ 8 semaines). Prévention des récidives : 20 mg/j (10 mg parfois suffisant ; 40 mg si échec). Éradication d'H. pylori : 20 mg deux fois par jour pendant une semaine avec deux antibiotiques (par exemple clarithromycine 500 mg + amoxicilline 1 g, chacun deux fois par jour), en tenant compte des résistances et recommandations. Ulcères liés aux AINS : 20 mg/j (4 semaines, 4 de plus si besoin) ; prévention chez le patient à risque (> 60 ans, antécédent d'ulcère ou d'hémorragie digestive) : 20 mg/j. Œsophagite par reflux : 20 mg/j (4 semaines, 4 de plus si besoin), 40 mg/j si sévère (8 semaines) ; entretien : 10 mg/j (20–40 mg si nécessaire). RGO symptomatique : 20 mg/j (10 mg parfois suffisant) ; investigations si symptômes non contrôlés après 4 semaines. Zollinger-Ellison : 60 mg/j au départ, ajusté ; au-delà de 80 mg/j, en 2 prises.","cix":"Hypersensibilité à l'oméprazole, aux dérivés benzimidazolés ou à un excipient ; association avec le nelfinavir. La notice cite aussi l'allergie à un autre inhibiteur de la pompe à protons. Association avec la rilpivirine (contre-indication inscrite au RCP de la rilpivirine).","ei":"Les plus fréquents (1 à 10 %) : céphalées, douleurs abdominales, constipation, diarrhée, flatulences, nausées/vomissements, polypes bénins des glandes fundiques. Peu fréquents : insomnie, étourdissements, paresthésies, somnolence, vertiges, élévation des enzymes hépatiques, dermatite, prurit, rash, urticaire, fractures (hanche, poignet, vertèbres), malaise, œdème périphérique. Rares : leucopénie, thrombopénie, hypersensibilité (angio-œdème, choc anaphylactique), hyponatrémie, agitation, confusion, dépression, troubles du goût, vision trouble, bronchospasme, sécheresse buccale, stomatite, candidose digestive, hépatite, alopécie, photosensibilité, PEAG, DRESS, arthralgies, myalgies, néphrite tubulo-interstitielle, sudation. Très rares : agranulocytose, pancytopénie, agressivité, hallucinations, insuffisance hépatique, érythème polymorphe, Stevens-Johnson, Lyell, faiblesse musculaire, gynécomastie. Fréquence indéterminée : hypomagnésémie (parfois avec hypocalcémie et hypokaliémie), colite microscopique, lupus érythémateux cutané subaigu. Surdosage : effets transitoires (nausées, vomissements, étourdissements, douleurs abdominales, diarrhée, céphalées), traitement symptomatique.","pr":"Symptômes d'alarme (perte de poids involontaire, vomissements répétés, dysphagie, hématémèse, méléna) ou ulcère gastrique suspecté : écarter une lésion maligne avant traitement. Atazanavir : association non recommandée. Réduction possible de l'absorption de la vitamine B12 au long cours. Inhibiteur du CYP2C19 ; association avec le clopidogrel déconseillée. Hypomagnésémie possible après au moins 3 mois : dosage du magnésium avant et pendant un traitement prolongé ou associé à la digoxine ou aux diurétiques. Réactions cutanées sévères (Stevens-Johnson, NET, DRESS, PEAG) : arrêt. Risque modérément accru de fractures (hanche, poignet, vertèbres) en cas de fortes doses et de traitement > 1 an. Lupus cutané subaigu : arrêt si lésions sur zones exposées. Néphrite tubulo-interstitielle : arrêt si suspicion. Chromogranine A : arrêter l'oméprazole au moins 5 jours avant le dosage. Enfant : traitement long déconseillé, risque légèrement accru d'infections digestives. Contient du lactose.","it":"Contre-indiquée : nelfinavir ; rilpivirine (RCP EDURANT : IPP dont l'oméprazole contre-indiqués, baisse d'absorption de la rilpivirine). Déconseillées ou à éviter : atazanavir, clopidogrel, posaconazole, erlotinib. Absorption diminuée : kétoconazole, itraconazole. Surveillance : digoxine (biodisponibilité +10 %, prudence chez le sujet âgé à fortes doses), phénytoïne (concentrations pendant les 2 premières semaines), antivitamines K dont la warfarine (INR), cilostazol (exposition augmentée), tacrolimus (concentrations et fonction rénale), saquinavir, méthotrexate (arrêt temporaire possible à forte dose). Concentrations d'oméprazole augmentées par les inhibiteurs du CYP2C19/3A4 (clarithromycine, voriconazole) et diminuées par les inducteurs (rifampicine, millepertuis).","pen":"Enfant à partir d'un an et ≥ 10 kg (œsophagite par reflux, pyrosis et régurgitations) : 10–20 kg : 10 mg une fois par jour (20 mg si nécessaire) ; ≥ 2 ans et > 20 kg : 20 mg une fois par jour (40 mg si nécessaire) ; durée 4 à 8 semaines pour l'œsophagite, 2 à 4 semaines pour les symptômes. Enfant de plus de 4 ans et adolescent, ulcère duodénal à H. pylori (suivi par un spécialiste, 7 jours, parfois 14) : 15–30 kg : oméprazole 10 mg + amoxicilline 25 mg/kg + clarithromycine 7,5 mg/kg ; 31–40 kg : 20 mg + amoxicilline 750 mg + clarithromycine 7,5 mg/kg ; > 40 kg : 20 mg + amoxicilline 1 g + clarithromycine 500 mg, le tout deux fois par jour. Non recommandé avant 1 an ou \u003c 10 kg (notice).","pgr":"Peut être utilisé pendant la grossesse : trois études épidémiologiques prospectives (plus de 1 000 grossesses exposées) n'indiquent aucun effet indésirable sur la grossesse ni sur le fœtus ou le nouveau-né.","pal":"Excrété dans le lait maternel, mais probablement sans influence sur l'enfant aux doses thérapeutiques.","pag":"Aucune adaptation posologique nécessaire (métabolisme légèrement réduit à 75–79 ans).","pir":"Aucun ajustement posologique nécessaire en cas d'insuffisance rénale.","pih":"Une dose journalière de 10 à 20 mg peut suffire ; un ajustement peut être nécessaire en cas d'insuffisance hépatique sévère avec traitement prolongé.","q":{"cl":{"st":"av","s":[16,122],"n":"Divergence résolue : libellé de classe du Word plus général ; classification ATC du RCP de l'ANSM conservée. Valeur du Word non reprise : « Inhibiteur de la pompe à protons »."},"ind":{"st":"av","s":[16,122],"n":"Divergence résolue : l'hémorragie digestive du Word relève de la forme injectable (non lue) ; le RCP lu concerne la gélule 20 mg. Indications du RCP conservées. Valeur du Word non reprise : « RGO, ulcère, Helicobacter, hémorragie digestive »."},"ma":{"st":"av","s":[16,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Inhibe H+/K+-ATPase gastrique »."},"pos":{"st":"av","s":[16,122],"n":"Divergence résolue : le Word (20–40 mg/j) est compatible avec le RCP MOPRAL ; la voie IV relève d'une autre présentation non lue. Valeur du RCP conservée. Valeur du Word non reprise : « Adulte (valeur usuelle indicative) : 20–40 mg/j ; IV 40 mg »."},"cix":{"st":"av","s":[16,17,122],"n":"Complété à partir du RCP EDURANT (EMA, rubrique 4.3), cité par le document Word : association avec la rilpivirine contre-indiquée. Absente du RCP MOPRAL lu. Divergence résolue : la rilpivirine citée par le Word est confirmée par le RCP EDURANT (EMA, rubrique 4.3 : IPP dont l'oméprazole contre-indiqués) ; ajoutée aux contre-indications et aux interactions de la fiche. Valeur du Word non reprise : « Hypersensibilité, rilpivirine »."},"ei":{"st":"av","s":[16,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Céphalées, diarrhée, hypomagnésémie (long cours) »."},"pr":{"st":"av","s":[16]},"it":{"st":"av","s":[16,17],"n":"Rilpivirine ajoutée à partir du RCP EDURANT (EMA, rubrique 4.3), cité par le document Word."},"pen":{"st":"av","s":[16]},"pgr":{"st":"av","s":[16]},"pal":{"st":"av","s":[16]},"pag":{"st":"av","s":[16]},"pir":{"st":"av","s":[16]},"pih":{"st":"av","s":[16]}},"sr":[16,17,122],"nc":["Losec","Mopral"]},{"id":"oracilline","n":"Oracilline","d":"phénoxyméthylpénicilline","f":["cp"],"dz":["250mg"],"g":"phenoxymethylpenicilline","o":["ord-130"],"r":""},{"id":"oroken","n":"Oroken","d":"céfixime","f":["cp"],"dz":["200mg"],"g":"cefixime","o":["ord-122","ord-123","ord-143"],"r":""},{"id":"osmotol","n":"Osmotol","d":"","f":["lotion"],"dz":[],"g":null,"o":["ord-108"],"r":""},{"id":"ospamox","n":"Ospamox","d":"amoxicilline","f":["cp"],"dz":["500mg/susp"],"g":"amoxicilline","o":["ord-108"],"r":"","cl":"Pénicillines à large spectre, bêta-lactamines (ATC J01CA04)","q":{"cl":{"st":"av","s":[2,7,122],"n":"Information « substance » issue du RCP CLAMOXYL 500 mg ; RCP propre à la marque non relu (posologies non propagées). Divergence résolue : libellé de classe du Word plus général ; classification ATC du RCP de l'ANSM conservée. Valeur du Word non reprise : « Antibiotique, β-lactamine (aminopénicilline) »."},"ma":{"st":"av","s":[2,7,122],"n":"Information « substance » issue du RCP CLAMOXYL 500 mg ; RCP propre à la marque non relu (posologies non propagées). Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Inhibe la synthèse de la paroi bactérienne (liaison aux PLP) »."},"cix":{"st":"av","s":[2,7,122],"n":"Information « substance » issue du RCP CLAMOXYL 500 mg ; RCP propre à la marque non relu (posologies non propagées). Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Allergie aux pénicillines »."},"ei":{"st":"av","s":[2,7,122],"n":"Information « substance » issue du RCP CLAMOXYL 500 mg ; RCP propre à la marque non relu (posologies non propagées). Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Diarrhée, éruption, candidose, allergie »."},"it":{"st":"av","s":[2,7],"n":"Information « substance » issue du RCP CLAMOXYL 500 mg ; RCP propre à la marque non relu (posologies non propagées)."},"pgr":{"st":"av","s":[2,7],"n":"Information « substance » issue du RCP CLAMOXYL 500 mg ; RCP propre à la marque non relu (posologies non propagées)."},"pal":{"st":"av","s":[2,7],"n":"Information « substance » issue du RCP CLAMOXYL 500 mg ; RCP propre à la marque non relu (posologies non propagées)."},"dci":{"st":"av","s":[7]},"pos":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ind":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."}},"ma":"Pénicilline semi-synthétique (bêta-lactamine) : inhibe les protéines de liaison aux pénicillines de la synthèse du peptidoglycane, ce qui fragilise la paroi bactérienne puis provoque la lyse. Inactivée par les bêta-lactamases (spectre sans activité sur les germes qui en produisent).","cix":"Hypersensibilité à l'amoxicilline, aux pénicillines ou à un excipient ; antécédent de réaction d'hypersensibilité immédiate sévère (anaphylaxie) à une autre bêta-lactamine (céphalosporine, carbapénème, monobactame).","ei":"Les plus fréquents : diarrhées, nausées, éruptions cutanées. Peu fréquents : vomissements, urticaire, prurit. Très rares : réactions allergiques sévères (œdème de Quincke, anaphylaxie, maladie sérique), réactions cutanées sévères (érythème polymorphe, Stevens-Johnson, nécrolyse épidermique toxique, PEAG, DRESS), colite associée aux antibiotiques, leucopénie, thrombopénie et anémie hémolytique réversibles, hépatite et ictère cholestatique, néphrite interstitielle, convulsions, vertiges, candidose. Fréquence indéterminée : syndrome de Kounis, lymphohistiocytose hémophagocytaire, entérocolite induite par le médicament (surtout enfant), cristallurie, méningite aseptique, réaction de Jarisch-Herxheimer.","it":"Probénécide : association non recommandée (↑ taux d'amoxicilline) ; allopurinol : ↑ risque de réactions cutanées allergiques ; tétracyclines et autres bactériostatiques : possible interférence avec l'effet bactéricide ; anticoagulants oraux (acénocoumarol, warfarine) : ↑ possible de l'INR, surveillance ; méthotrexate : ↑ de sa toxicité (excrétion réduite).","pgr":"Utilisable si le bénéfice attendu l'emporte sur le risque ; pas d'augmentation du risque de malformation sur données limitées. Peut fausser le dosage de l'œstriol.","pal":"Excrétée en petites quantités dans le lait (risque de sensibilisation, diarrhée et candidose possibles chez le nourrisson) ; utilisation après évaluation du rapport bénéfice/risque par le médecin.","sr":[2,7,122],"pos":"Adulte (valeur usuelle indicative) : 500 mg 3x/j ou 1 g 2–3x/j","ind":"Infections ORL, respiratoires, urinaires, otite, helicobacter","nc":["Amoxil","Clamoxyl"]},{"id":"otipax","n":"Otipax","d":"phénazone + lidocaïne","f":["sol"],"dz":[],"g":"phenazone-lidocaine","o":["ord-108","ord-109"],"r":""},{"id":"otofa","n":"Otofa","d":"rifamycine","f":["sol"],"dz":[],"g":"rifamycine","o":["ord-108"],"r":""},{"id":"oxacilline","n":"Oxacilline","d":"oxacilline","f":["cp","gel","inj"],"dz":["01g","500mg"],"g":"oxacilline","o":["ord-001","ord-002","ord-019","ord-117","ord-118"],"r":"","cl":"Pénicillines résistantes aux bêta-lactamases, groupe M (ATC J01CF02)","ind":"Adulte et enfant, traitement curatif des infections dues à des staphylocoques sensibles : respiratoires, ORL, rénales, uro-génitales, neuro-méningées, ostéo-articulaires, endocardites ; infections cutanées dues à des staphylocoques et/ou streptocoques sensibles ; prophylaxie des infections post-opératoires en neurochirurgie (dérivation interne du LCR). Voie intraveineuse uniquement (présentation 1 g/5 mL). Tenir compte des recommandations officielles sur l'usage des antibactériens.","ma":"Antibiotique bêta-lactamine, pénicilline du groupe M (résistante aux bêta-lactamases staphylococciques). Spectre : Streptococcus pyogenes et Clostridium perfringens habituellement sensibles ; Staphylococcus aureus inconstamment sensible (résistance à la méticilline d'environ 20 à 30 %, surtout en milieu hospitalier) ; staphylocoques à coagulase négative résistants dans 50 % des cas ou plus en France. Le RCP lu ne détaille pas le mécanisme moléculaire.","pos":"Présentation IV 1 g/5 mL : perfusion intraveineuse lente uniquement (la voie IM est inadéquate). Adulte à fonction rénale normale : traitement curatif 8 à 12 g/j en 4 à 6 administrations. Prévention en chirurgie (neurochirurgie) : 2 g IV à l'induction anesthésique, puis 1 g IV toutes les 2 h si l'intervention se prolonge ; antibioprophylaxie de courte durée, jamais plus de 48 h. Des doses inférieures aux doses recommandées peuvent favoriser des germes résistants.","pen":"Enfant à fonction rénale normale : 100 à 200 mg/kg/j en 4 à 6 administrations, sans dépasser 12 g/j. Posologie non étudiée chez l'enfant insuffisant rénal et/ou hépatique. Prudence chez le nouveau-né (risque d'hyperbilirubinémie par compétition de fixation sur les protéines, ictère nucléaire).","cix":"Hypersensibilité à l'oxacilline, aux autres bêta-lactamines (pénicillines, céphalosporines) ou à un excipient ; administration par voie sous-conjonctivale. Antécédent d'allergie typique à ces produits : contre-indication formelle.","ei":"Immunitaires : prurit, urticaire, bronchospasme, œdème de Quincke, exceptionnellement choc anaphylactique, éosinophilie. Cutanés : éruption maculo-papuleuse, exceptionnellement bulleuse ou pustuleuse. Digestifs : nausées, vomissements, diarrhée, stomatite, langue noire, colite pseudomembraneuse. Hépatiques : élévation des transaminases (parfois avec fièvre, nausées, vomissements), élévation transitoire des phosphatases alcalines. Neurologiques : encéphalopathie, troubles de la conscience, confusion, mouvements anormaux, myoclonies, crises épileptiformes (surtout en cas de surdosage ou d'insuffisance rénale). Rénaux : néphropathies interstitielles aiguës immuno-allergiques, tubulopathies. Hématologiques : éosinophilie, anémie hémolytique, agranulocytose, neutropénie, leucopénie, dépression médullaire. Fièvre. Surdosage : manifestations neuropsychiques, rénales et digestives ; non hémodialysable.","pr":"Toute manifestation allergique impose l'arrêt ; interrogatoire préalable (allergie croisée avec les céphalosporines dans 5 à 10 % des cas). Diarrhées associées à Clostridioides difficile possibles jusqu'à deux mois après le traitement : médicaments inhibant le péristaltisme contre-indiqués. Fortes doses chez l'insuffisant rénal ou en cas d'antécédents de convulsions, d'épilepsie traitée ou d'atteinte méningée : troubles neurologiques possibles. Encéphalopathie possible, surtout en cas d'insuffisance rénale ou de surdosage. Insuffisance rénale sévère : attention particulière. Insuffisance hépatique associée à une insuffisance rénale : contrôle de l'oxacillinémie. Insuffisant rénal ou plus de 65 ans : numération formule sanguine et fonction hépatique au moins une fois par semaine. Voie IM inadéquate. Prudence chez le nouveau-né.","it":"Association déconseillée : méthotrexate (augmentation de ses effets et de sa toxicité hématologique, par inhibition de sa sécrétion tubulaire rénale). Incompatibilité avec les aminoglycosides : ne pas mélanger, les administrer séparément (inactivation mutuelle in vitro, concentrations d'aminoglycoside faussement diminuées). Ne pas mélanger avec d'autres médicaments. Anticoagulants oraux : déséquilibres de l'INR rapportés avec les antibiotiques (surveillance).","pgr":"La sécurité d'emploi pendant la grossesse n'a pas été établie ; utilisation possible si elle est clairement justifiée.","pal":"L'oxacilline passe dans le lait maternel (faible passage selon la notice) ; précautions chez la femme qui allaite ; surveiller diarrhée, éruption et candidose chez le nouveau-né.","pag":"Plus de 65 ans : numération formule sanguine et fonction hépatique à surveiller au moins une fois par semaine.","pir":"Aucune adaptation posologique requise ; attention particulière en cas d'insuffisance rénale sévère (voir précautions).","pih":"Insuffisance hépatique associée à une insuffisance rénale : attention particulière et contrôle des taux d'oxacillinémie ; posologie non étudiée chez l'enfant insuffisant hépatique.","q":{"cl":{"st":"av","s":[18]},"ind":{"st":"av","s":[18]},"ma":{"st":"av","s":[18]},"pos":{"st":"av","s":[18]},"pen":{"st":"av","s":[18]},"cix":{"st":"av","s":[18]},"ei":{"st":"av","s":[18]},"pr":{"st":"av","s":[18]},"it":{"st":"av","s":[18]},"pgr":{"st":"av","s":[18]},"pal":{"st":"av","s":[18]},"pag":{"st":"av","s":[18]},"pir":{"st":"av","s":[18]},"pih":{"st":"av","s":[18]}},"sr":[18]},{"id":"panadol-extra","n":"Panadol-Extra","d":"paracétamol + caféine","f":["cp"],"dz":[],"g":"paracetamol-cafeine","o":["ord-097"],"r":""},{"id":"para-plus","n":"Para-Plus","d":"","f":["lotion"],"dz":[],"g":null,"o":["ord-114"],"r":""},{"id":"paracetamol","n":"Paracétamol","d":"paracétamol","f":["cp"],"dz":["01g","500mg","500mg/srp"],"g":"paracetamol","o":["ord-005","ord-006","ord-017","ord-019","ord-043","ord-066","ord-071","ord-096","ord-105","ord-108","ord-118","ord-123"],"r":"","cl":"Autres analgésiques et antipyrétiques – anilides (ATC N02BE01)","ind":"Traitement symptomatique des douleurs légères à modérées et/ou de la fièvre (présentation 1 g : adulte et enfant à partir de 50 kg, environ 15 ans).","ma":"Mécanisme d'action central et périphérique (le RCP consulté n'en donne pas davantage).","pos":"Présentation 1 g, adulte et enfant ≥ 50 kg : 1 g par prise, intervalle ≥ 4 h, maximum 3 g/jour ; jusqu'à 4 g/jour uniquement sur avis médical et sans facteur de risque. Posologie recommandée : environ 60 mg/kg/jour en plusieurs prises. Dose maximale 60 mg/kg/j sans dépasser 3 g/j chez l'adulte \u003c 50 kg, en cas de réserves basses en glutathion (dénutrition, jeûne, cachexie) ou de déshydratation. Dose efficace la plus faible, le moins longtemps possible ; réévaluer si douleur > 5 jours ou fièvre > 3 jours. Tenir compte de tous les médicaments contenant du paracétamol.","cix":"Hypersensibilité au paracétamol ou à un excipient ; insuffisance hépatique sévère.","ei":"Rares : hypersensibilité (érythème, urticaire, rash), purpura, diarrhées, douleurs abdominales. Très rares : thrombopénie, leucopénie, neutropénie, réactions cutanées graves. Fréquence indéterminée : anaphylaxie, choc, œdème de Quincke, bronchospasme (surtout asthmatiques sensibles à l'aspirine ou aux AINS), acidose métabolique à trou anionique élevé, élévation des enzymes hépatiques, érythème pigmenté fixe. Surdosage : atteinte hépatique grave (antidote : N-acétylcystéine).","pr":"Ne pas associer d'autres médicaments contenant du paracétamol (surdosage hépatotoxique). Prudence : adulte \u003c 50 kg, insuffisance hépatique légère à modérée, alcoolisme chronique, insuffisance rénale, syndrome de Gilbert, déficit en G6PD, déshydratation, dénutrition, sujet âgé, inducteurs enzymatiques (phénobarbital, phénytoïne, carbamazépine, topiramate, rifampicine). Arrêt en cas d'hépatite virale aiguë. Alcool déconseillé. Usage fréquent ou prolongé sans avis médical déconseillé.","it":"Précaution : antivitamines K (↑ effet et risque hémorragique à 4 g/j pendant ≥ 4 jours : INR plus fréquent) ; flucloxacilline (risque d'acidose métabolique à trou anionique élevé). Interférence avec le dosage de la glycémie (glucose oxydase-peroxydase) et de l'acide urique.","pgr":"Utilisable si cliniquement nécessaire, à la dose efficace la plus faible, le moins longtemps et le moins souvent possible. Pas de malformation ni de toxicité fœtale/néonatale démontrée ; études sur le neurodéveloppement non concluantes.","pal":"Éliminé en petites quantités dans le lait maternel ; utilisation possible aux doses thérapeutiques.","pag":"La posologie adulte convient en général ; l'adapter aux facteurs de risque associés.","pir":"Adulte, clairance de la créatinine 10–50 mL/min : intervalle ≥ 6 h, maximum 3 g/j ; \u003c 10 mL/min : intervalle ≥ 8 h, maximum 2 g/j.","pih":"Insuffisance hépatique légère à modérée, alcoolisme chronique, syndrome de Gilbert : réduire la dose et espacer les prises, maximum 2 g/j. Contre-indiqué si insuffisance hépatique sévère.","pen":"Dose recommandée : environ 60 mg/kg/j en plusieurs prises (≈ 15 mg/kg toutes les 6 h ou 10 mg/kg toutes les 4 h), intervalle ≥ 4 h, au moins 3 prises/j ; c'est aussi la dose maximale journalière retenue par l'ANSM (3 g/j maximum sans ordonnance). Enfants et adultes \u003c 50 kg : adapter la dose au poids ; la présentation 1 g n'est pas adaptée à l'enfant \u003c 50 kg (des formes pédiatriques existent). Dose efficace la plus faible, durée la plus courte (sans avis médical : 3 jours en cas de fièvre, 5 jours en cas de douleur). Remarque : un RCP de l'association paracétamol-codéine mis à jour le 31/07/2026 cite encore un maximum de 80 mg/kg/j chez l'enfant \u003c 40 kg ; la valeur la plus prudente (60 mg/kg/j) est affichée.","q":{"cl":{"st":"av","s":[0,122],"n":"Divergence résolue : libellé de classe du Word plus général ; classification ATC du RCP de l'ANSM conservée. Valeur du Word non reprise : « Antalgique, antipyrétique »."},"ind":{"st":"av","s":[0,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le Word est compatible mais plus succinct. Valeur du Word non reprise : « Douleur légère à modérée, fièvre »."},"ma":{"st":"av","s":[0,122],"n":"Divergence résolue : le Word précise une inhibition de la COX centrale, non retrouvée dans la source officielle lue (RCP : mécanisme central et périphérique). Précision non reprise, à valider. Valeur du Word non reprise : « Inhibe la COX centrale »."},"pos":{"st":"av","s":[0,122],"n":"Divergence résolue : le Word cite 4 g/j comme maximum. C'est la limite haute admise par les RCP (4 g/j sur avis médical sans facteur de risque, RCP Doliprane 2025 ; maximum absolu de 4 g/j chez l'adulte > 50 kg, RCP Dafalgan codéine 2026), alors que la dose usuelle et le maximum sans ordonnance sont de 3 g/j (ANSM). Valeur du RCP conservée avec cette précision. Valeur du Word non reprise : « Adulte (valeur usuelle indicative) : 500–1000 r indicative, à vérifier (RCP, protocoles nationaux)."}},"pos":"Adulte (valeur usuelle indicative) : 100 mg 2x/j (ou 200 mg/j)","ind":"Infections respiratoires, IST, acné, paludisme (prophylaxie), choléra","cix":"Grossesse, enfant \u003c8 ans","ei":"Photosensibilité, œsophagite, troubles digestifs","ma":"Se lie à la sous-unité 30S du ribosome","sr":[122],"nc":["Vibramycine"]},{"id":"visceralgine","n":"Viscéralgine","d":"tiémonium","f":["cp"],"dz":["50mg"],"g":"tiemonium","o":["ord-048"],"r":""},{"id":"vitabact","n":"Vitabact","d":"picloxydine","f":["collyre"],"dz":[],"g":"picloxydine","o":["ord-032"],"r":""},{"id":"voltarene","n":"Voltarene","d":"diclofénac","f":["cp","sol","supp"],"dz":["100mg","100mg/25mg","500mg","75Lp"],"g":"diclofenac","o":["ord-001","ord-022","ord-050","ord-102","ord-119","ord-139"],"r":"","cl":"Anti-inflammatoires non stéroïdiens (AINS), antirhumatismaux (ATC M01AB05)","ind":"Voltarène 50 mg comprimé, adulte et enfant dès 15 ans : traitement symptomatique au long cours des rhumatismes inflammatoires chroniques (polyarthrite rhumatoïde, spondylarthrite ankylosante et syndromes apparentés, rhumatisme psoriasique) et de certaines arthroses douloureuses et invalidantes ; traitement de courte durée des poussées aiguës de rhumatismes abarticulaires (épaule douloureuse aiguë, tendinites, bursites), d'arthrites microcristallines, d'arthroses, de lombalgies et radiculalgies sévères ; dysménorrhées essentielles après bilan étiologique. Enfant à partir de 35 kg (environ 12 ans) : rhumatismes inflammatoires infantiles uniquement.","ma":"Inhibition de la biosynthèse des prostaglandines, impliquées dans l'inflammation, la douleur et la fièvre ; propriétés anti-inflammatoires, antirhumatismales, analgésiques et antipyrétiques.","pos":"Comprimé 50 mg, adulte : poussées aiguës de rhumatologie 150 mg/j (1 comprimé 3 fois par jour), 7 jours maximum ; traitement d'entretien 75–100 mg/j en 2 ou 3 prises ; dysménorrhée essentielle 100 mg/j en 2 prises (1 comprimé matin et soir). Avaler entier avec de l'eau, de préférence avant le repas. Dose efficace la plus faible, pendant la durée la plus courte. Autres présentations de Voltarène (LP 75 mg, suppositoires, solution injectable) : posologies propres, non incluses (À valider).","cix":"Hypersensibilité ; antécédent d'allergie ou d'asthme déclenché par le diclofénac, un autre AINS ou l'aspirine ; hémorragie ou perforation digestive, ulcère évolutif, antécédents d'ulcère ou d'hémorragie digestive récidivants ou liés aux AINS ; insuffisance hépatique sévère ; insuffisance rénale sévère ; insuffisance cardiaque congestive avérée (NYHA II–IV), cardiopathie ischémique, artériopathie périphérique et/ou maladie vasculaire cérébrale ; traitement par mifamurtide ; enfant de moins de 35 kg (dosage inadapté) ; grossesse à partir du début du 6e mois (24 semaines d'aménorrhée), même après une seule prise.","ei":"Les plus fréquents : digestifs (nausées, vomissements, diarrhée, dyspepsie, douleurs abdominales, flatulence, anorexie), céphalées, étourdissements, vertiges, élévation des transaminases, éruption cutanée. Peu fréquents : infarctus du myocarde, insuffisance cardiaque, palpitations, douleur thoracique. Rares : hypersensibilité et réactions anaphylactiques, hémorragie, ulcère ou perforation gastro-intestinaux, gastrite, hépatite, urticaire, asthme, somnolence. Très rares : thrombopénie, leucopénie, anémie, agranulocytose, œdème de Quincke, atteinte rénale aiguë (néphrite interstitielle, syndrome néphrotique, nécrose papillaire), hépatite fulminante, réactions cutanées sévères (Stevens-Johnson, Lyell, dermatite exfoliative), hypertension, pneumopathie, méningite aseptique, convulsions, AVC, colite, pancréatite. Fréquence indéterminée : syndrome de Kounis, rétention hydrosodée, œdème, hyperkaliémie, érythème pigmenté fixe, colite ischémique. Risque accru d'événements thrombotiques artériels (infarctus, AVC), surtout à 150 mg/j et en traitement prolongé. Surdosage : pas de tableau caractéristique ; transfert hospitalier, traitement symptomatique.","pr":"Dose la plus faible, durée la plus courte. Risque digestif (hémorragie, ulcération, perforation) accru avec la dose, chez le sujet âgé, fragile ou de faible poids et en cas d'antécédents : envisager un protecteur gastrique (misoprostol ou IPP) ; arrêt en cas d'hémorragie ou d'ulcération. Facteurs de risque cardiovasculaire (hypertension, hyperlipidémie, diabète, tabac) : évaluation attentive. Asthme, rhinite allergique, polypose nasale, BPCO : réactions aux AINS plus fréquentes. Arrêt dès un rash cutané, une lésion des muqueuses ou tout signe d'hypersensibilité. Surveillance rénale (diurèse, fonction rénale, kaliémie), notamment avec IEC, sartans, diurétiques, chez le sujet âgé ou en cas d'hypovolémie. Traitement prolongé : contrôle de la formule sanguine et des fonctions hépatique et rénale. Porphyrie hépatique : prudence. Peut masquer les signes d'une infection. Éviter d'associer un autre AINS ou l'aspirine. Fertilité féminine : peut être altérée de façon réversible. Conduite : prudence en cas de vertiges, somnolence ou troubles visuels. Contient du lactose et du ricinoléate de macrogolglycérol (effet laxatif possible).","it":"Contre-indiquée : mifamurtide. Déconseillées : aspirine (doses antalgiques ou anti-inflammatoires), anticoagulants oraux, autres AINS, héparines (doses curatives et/ou sujet âgé), lithium, méthotrexate > 20 mg/semaine, nicorandil, pémétrexed (fonction rénale faible à modérée). Précautions d'emploi : autres anticoagulants et antiagrégants, ciclosporine, tacrolimus, cobimétinib, diurétiques, IEC et sartans (insuffisance rénale aiguë : hydratation et surveillance), méthotrexate ≤ 20 mg/semaine (hémogramme hebdomadaire), pémétrexed (fonction rénale normale), ténofovir disoproxil. À prendre en compte : aspirine antiagrégante, corticoïdes, ISRS, antidiabétiques (surveiller la glycémie), bêta-bloquants, digoxine (digoxinémie), inhibiteurs du CYP2C9 (voriconazole), phénytoïne, quinolones, déférasirox, pentoxifylline, autres hyperkaliémiants.","pgr":"Contre-indiqué à partir du début du 6e mois (24 SA), même en prise unique (toxicité cardio-pulmonaire, constriction du canal artériel, atteinte rénale fœtale, oligoamnios) ; surveillance échographique cardiaque et rénale après une prise à partir de 24 SA. Avant 24 SA ou en cas de projet de grossesse : ne pas prescrire sauf nécessité absolue, dose la plus faible, durée la plus courte ; risque de fausse couche et, pour certains AINS, de malformations au 1er trimestre. Atteinte rénale fœtale possible dès 12 SA, constriction du canal artériel dès 20 SA.","pal":"Passe dans le lait maternel : déconseillé pendant l'allaitement.","pag":"Pas d'ajustement de la dose initiale ; dose minimale efficace et prudence chez le sujet fragile ou de faible poids (risque accru d'effets digestifs graves).","pir":"Contre-indiqué en insuffisance rénale sévère ; prudence en insuffisance rénale légère à modérée (aucune recommandation d'ajustement posologique faute d'étude spécifique).","pih":"Contre-indiqué en insuffisance hépatique sévère ; prudence en insuffisance hépatique légère à modérée, avec surveillance de la fonction hépatique (aucune recommandation d'ajustement posologique faute d'étude spécifique).","pen":"Enfant à partir de 35 kg (environ 12 ans) : rhumatismes inflammatoires infantiles uniquement, 2–3 mg/kg/j en 2 ou 3 prises (35–50 kg : 100–150 mg/j, maximum 150 mg/j). Contre-indiqué en dessous de 35 kg (dosage inadapté).","q":{"cl":{"st":"av","s":[4,122],"n":"Divergence résolue : libellé de classe du Word plus général ; classification ATC du RCP de l'ANSM conservée. Valeur du Word non reprise : « AINS »."},"ind":{"st":"av","s":[4,122],"n":"Divergence résolue : la colique néphrétique du Word relève d'autres présentations (injectable) ; le RCP lu concerne le comprimé 50 mg. Indications du RCP conservées. Valeur du Word non reprise : « Douleur, inflammation, arthrose, colique néphrétique »."},"ma":{"st":"av","s":[4
