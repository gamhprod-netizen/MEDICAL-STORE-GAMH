oins 3 selles liquides par jour depuis moins de 2 semaines.","sc":"Diarrhée, nausées et vomissements ; parfois convulsions et paralysie selon la toxine (MSD). Rechercher en priorité des signes de déshydratation (antécédent de diarrhée et/ou vomissements avec baisse du volume des urines), puis les autres signes : fièvre (salmonellose, diarrhée virale), diarrhée sanglante (la shigellose en est la cause la plus fréquente ; l'amibiase est beaucoup plus rare) (MSF).","sa":"Déshydratation sévère (recherche de choc : tachycardie, hypotension, temps de recoloration cutanée allongé) : réhydratation IV. Liquides mal tolérés : urgences. La déshydratation aiguë et la dénutrition expliquent la forte mortalité des diarrhées, même bénignes (MSF). Certaines toxines sont mortelles ; convulsions ou paralysie : urgence.","ct":"Traitement de base : remplacer les pertes d'eau et d'électrolytes au fur et à mesure jusqu'à l'arrêt de la diarrhée ; évacuer la substance toxique de l'estomac si possible (le plus souvent par les vomissements) ; traitement spécifique parfois nécessaire si la toxine est connue (MSD). **Réhydratation par SRO (MSF / OMS)** : sachet dilué dans 1 litre d'eau propre. Pas de déshydratation (plan A) : SRO après chaque selle liquide. Déshydratation modérée (plan B) : 75 mL/kg de SRO en 4 heures, réévaluer à intervalles réguliers (après 3 heures, 6 heures chez le nourrisson). Déshydratation sévère (plan C) : voie IV. En cas d'œdème palpébral : arrêter les SRO, donner de l'eau pure, puis reprendre selon le plan A. Le lait maternel ne remplace pas la SRO (la donner entre les tétées). Enfant malnutri : protocoles adaptés. Volumes de SRO par âge et par poids : voir le plan de réhydratation OMS du guide MSF. Prévention : éviter champignons et plantes sauvages ou inconnus et poissons contaminés.","q":{"df":{"st":"av","s":[69,38,77,78]},"sc":{"st":"av","s":[69,38,77,78]},"sa":{"st":"av","s":[69,38,77,78]},"ct":{"st":"av","s":[69,38,77,78]}},"sr":[38,69,77,78]},{"id":"keratodermie","n":"Kératodermie","o":["ord-087"]},{"id":"laryngite","n":"Laryngite","o":["ord-088"],"df":"Laryngotrachéite ou laryngotrachéobronchite aiguë (croup, laryngite striduleuse), d'origine virale, touchant surtout le jeune enfant. Virus en cause : parainfluenza (le plus fréquent), VRS, virus grippaux (formes parfois plus sévères), adénovirus, métapneumovirus.","sc":"Toux rauque, « aboyante » (surtout la nuit), voix rauque et stridor inspiratoire ; détresse respiratoire possible. Prodromes de rhinopharyngite 1 à 2 jours avant, fièvre modérée, bon état général. Évolution de 2 à 7 jours ; la forme légère dure généralement 3 à 4 jours et guérit spontanément.","sa":"**Croup sévère** : stridor persistant au repos, surtout avec détresse respiratoire. **Signes de danger** : stridor au repos, détresse respiratoire, hypoxie, ou enfant incapable de boire : hospitaliser. Un aspect toxique et l'absence de toux aboyante évoquent plutôt une épiglottite, un abcès rétropharyngé ou une trachéite bactérienne ; si le traitement n'améliore pas les symptômes, suspecter une trachéite bactérienne.","ct":"Forme légère : traitement symptomatique à domicile (antipyrétiques, hydratation), enfant calme et rassuré. **Dexaméthasone PO** (voie orale de préférence pour ne pas agiter l'enfant) : 0,15 à 0,6 mg/kg, maximum 16 mg (MSF) ; la dose de 0,15 mg/kg est suffisante si l'enfant peut facilement revenir à l'hôpital en cas d'aggravation. Divergence de dose : le cours des HUG indique 0,6 mg/kg, maximum 20 mg ; la fourchette MSF est affichée, à valider. **Formes sévères ou signes de danger** : hospitaliser, poser une voie veineuse et hydrater par voie IV ; adrénaline (épinéphrine) en nébulisation, à répéter toutes les 20 minutes si les signes de sévérité persistent (jamais en IV ni en IM dans le croup ; dose à consulter dans le guide MSF).","q":{"df":{"st":"av","s":[63,64,65]},"sc":{"st":"av","s":[63,64,65]},"sa":{"st":"av","s":[63,64,65]},"ct":{"st":"av","s":[63,64,65]}},"sr":[63,64,65]},{"id":"leishmaniose","n":"Leishmaniose","o":["ord-089"],"df":"Groupe de maladies parasitaires dues à des protozoaires du genre Leishmania, transmis à l'homme par la piqûre d'un insecte vecteur (phlébotome) ; plus de 20 espèces sont pathogènes pour l'homme. Formes cutanées (endémiques dans plus de 70 pays), cutanéomuqueuses (Amérique latine, plus rarement Afrique) et viscérale ou kala azar (plus de 60 pays).","sc":"Cutanées et cutanéomuqueuses : lésion(s) unique ou multiples sur les parties découvertes, papule érythémateuse au site de piqûre qui s'étend en surface et en profondeur pour former une ulcération croûteuse, indolore en l'absence de surinfection ; guérison en général spontanée avec cicatrice et immunité durable. Viscérale (kala azar) : fièvre prolongée (> 2 semaines), splénomégalie et amaigrissement ; anémie, diarrhée, épistaxis, adénopathies, hépatomégalie modérée possibles. Leishmaniose dermique post-kala azar : éruption maculaire, papuleuse ou nodulaire, surtout du visage, après la guérison apparente d'une leishmaniose viscérale. Diagnostic : leishmanies sur étalement (Giemsa) d'une biopsie (cutanée) ou d'une ponction de rate, ganglion ou moelle (viscérale) ; sérologie rK39 et DAT pour la forme viscérale.","sa":"Leishmaniose viscérale : maladie systémique (pancytopénie, immunosuppression), mortelle sans traitement ; complications bactériennes (diarrhée, pneumonie, tuberculose). Forme cutanéomuqueuse : extension aux muqueuses (bouche, nez, conjonctive), parfois très mutilante. Penser à une tuberculose ou à une infection par le VIH en cas de plus d'une rechute ou d'échec du traitement. Les ulcères cutanés sont souvent surinfectés par des streptocoques ou des staphylocoques.","ct":"Se conformer au protocole national (les espèces répondent différemment aux traitements). Forme cutanée : guérison spontanée en 3 à 6 mois ; traiter seulement les lésions persistantes (> 6 mois), défigurantes, ulcéreuses ou disséminées : antimoine pentavalent local (stibogluconate de sodium ou antimoniate de méglumine, 1 à 2 mL infiltrés, renouvelés tous les 3 à 7 jours pendant 2 à 4 semaines) ; voie IM (20 mg/kg/j pendant 10 à 20 jours) réservée aux cas sévères sous surveillance étroite ; miltéfosine PO 28 jours ; antibiotique adapté en cas de surinfection ; forme cutanéomuqueuse : traiter comme une forme viscérale. Forme viscérale, Afrique de l'Est : antimoine pentavalent IM ou IV lente 20 mg/kg/j pendant 17 jours + paromomycine IM 15 mg/kg/j (11 mg base/kg) pendant 17 jours ; 2e ligne (rechutes, formes sévères, femmes enceintes, plus de 45 ans) : amphotéricine B liposomale IV 3 à 5 mg/kg/j pendant 6 à 10 jours, dose totale 30 mg/kg ; co-infection par le VIH : amphotéricine B liposomale + miltéfosine PO pendant 28 jours. Asie du Sud : amphotéricine B liposomale IV 3 à 5 mg/kg/j pendant 3 à 5 jours (dose totale 15 mg/kg) ou 10 mg/kg en dose unique ; rechutes : 3 à 5 mg/kg/j pendant 5 à 8 jours (dose totale 25 mg/kg). Hydratation, soutien nutritionnel et traitement des infections intercurrentes (paludisme, dysenterie, pneumonie) indispensables. Forme dermique post-kala azar : traiter seulement les lésions sévères, défigurantes ou persistantes (> 6 mois) et les jeunes enfants gênés pour s'alimenter. Prévention : moustiquaires imprégnées d'insecticide, lutte contre les vecteurs et les réservoirs animaux.","q":{"df":{"st":"av","s":[42]},"sc":{"st":"av","s":[42]},"sa":{"st":"av","s":[42]},"ct":{"st":"av","s":[42]}},"sr":[42]},{"id":"leucorrhee-blanchatre-mycosique","n":"Leucorrhée blanchâtre = Mycosique","o":["ord-090"]},{"id":"leucorrhee-jaunatre-ecoulement-urinaire-gonocoque-chlamydia-germes-banaux","n":"Leucorrhée jaunâtre + écoulement urinaire (Gonocoque / Chlamydia / Germes banaux)","o":["ord-091"]},{"id":"leucorrhee-verdatre-nauseabonde-trichomonas-vaginalis","n":"Leucorrhée verdâtre nauséabonde = Trichomonas Vaginalis","o":["ord-092"]},{"id":"lombago-aigue","n":"Lombago aigue","o":["ord-093"]},{"id":"maladies-thromboemboliques-des-mi","n":"Maladies thromboemboliques des MI","o":["ord-094"]},{"id":"migraine","n":"Migraine","o":["ord-095","ord-096","ord-097"]},{"id":"migraine-ou-douleur-dentaire-atroce","n":"Migraine ou douleur dentaire atroce","o":["ord-098"]},{"id":"miu-mort-in-utero","n":"MIU (Mort In Utéro)","o":["ord-099"]},{"id":"morsure","n":"Morsure","o":["ord-100"],"df":"Plaie par morsure ou griffure animale, le plus souvent due au chat ou au chien, plus rarement au rat ou à la chauve-souris. Risques : infection de la plaie (inoculation polymicrobienne), tétanos, rage, maladie des griffes du chat. La rage, une fois déclarée, est mortelle mais peut être prévenue tant qu'elle n'est pas déclarée.","sc":"Examen clinique minutieux et exploration de la plaie : profondeur, souillure, tissus dévitalisés, localisation (main, face, organes génitaux, articulations), atteinte vasculaire ou nerveuse. L'examen clinique est décisif pour la prise en charge immédiate.","sa":"**Morsure de chauve-souris** : indication absolue d'une prophylaxie antirabique post-exposition immédiate (immunoglobulines spécifiques et vaccin). Animal inconnu : contacter le centre antirabique. Localisations et situations à risque : plaie profonde, souillée ou délabrante, atteinte vasculaire, main, organes génitaux, visage, proximité d'une articulation ou d'un os, patient immunodéprimé. Risque élevé de tétanos après toute plaie par morsure.","ct":"**Soins de la plaie** : tarir le saignement par compression ; lavage abondant au sérum physiologique, parage des tissus nécrosés (anesthésie locale possible). Contexte rage (MSF) : lavage prolongé de la plaie ou du point de contact pendant 15 minutes à l'eau courante et au savon, retrait des corps étrangers, puis désinfectant (polyvidone iodée 10 %) en précaution supplémentaire. Suture d'emblée si plaie non surinfectée de moins de 12 heures (24 heures pour la face), hors pieds et mains. **Rage** : prophylaxie post-exposition pour les expositions de catégories II et III (MSF) ; immunoglobuline infiltrée dans et autour des plaies après nettoyage, même cicatrisées. **Tétanos** : vérifier le statut vaccinal et compléter selon les antécédents. **Antibiothérapie** : recommandée pour la morsure de chien ou de chauve-souris profonde et, pour les autres animaux, en cas de plaie souillée ou délabrante, de localisation à risque, de suture nécessaire ou d'immunodépression ; amoxicilline + acide clavulanique en référence, 3 prises par jour (Revue du Praticien : 1 g 3 fois par jour ; CBIP : 500/125 mg 3 fois par jour — divergence de dosage à trancher selon la spécialité disponible et le poids), durée courante de 3 à 5 jours. Consultation de suivi une semaine après la morsure.","q":{"df":{"st":"av","s":[79,80,81]},"sc":{"st":"av","s":[79,80,81]},"sa":{"st":"av","s":[79,80,81]},"ct":{"st":"av","s":[79,80,81]}},"sr":[79,80,81]},{"id":"muguet","n":"Muguet","o":["ord-101"]},{"id":"nevralgie","n":"Névralgie","o":["ord-102"]},{"id":"oap-deme-aigue-du-poumon","n":"OAP (Œdème Aigue du Poumon)","o":["ord-103"]},{"id":"orchiepididymite","n":"Orchiépididymite","o":["ord-104"],"df":"Inflammation aiguë de l'épididyme, souvent compliquée d'une atteinte testiculaire (orchiépididymite) ; la funiculite correspond à l'atteinte de tout le cordon spermatique. Chez l'homme jeune (moins de 35 ans), Chlamydia trachomatis est l'étiologie principale, plus rarement Neisseria gonorrhoeae ou des entérobactéries (à partir d'une infection urinaire ou après pénétration anale insertive) ; ces infections compliquent une urétrite non traitée, symptomatique ou non. Après 35 ans, les épididymites à entérobactéries (E. coli…) sont plus fréquentes.","sc":"Douleur et augmentation de volume du scrotum, généralement unilatérales. Le diagnostic repose sur l'examen clinique. Bilan minimal : examen du 1er jet d'urine (leucocytes) et du jet de fin de miction, après s'être assuré qu'il ne s'agit pas d'une torsion du testicule. L'échographie Doppler sert surtout à écarter une torsion du cordon spermatique ; elle apporte peu pour confirmer l'épididymite devant un tableau clinique évocateur.","sa":"**Exclure d'urgence une torsion testiculaire** devant toute douleur scrotale aiguë, sauf si les signes sont clairement limités à l'épididyme, en particulier chez les patients de moins de 30 ans ou si la douleur est brutale et sévère : échodoppler immédiat indiqué. La torsion partielle du cordon peut ressembler à une épididymite à l'échographie : la différence se fait sur l'évaluation clinique (CDC).","ct":"Élévation du scrotum et traitement de la douleur. Antibiothérapie probabiliste. **Sujet jeune (moins de 35 ans) ou cause probable IST (chlamydia, gonocoque)** : ceftriaxone 500 mg IM en dose unique PLUS doxycycline 100 mg 2 fois par jour per os pendant 10 jours (SFD 2016, CDC). Ne pas recourir aux fluoroquinolones seules en cas de cause IST probable (résistance fréquente du gonocoque). **Cause probable entérobactéries** (homme de plus de 35 ans, infection urinaire associée, rapports anaux insertifs) : antibiotique choisi selon le terrain ; MSD cite chez le patient ambulatoire fluoroquinolone, doxycycline, triméthoprime/sulfaméthoxazole ou ceftriaxone ; si risque IST et entérobactéries à la fois, couvrir les deux (voir CDC). Une version antérieure du CDC (2010) indiquait ceftriaxone 250 mg IM ; la dose de 500 mg des recommandations plus récentes est retenue. Bloc du cordon spermatique à l'anesthésique local envisageable si douleurs invalidantes persistantes (MSD).","q":{"df":{"st":"av","s":[52,53,54]},"sc":{"st":"av","s":[52,53,54]},"sa":{"st":"av","s":[52,53,54]},"ct":{"st":"av","s":[52,53,54]}},"sr":[52,53,54]},{"id":"oreillon","n":"Oreillon","o":["ord-105"],"df":"Infection virale aiguë, contagieuse, due au virus ourlien (paramyxovirus), se manifestant principalement par une parotidite. Moins contagieuse que la rougeole ; confère habituellement une immunité permanente. L'infection peut aussi être inapparente.","sc":"Parotidite fébrile, généralement bilatérale (parfois unilatérale au début), souvent précédée d'otalgies et de dysphagie. Évoquer les oreillons devant une inflammation des glandes salivaires avec symptômes généraux caractéristiques, surtout en contexte d'épidémie ; évoquer aussi en cas de méningite ou d'encéphalite aseptique inexpliquée pendant une épidémie.","sa":"Complications : **orchite et/ou épididymite** chez le sujet pubère, 4 à 8 jours après la parotidite (15 à 30 % des formes de l'adulte, généralement unilatérale) ; ovarite ; **méningite lymphocytaire** (le plus souvent sans symptôme, symptomatique dans 1 à 10 % des cas), méningo-encéphalite ; pancréatite. Environ 50 % des infections ourliennes du système nerveux central surviennent sans parotidite. Signes méningés : ponction lombaire nécessaire.","ct":"Traitement uniquement **symptomatique** : repos, antipyrétiques et antalgiques (paracétamol), port d'un suspensoir en cas d'orchite. Pas de traitement antiviral spécifique. Traitement des complications également de soutien. Prévention : vaccin trivalent rougeole-oreillons-rubéole (ROR). Posologies non présentes dans ces sources : à compléter (RCP).","q":{"df":{"st":"av","s":[56,57,58]},"sc":{"st":"av","s":[56,57,58]},"sa":{"st":"av","s":[56,57,58]},"ct":{"st":"av","s":[56,57,58]}},"sr":[56,57,58]},{"id":"orgelet","n":"Orgelet","o":["ord-106","ord-107"],"df":"Infection à staphylocoque de la base de la paupière (glande du bord palpébral).","sc":"Petite grosseur de la paupière, rouge, douloureuse, enflée, irritée ou sensible ; le plus souvent au bord externe de la paupière, avec un centre légèrement jaune. Il se rompt généralement en 2 à 4 jours, du pus s'écoule, puis il disparaît.","ct":"Compresse humide, tiède et propre sur la paupière 5 à 10 minutes, 2 à 3 fois par jour ; ne pas tenter de percer ; nettoyer les paupières au savon doux et à l'eau ; ne pas porter de lentilles ni de maquillage des yeux jusqu'à guérison. Disparaît en général spontanément. Si l'orgelet ne disparaît pas ou est très douloureux : antibiotiques et/ou petite incision au scalpel pour drainer le pus. La source ne donne pas de doses.","q":{"df":{"st":"av","s":[115],"n":"Complété par : Claude (IA) d'après le Manuel MSD. Page « Les faits en bref » : signes d'alarme non précisés, champ laissé vide."},"sc":{"st":"av","s":[115]},"ct":{"st":"av","s":[115]},"sa":{"st":"av","s":[],"n":"Champ laissé vide par la source consultée : à compléter. Page « Les faits en bref » : signes d'alarme non précisés, champ laissé vide."}},"sr":[115]},{"id":"otites","n":"Otites","o":["ord-108"]},{"id":"otite-moyenne-aigue-omi","n":"Otite Moyenne Aigue (OMI)","o":["ord-109"],"df":"Inflammation aiguë de l'oreille moyenne, d'origine virale ou bactérienne, très fréquente chez l'enfant de moins de 3 ans et rare chez l'adulte. Principaux germes : Streptococcus pneumoniae, Haemophilus influenzae, Moraxella catarrhalis et, chez le grand enfant, Streptococcus pyogenes.","sc":"Otalgie d'installation rapide (nourrisson : pleurs, irritabilité, insomnie, refus de téter ou de s'alimenter) et écoulement (otorrhée) ou fièvre ; rhinorrhée, toux, diarrhée ou vomissements fréquents, d'où la nécessité d'examiner les tympans. Otoscopie : tympan rouge vif (ou jaunâtre s'il est prêt à rompre) et épanchement de pus, extériorisé (otorrhée sur tympan perforé) ou non (tympan bombé et opaque) ; l'association à une otalgie ou à une fièvre confirme l'OMA. Une rougeur isolée, sans bombement ni perforation, oriente vers une otite virale ; des bulles ou un épanchement derrière un tympan intact sans signe d'infection aiguë correspondent à une otite séromuqueuse.","sa":"Enfants à risque d'évolution défavorable : malnutrition, déficit immunitaire, malformation de l'oreille. Signes d'infection sévère : vomissements, fièvre > 39 °C, otalgie sévère. Complications possibles : otite moyenne chronique suppurée et, plus rarement, mastoïdite, abcès cérébral, méningite. Sous antibiotique : revenir si fièvre ou douleurs persistent après 48 heures.","ct":"Dans tous les cas : traiter fièvre et douleur par paracétamol ; lavages d'oreille contre-indiqués en cas de perforation ou si le tympan n'a pas été correctement visualisé ; pas d'indication aux gouttes auriculaires. Antibiothérapie d'emblée : enfants \u003c 2 ans, signes d'infection sévère, enfants à risque, ou si l'enfant ne peut pas être revu ; sinon, attendre 48 à 72 h et prescrire si aggravation ou absence d'amélioration. Première intention : amoxicilline per os 5 jours (enfant 30 mg/kg 3 fois/j, max 3 g/j ; adulte 1 g 3 fois/j). Échec après 48 h : amoxicilline/acide clavulanique 5 jours (formulations 8:1 ou 7:1 ; enfant \u003c 40 kg : 25 mg/kg 2 fois/j). Allergie à la pénicilline : azithromycine 10 mg/kg une fois par jour pendant 3 jours (enfant > 6 mois). Un écoulement isolé, sans fièvre ni douleur, chez un enfant qui s'améliore ne justifie pas de changer d'antibiotique : nettoyer le conduit au coton sec.","q":{"df":{"st":"av","s":[30]},"sc":{"st":"av","s":[30]},"sa":{"st":"av","s":[30]},"ct":{"st":"av","s":[30]}},"sr":[30]},{"id":"paralysie-faciale-peripherique","n":"Paralysie faciale périphérique","o":["ord-110"]},{"id":"peri-onyxis-a-candida-albicans","n":"Péri onyxis à Candida Albicans","o":["ord-111"],"df":"Paronychie à Candida : candidose des plis unguéaux ou des cuticules. Fréquente en cas de diabète, d'immunodépression, ou chez des personnes dont les mains sont fréquemment mouillées ou lavées.","sc":"Rougeur et gonflement douloureux autour de l'ongle ; en cas d'infection prolongée, zone sous l'ongle blanchie ou jaunie, ongle qui se décolle du lit (onycholyse).","ct":"Protéger la zone de l'humidité ; antimycosique par voie orale ou cutanée prescrit par le médecin ; infections souvent difficiles à traiter. La source ne donne pas de doses.","q":{"df":{"st":"av","s":[119],"n":"Complété par : Claude (IA) d'après le Manuel MSD. Signes d'alarme non précisés dans la source, champ laissé vide."},"sc":{"st":"av","s":[119]},"ct":{"st":"av","s":[119]},"sa":{"st":"av","s":[],"n":"Champ laissé vide par la source consultée : à compléter. Signes d'alarme non précisés dans la source, champ laissé vide."}},"sr":[119]},{"id":"perleche","n":"Perlèche","o":["ord-112"],"df":"Chéilite angulaire : candidose des commissures des lèvres, qui provoque des craquelures et de minuscules fissures. Favorisée par l'humidité permanente des commissures : lèvres constamment humidifiées, succion du pouce, appareils dentaires.","sc":"Craquelures et petites fissures aux commissures des lèvres.","ct":"La page MSD indique un traitement antimycosique selon la localisation (crème ou voie orale) et le maintien de la zone au sec ; elle ne détaille pas de schéma spécifique pour la perlèche. La source ne donne pas de doses.","q":{"df":{"st":"av","s":[116],"n":"Complété par : Claude (IA) d'après le Manuel MSD. Signes d'alarme non précisés dans la source ; traitement spécifique de la perlèche peu détaillé."},"sc":{"st":"av","s":[116]},"ct":{"st":"av","s":[116]},"sa":{"st":"av","s":[],"n":"Champ laissé vide par la source consultée : à compléter. Signes d'alarme non précisés dans la source ; traitement spécifique de la perlèche peu détaillé."}},"sr":[116]},{"id":"pediculose-ou-phtiriasis","n":"Pédiculose ou Phtiriasis","o":["ord-113"],"df":"Infestation par les poux pubiens (phtiriase, « morpions ») ou par les poux de corps. Poux pubiens : poils génitaux et anaux (parfois torse, cuisses, barbe, cils), transmission le plus souvent sexuelle, aussi par serviettes, draps, vêtements. Poux de corps : vivent sur les vêtements et la literie, chez les personnes en mauvaise hygiène ou en promiscuité (casernes, lits communs).","sc":"Démangeaisons intenses de la zone atteinte. Poux pubiens : taches gris bleuté sur le torse, les fesses, les cuisses, ganglions gonflés, démangeaisons/brûlure/irritation des yeux si cils atteints, petits points sombres (excréments) sur la peau ou les sous-vêtements. Poux de corps : petits trous rouges, marques de grattage, urticaire (épaules, fesses, abdomen).","sa":"Les poux de corps peuvent transmettre le typhus, la fièvre des tranchées et la fièvre récurrente. Grattage intense : infection bactérienne des lésions.","ct":"Poux pubiens : shampooings et crèmes en vente libre à base de pyréthrines + butoxyde de pipéronyle comme pour les poux de tête ; traiter les autres membres du foyer et les partenaires sexuels. Poux des cils : vaseline 8 à 10 jours, gouttes à la fluorescéine, ivermectine orale, pommade de pétrolatum ou à la physostigmine, ou retrait des poux à l'instrument. Poux de corps : en général pas de médicament ; traiter les symptômes et décontaminer vêtements et draps (lavage en machine ou à sec, séchage à au moins 65 °C) ; articles non lavables en sac plastique étanche 2 semaines. La source ne donne pas de doses en mg.","q":{"df":{"st":"av","s":[118],"n":"Complété par : Claude (IA) d'après le Manuel MSD. Équivalence retenue : phtiriase = poux pubiens, avec les poux de corps ajoutés. Poux de tête traités sur la ligne dédiée."},"sc":{"st":"av","s":[118]},"sa":{"st":"av","s":[118]},"ct":{"st":"av","s":[118]}},"sr":[118]},{"id":"pediculose-de-cuir-chevelu-poux-de-tete","n":"Pédiculose de cuir chevelu « poux de tète »","o":["ord-114"],"df":"Infestation du cuir chevelu par des poux (insectes non ailés de 3 mm au plus, qui sucent le sang). Transmission par contact direct ou par peignes, brosses, chapeaux partagés. Plus fréquente chez les filles de 5 à 11 ans ; sans lien avec une mauvaise hygiène ni le niveau socio-économique.","sc":"Démangeaisons intenses du cuir chevelu ; chez l'enfant, parfois seulement une discrète irritation. Poux surtout à l'arrière de la tête ou derrière les oreilles ; lentes (œufs gris-blanc brillants) fortement collées à la tige du cheveu, repérables au peigne fin sur cheveux mouillés.","ct":"Shampooing ou crème à base de pyréthrines + butoxyde de pipéronyle (vente libre), laissé 10 minutes puis rincé ; perméthrine sur ordonnance ; spinosad (≥ 4 ans) sur cheveux secs 10 minutes, second traitement si poux vivants à 7 jours ; malathion sur ordonnance (non prescrit en 1re intention : inflammable, odeur, 8 à 12 heures de pose) ; lindane non recommandé. Répéter le traitement entre le 7e et le 10e jour ; ivermectine orale si résistance. Retirer les lentes au peigne fin ; linge contaminé lavé en machine ou à sec, séché environ 30 minutes (jusqu'à 54 °C). Les CDC recommandent de ne pas renvoyer l'enfant immédiatement de l'école. La source ne donne pas de doses en mg.","q":{"df":{"st":"av","s":[117],"n":"Complété par : Claude (IA) d'après le Manuel MSD. Signes d'alarme non précisés pour les poux de tête dans la source : champ laissé vide."},"sc":{"st":"av","s":[117]},"ct":{"st":"av","s":[117]},"sa":{"st":"av","s":[],"n":"Champ laissé vide par la source consultée : à compléter. Signes d'alarme non précisés pour les poux de tête dans la source : champ laissé vide."}},"sr":[117]},{"id":"phlebite","n":"Phlébite","o":["ord-115"]},{"id":"piqure-d-insecte","n":"Piqure d’insecte","o":["ord-116"]},{"id":"plaie-par-arme-blanche","n":"Plaie par arme blanche","o":["ord-117"]},{"id":"plaie-infecte","n":"Plaie infecté","o":["ord-118"]},{"id":"plaie-surinfectee","n":"Plaie surinfectée","o":["ord-119"]},{"id":"prostatite","n":"Prostatite","o":["ord-120"],"df":"Infection bactérienne aiguë de la prostate. Germe le plus fréquent : Escherichia coli ; autres germes possibles : Proteus mirabilis, Klebsiella sp, Pseudomonas aeruginosa, Enterococcus sp. Évolution possible vers une prostatite chronique.","sc":"Fièvre (souvent élevée) et frissons. Signes de cystite (brûlures mictionnelles, pollakiurie). Douleurs périnéales, urétrales, péniennes ou rectales. Rétention d'urine. À l'examen : toucher rectal très douloureux ; leucocyturie, pyurie, hématurie macroscopique possible.","sa":"Masse fluctuante au toucher rectal : abcès de la prostate. Rétention d'urine. Fièvre souvent élevée avec frissons.","ct":"Ciprofloxacine PO 500 mg 2 fois par jour pendant 14 jours, puis revoir le patient : arrêter si les signes ont complètement disparu ; si des signes persistent, poursuivre le même traitement 14 jours supplémentaires (d'après NICE NG110, 2018). Traitement symptomatique : bonne hydratation (1,5 litre d'eau par jour), traiter la fièvre et la douleur. Suspicion d'abcès de la prostate : référer au chirurgien.","q":{"df":{"st":"av","s":[44]},"sc":{"st":"av","s":[44]},"sa":{"st":"av","s":[44]},"ct":{"st":"av","s":[44]}},"sr":[44]},{"id":"prurit","n":"Prurit","o":["ord-121"]},{"id":"pna","n":"PNA","o":["ord-122","ord-123"],"df":"Infection du parenchyme rénal, plus fréquente chez la femme que chez l'homme, due aux mêmes germes que la cystite. Elle est potentiellement sévère, en particulier chez la femme enceinte, le nouveau-né et le nourrisson.","sc":"Nouveau-né et nourrisson : symptômes non spécifiques (fièvre, irritabilité, vomissements, refus de s'alimenter), abdomen parfois sensible ; l'absence de fièvre n'exclut pas le diagnostic et une fièvre isolée sans cause peut être le seul signe ; tableau sévère possible chez le nouveau-né (fièvre ou hypothermie, altération de l'état général et de la conscience, teint gris, signes de choc). Grand enfant et adulte : signes de cystite (miction douloureuse, pollakiurie) ET fièvre > 38 °C et douleur lombaire unilatérale ou abdominale ; nausées et vomissements fréquents. Suspecter une infection urinaire devant toute fièvre inexpliquée ou tout syndrome infectieux sans point d'appel.","sa":"Critères d'hospitalisation : patients à risque (enfants, femmes enceintes, hommes — une infection urinaire fébrile chez l'homme évoque d'abord une prostatite —, anomalie organique ou fonctionnelle des voies urinaires, immunodépression grave) ; formes compliquées (obstruction des voies urinaires, abcès rénal, pyélonéphrite emphysémateuse chez le diabétique) ; signes de gravité (sepsis, choc septique, déshydratation ou vomissements empêchant l'hydratation et la prise orale) ; absence d'amélioration 24 heures après le début d'un traitement oral en ambulatoire.","ct":"Hydrater (1,5 L d'eau par jour chez l'adulte, surveillance particulière chez l'enfant), pas d'AINS pour la fièvre et la douleur, prise en charge d'un choc septique dans les formes sévères. Enfant \u003c 1 mois : ampicilline IV 7 à 10 jours (0 à 7 jours \u003c 2 kg : 50 mg/kg toutes les 12 h ; 0 à 7 jours ≥ 2 kg et 8 jours à \u003c 1 mois : 50 mg/kg toutes les 8 h) + gentamicine IV 5 jours (0 à 7 jours \u003c 2 kg : 3 mg/kg/j ; sinon 5 mg/kg/j), ou céfotaxime IV 7 à 10 jours (50 mg/kg, mêmes intervalles). Enfant ≥ 1 mois : ceftriaxone IM/IV 50 mg/kg une fois par jour jusqu'à amélioration (3 jours minimum), puis amoxicilline/acide clavulanique PO pour compléter 10 jours (\u003c 40 kg : 25 mg/kg 2 fois par jour). Adulte, forme non compliquée : ceftriaxone IM 1 g en dose unique ou gentamicine IM 5 mg/kg en dose unique, puis ciprofloxacine PO 500 mg 2 fois par jour pendant 7 jours, ou amoxicilline/acide clavulanique PO 10 à 14 jours (2000 mg/j avec le rapport 8:1, 1750 mg/j avec le rapport 7:1), ou céfixime PO 200 mg 2 fois par jour ou 400 mg une fois par jour pendant 10 à 14 jours. Avec critère d'hospitalisation : ampicilline IV 2 g toutes les 6 h + gentamicine IM 5 mg/kg/j pendant 3 jours minimum, ou ceftriaxone IV 1 g/j (+ gentamicine en cas de sepsis), puis relais oral pour 10 à 14 jours ; l'association ampicilline + gentamicine couvre mieux les entérocoques ; formes abcédées ou emphysémateuses : antibiothérapie plus longue.","q":{"df":{"st":"av","s":[37]},"sc":{"st":"av","s":[37]},"sa":{"st":"av","s":[37]},"ct":{"st":"av","s":[37]}},"sr":[37]},{"id":"rgo","n":"RGO","o":["ord-124","ord-125"],"df":"Remontée du contenu gastrique dans l'œsophage, favorisée par l'insuffisance du sphincter inférieur de l'œsophage (perte de tonus ou relaxations transitoires inappropriées). Fréquent (environ 13 % de la population mondiale). Facteurs favorisants : obésité, tabac, repas gras, boissons gazeuses ou caféinées, alcool, certains médicaments (anticholinergiques, antihistaminiques, antidépresseurs tricycliques, inhibiteurs calciques, dérivés nitrés, progestérone).","sc":"Symptôme principal chez l'adulte : pyrosis (brûlures d'estomac), avec ou sans régurgitation de contenu gastrique dans la bouche. Une aspiration chronique peut donner toux, enrouement ou respiration sifflante. Le diagnostic est clinique ; un essai thérapeutique par inhibiteur de la pompe à protons est possible devant des symptômes typiques, sans examen complémentaire si le patient répond.","sa":"Complications : œsophagite, ulcère œsophagien, sténose (dysphagie aux solides d'aggravation progressive), œsophage de Barrett, adénocarcinome. Odynophagie ou saignement œsophagien (souvent occulte, parfois massif ; anémie ferriprive à long terme). Endoscopie nécessaire en l'absence de réponse au traitement empirique, si symptômes de longue durée ou de complications, ou si symptômes pouvant évoquer un autre diagnostic (ulcère gastroduodénal, cancer digestif, cardiopathie ischémique).","ct":"**Mesures hygiéno-diététiques** : éviter de manger dans les 4 heures avant le coucher ; surélever la tête du lit d'environ 15 cm ; perte de poids si surpoids ; arrêt du tabac ; éviter repas gras ou copieux, caféine, alcool, boissons gazeuses, aliments déclencheurs (chocolat, agrumes) et médicaments favorisants. **Traitement médical** : inhibiteur de la pompe à protons de préférence, 30 min avant un repas — adulte : oméprazole 20 mg, lansoprazole 30 mg, pantoprazole 40 mg ou ésoméprazole 40 mg ; 2 fois par jour avant les repas si réponse partielle ; au long cours à la dose minimale efficace (prise au besoin ou intermittente possible). Anti-H2 : option dans le reflux peu symptomatique, surtout symptômes nocturnes. Métoclopramide 10 mg PO 30 min avant les repas et au coucher : moins efficace, en association possible. **Chirurgie antireflux** : œsophagite de grades C et D, grosse hernie hiatale, hémorragie, sténose, ulcères, intolérance au traitement médical. Posologies pédiatriques non présentes dans cette source.","q":{"df":{"st":"av","s":[61]},"sc":{"st":"av","s":[61]},"sa":{"st":"av","s":[61]},"ct":{"st":"av","s":[61]}},"sr":[61]},{"id":"rhinite-aigue","n":"Rhinite aigue","o":["ord-126"],"df":"Inflammation de la muqueuse nasale (rhinite) ou de la muqueuse nasale et du pharynx (rhinopharyngite), habituellement bénigne, d'origine virale, évoluant vers la guérison spontanée.","sc":"Écoulement ou obstruction nasale, avec ou sans mal de gorge, fièvre, toux, larmoiement ; diarrhée chez le nourrisson. Un écoulement nasal purulent n'indique pas une surinfection bactérienne. Chez l'enfant de moins de 5 ans, vérifier systématiquement les tympans à la recherche d'une otite moyenne associée.","sa":"Peut être le premier signe d'une autre infection (rougeole, grippe) ou se compliquer d'une infection bactérienne (otite moyenne, sinusite).","ct":"Pas d'antibiotique : l'antibiothérapie n'accélère pas la guérison et ne prévient pas les complications. Traitement symptomatique : désobstruction du nez par lavage au chlorure de sodium 0,9 % (chez l'enfant : décubitus dorsal, tête sur le côté, instillation dans chaque narine) ; fièvre et mal de gorge : paracétamol per os pendant 2 à 3 jours.","q":{"df":{"st":"av","s":[29]},"sc":{"st":"av","s":[29]},"sa":{"st":"av","s":[29]},"ct":{"st":"av","s":[29]}},"sr":[29]},{"id":"rhinite-allergique-saisonniere","n":"Rhinite allergique saisonnière","o":["ord-127"]},{"id":"rhume","n":"Rhume","o":["ord-128"],"df":"Inflammation de la muqueuse nasale (rhinite) ou de la muqueuse nasale et du pharynx (rhinopharyngite), habituellement bénigne, d'origine virale, évoluant vers la guérison spontanée.","sc":"Écoulement ou obstruction nasale, avec ou sans mal de gorge, fièvre, toux, larmoiement ; diarrhée chez le nourrisson. Un écoulement nasal purulent n'indique pas une surinfection bactérienne. Chez l'enfant de moins de 5 ans, vérifier systématiquement les tympans à la recherche d'une otite moyenne associée.","sa":"Peut être le premier signe d'une autre infection (rougeole, grippe) ou se compliquer d'une infection bactérienne (otite moyenne, sinusite).","ct":"Pas d'antibiotique : l'antibiothérapie n'accélère pas la guérison et ne prévient pas les complications. Traitement symptomatique : désobstruction du nez par lavage au chlorure de sodium 0,9 % (chez l'enfant : décubitus dorsal, tête sur le côté, instillation dans chaque narine) ; fièvre et mal de gorge : paracétamol per os pendant 2 à 3 jours.","q":{"df":{"st":"av","s":[29]},"sc":{"st":"av","s":[29]},"sa":{"st":"av","s":[29]},"ct":{"st":"av","s":[29]}},"sr":[29]},{"id":"rougeole","n":"Rougeole","o":["ord-129"],"df":"Maladie virale grave et extrêmement contagieuse, due à un virus de la famille des paramyxoviridés, strictement humaine (aucun réservoir animal connu). Elle reste une cause importante de décès du jeune enfant malgré l'existence d'un vaccin sûr et efficace.","sc":"Forte fièvre apparaissant environ 10 à 12 jours après l'exposition et persistant 4 à 7 jours ; au stade initial : rhinorrhée, toux, yeux rouges et larmoyants, petits points blanchâtres sur la face interne des joues (signe de Koplik). Éruption plusieurs jours plus tard, d'abord au visage et au haut du cou, atteignant les mains et les pieds en 3 jours environ, durant 5 à 6 jours (en moyenne 14 jours après l'exposition, de 7 à 18 jours). Phase prodromique de 3 à 7 jours avant l'éruption ; guérison environ 7 jours après le début de l'éruption dans les cas non compliqués (MSD). Contagiosité de 4 jours avant à 4 jours après l'éruption.","sa":"Complications graves : cécité, encéphalite (réapparition ou persistance de la fièvre, syndrome méningé, troubles de la conscience, convulsions), diarrhées sévères avec déshydratation, infections auriculaires, infections respiratoires graves dont pneumonie. Risque accru : enfant \u003c 5 ans, adulte > 20 ans, malnutrition, carence en vitamine A, VIH ou autre immunodépression, femme enceinte (fausse couche, accouchement prématuré). Jusqu'à 10 % de décès dans les populations très touchées par la malnutrition sans soins adéquats.","ct":"Pas de traitement antiviral spécifique. Prise en charge : alimentation correcte, apport hydrique suffisant, traitement de la déshydratation par solution de réhydratation orale de l'OMS ; antibiotiques pour les infections oculaires et auriculaires et la pneumonie. Dans les pays en développement : deux doses de vitamine A à 24 heures d'intervalle pour tout enfant dont la rougeole est diagnostiquée (prévention des lésions oculaires et de la cécité ; réduction de 50 % de la mortalité selon l'OMS) ; doses selon le protocole national (à valider). Prévention : vaccination à deux doses.","q":{"df":{"st":"av","s":[25,26]},"sc":{"st":"av","s":[25,26]},"sa":{"st":"av","s":[25,26,27],"n":"Complications neurologiques d'après le guide MSF (aspects cliniques de la rougeole)."},"ct":{"st":"av","s":[25,26]}},"sr":[25,26,27]},{"id":"scarlatine","n":"Scarlatine","o":["ord-130"],"df":"Infection due au streptocoque bêta-hémolytique du groupe A (Streptococcus pyogenes), souche productrice d'une toxine érythrogène responsable de l'éruption ; elle complique classiquement une pharyngite à streptocoque A. Touche surtout les jeunes enfants, le plus souvent en collectivité.","sc":"Incubation de 2 à 5 jours. Début brutal : fièvre élevée, vomissements, douleurs abdominales, céphalées. Environ 2 jours après : énanthème avec pharyngite érythémato-pultacée et langue rouge dépapillée en « framboise » (langue d'abord saburrale) ; exanthème maculo-papuleux diffus sans intervalle de peau saine, débutant au tronc et à la racine des membres puis gagnant tout le tégument ; paumes et plantes épargnées ; aspect purpurique linéaire possible dans les plis. L'éruption disparaît en une semaine, suivie d'une desquamation en « doigts de gant » aux extrémités. Diagnostic essentiellement clinique ; chez le patient de plus de 14 ans, la probabilité d'infection streptococcique est faible (MSF).","sa":"Complications générales de l'infection à streptocoque A : rhumatisme articulaire aigu (RAA) et glomérulonéphrite aiguë. Complications locales : abcès péri-amygdalien, rétro-pharyngé ou latéral (fièvre, douleurs intenses, dysphagie, voix étouffée, trismus). Facteurs de risque post-streptococciques (immunodépression, antécédent personnel ou familial de RAA) : antibiothérapie d'emblée. Signes de gravité chez l'enfant : déshydratation sévère, gêne importante à la déglutition, atteinte respiratoire haute, altération de l'état général.","ct":"Antibiothérapie anti-streptococcique (MSF). Amoxicilline per os pendant 6 jours : enfant 25 mg/kg 2 fois par jour (soit 50 mg/kg/j, sans dépasser 3 g/j) ; adulte 1 g 2 fois par jour ; à éviter si une mononucléose infectieuse n'est pas écartée. Ou pénicilline V per os pendant 10 jours : moins de 1 an 125 mg 2 fois par jour ; 1 à moins de 6 ans 250 mg 2 fois par jour ; 6 à moins de 12 ans 500 mg 2 fois par jour ; 12 ans et plus et adulte 1 g 2 fois par jour. Ou benzathine benzylpénicilline IM dose unique si matériel à usage unique disponible : enfant de moins de 30 kg ou de moins de 10 ans 600 000 UI ; 30 kg et plus ou 10 ans et plus et adulte 1,2 MUI. **Allergie aux pénicillines** : macrolide (azithromycine 3 jours : enfant 20 mg/kg/j, maximum 500 mg ; adulte 500 mg/j). Éviction scolaire jusqu'à 24 heures après le début de l'antibiotique (fiche Sciensano, Belgique ; à confronter à la réglementation locale). Complications locales (abcès) : référer pour drainage ; signes de gravité chez l'enfant : hospitaliser.","q":{"df":{"st":"av","s":[22,59,60]},"sc":{"st":"av","s":[22,59,60]},"sa":{"st":"av","s":[22,59,60]},"ct":{"st":"av","s":[22,59,60]}},"sr":[22,59,60]},{"id":"sciatique","n":"Sciatique","o":["ord-131"]},{"id":"sinusite-maxillaire-aigue","n":"Sinusite maxillaire aigue","o":["ord-132"],"df":"Inflammation d'une ou plusieurs cavités sinusiennes d'origine infectieuse ou allergique. La plupart des sinusites infectieuses sont virales et guérissent spontanément en moins de 10 jours ; la sinusite bactérienne aiguë peut être une surinfection d'une sinusite virale, une forme primitive ou d'origine dentaire (germes fréquents : Streptococcus pneumoniae, Haemophilus influenzae, Moraxella catarrhalis). Seule la sinusite bactérienne justifie une antibiothérapie.","sc":"Adulte : écoulement purulent unilatéral ou bilatéral, obstruction nasale, et douleur de la face unilatérale ou bilatérale majorée lorsque le patient penche la tête en avant (pression douloureuse du front ou de la région maxillaire) ; fièvre modérée ou absente. Persistance des symptômes après 10 à 14 jours, aggravation après 5 à 7 jours ou sévérité (douleur importante, fièvre élevée, altération de l'état général) en faveur d'une sinusite bactérienne. Enfant : mêmes symptômes, avec parfois irritabilité, léthargie, toux ou vomissements.","sa":"Infection sévère de l'enfant : altération de l'état général, fièvre > 39 °C, œdème périorbital ou de la face. En l'absence de traitement, les formes sévères de l'enfant peuvent se compliquer par diffusion à l'os, à l'orbite ou aux méninges. Complications ophtalmologiques (ophtalmoplégie, mydriase, baisse de l'acuité visuelle, anesthésie cornéenne) : référer au chirurgien pour drainage. Ethmoïdite du nourrisson : voir cellulite périorbitaire.","ct":"Traitement symptomatique : fièvre et douleur, lavage du nez au chlorure de sodium 0,9 %. Adulte : antibiothérapie si critères de durée ou de sévérité ; si le diagnostic est incertain (symptômes modérés et \u003c 10 jours) et le patient réexaminable, commencer par un traitement symptomatique. Enfant : antibiothérapie si symptômes sévères ou modérés avec facteurs de risque (immunodépression, drépanocytose, asthme). Première ligne : amoxicilline per os 7 à 10 jours (enfant 30 mg/kg 3 fois/j, max 3 g/j ; adulte 1 g 3 fois/j). Échec après 48 h : amoxicilline/acide clavulanique 7 à 10 jours (formulations 8:1 ou 7:1 ; enfant \u003c 40 kg : 25 mg/kg 2 fois/j ; enfant ≥ 40 kg et adulte : 2000 mg/j d'amoxicilline avec le rapport 8:1 ou 1750 mg/j avec le rapport 7:1). Allergie à la pénicilline : érythromycine 7 à 10 jours (enfant 30 à 50 mg/kg/j ; adulte 1 g 2 à 3 fois/j). Extraction dentaire sous antibiothérapie si cause dentaire.","q":{"df":{"st":"av","s":[28]},"sc":{"st":"av","s":[28]},"sa":{"st":"av","s":[28]},"ct":{"st":"av","s":[28]}},"sr":[28]},{"id":"suite-de-couche","n":"Suite de couche","o":["ord-133"]},{"id":"surinfection-bacterienne-d-une-bronchite-aigue-virale","n":"Surinfection bactérienne d’une bronchite aigue virale","o":["ord-134"],"df":"Bronchite aiguë (inflammation aiguë de la muqueuse bronchique, le plus souvent virale) compliquée d'une surinfection bactérienne probable à Haemophilus influenzae ou à pneumocoque.","sc":"Apparition d'une dyspnée avec fièvre supérieure à 38,5 °C et expectoration purulente chez un patient ayant une bronchite aiguë (toux, râles bronchiques).","sa":"Dyspnée avec fièvre élevée et expectoration purulente. Mauvais terrain : malnutrition, rougeole, rachitisme, anémie sévère, cardiopathie, patient âgé.","ct":"Antibiothérapie indiquée : amoxicilline per os pendant 5 jours (enfant 30 mg/kg 3 fois par jour, max 3 g/j ; adulte 1 g 3 fois par jour). Traitement symptomatique : fièvre (paracétamol), bonne hydratation, humidification de l'atmosphère, lavage du nez au chlorure de sodium 0,9 % chez l'enfant.","q":{"df":{"st":"av","s":[32]},"sc":{"st":"av","s":[32]},"sa":{"st":"av","s":[32]},"ct":{"st":"av","s":[32]}},"sr":[32]},{"id":"teigne-du-cuir-chevelu","n":"Teigne du cuir chevelu","o":["ord-135"],"df":"Infection à dermatophytes (champignon) du cuir chevelu ; aux États-Unis surtout due à Trichophyton tonsurans. Extrêmement contagieuse, fréquente chez l'enfant ; transmission par contact direct avec des personnes ou animaux infectés ou des objets contaminés, surtout si conditions de vie précaires et hygiène insuffisante.","sc":"Éruption sèche et squameuse, parfois avec démangeaisons, et chute de cheveux localisée. Teigne « à points noirs » : cheveux cassés à la surface du cuir chevelu ; teigne « à tache grise » : cheveux cassés au-dessus de la surface (cheveux courts) ; desquamation pouvant ressembler à des pellicules ; ganglions du cou et derrière l'oreille parfois augmentés de volume.","sa":"Kérion : plaque étendue, douloureuse, inflammatoire et gonflée du cuir chevelu, avec pus parfois, cloques et croûtes (ressemble à un abcès) ; réaction immunitaire au champignon pouvant laisser une chute de cheveux avec cicatrices.","ct":"Enfant : terbinafine orale (la griséofulvine est une autre option), crème antimycosique sur le cuir chevelu pour limiter la contagion, shampooing au sulfure de sélénium sur ordonnance au moins 2 fois par semaine ; l'enfant peut aller à l'école pendant le traitement. Adulte : terbinafine ou itraconazole oraux (durée selon le médicament), parfois shampooing au sulfure de sélénium. Zones très inflammatoires ou kérion : cure courte de corticoïde oral (prednisone) pour réduire les symptômes et le risque de cicatrices. La source ne donne pas de doses.","q":{"df":{"st":"av","s":[120],"n":"Complété par : Claude (IA) d'après le Manuel MSD."},"sc":{"st":"av","s":[120]},"sa":{"st":"av","s":[120]},"ct":{"st":"av","s":[120]}},"sr":[120]},{"id":"torticolis-spasmodiques","n":"Torticolis spasmodiques","o":["ord-136"]},{"id":"toux","n":"Toux","o":["ord-137"]},{"id":"trachome","n":"Trachome","o":["ord-138"],"df":"Infection chronique de la conjonctive due à Chlamydia trachomatis (souches non sexuellement transmissibles) ; première cause évitable de cécité dans le monde. Fréquent dans les régions à ressources limitées et les pays chauds et secs (Afrique du Nord, Moyen-Orient, sous-continent indien, Asie du Sud-Est). Touche surtout les enfants de moins de 10 ans. Très contagieux au stade précoce : sécrétions des yeux, du nez ou de la gorge, contact œil-main, objets partagés (serviettes, vêtements, maquillage), mouches.","sc":"Atteinte en général des deux yeux : conjonctives enflammées, rouges, irritées, larmoiement excessif, paupières gonflées, sensibilité à la lumière. Stades tardifs : vaisseaux sanguins dans la cornée (vision perturbée), cicatrices de la conjonctive, cils qui se retournent vers l'intérieur (trichiasis).","sa":"Trichiasis : les cils frottent la cornée, causant infection et lésion permanente ; altération de la vision chez environ 13 % des personnes avec trichiasis, cécité chez environ 8 %. Cicatrisation de la cornée pouvant aboutir à la cécité.","ct":"Antibiotique oral (azithromycine, doxycycline ou érythromycine) ou pommade de tétracycline ; antibiotiques souvent donnés à toute la communauté en contact avec les malades ; chirurgie en cas de trichiasis (paupière, conjonctive, cornée). Prévention : eau propre pour boire et se laver, lavage régulier du visage et des mains, ne pas partager serviettes, linge et maquillage, contrôler les lieux de reproduction des mouches. La source ne donne pas de doses.","q":{"df":{"st":"av","s":[121],"n":"Complété par : Claude (IA) d'après le Manuel MSD."},"sc":{"st":"av","s":[121]},"sa":{"st":"av","s":[121]},"ct":{"st":"av","s":[121]}},"sr":[121]},{"id":"traumatisme-thoracique","n":"Traumatisme thoracique","o":["ord-139"]},{"id":"ulcere","n":"Ulcère","o":["ord-140"],"df":"Lésion de la muqueuse de l'estomac ou du duodénum (ulcère gastro-duodénal). La plupart des ulcères peptiques sont liés à une infection par Helicobacter pylori ; l'aspirine et les AINS sont l'autre cause à identifier.","sc":"Douleur épigastrique à type de brûlure ou de crampes entre les repas, réveillant la nuit ; épisodes récidivants de quelques jours, souvent avec nausées, voire vomissements.","sa":"Complications les plus fréquentes : perforation et hémorragie digestive. Rechercher H. pylori en cas de crises fréquentes nécessitant des traitements antisécrétoires répétés ou prolongés (plus de 8 semaines) ou d'ulcère compliqué.","ct":"Épisode isolé non compliqué : identifier et arrêter l'aspirine et les AINS (contre-indiqués en cas d'ulcère ou d'antécédent) ; éviter alcool et tabac ; oméprazole PO 20 mg une fois par jour le matin pendant 7 à 10 jours. Récidives fréquentes non liées aux AINS : éradication d'H. pylori (oméprazole PO 20 mg 2 fois par jour + clarithromycine PO 500 mg 2 fois par jour + amoxicilline PO 1 g 2 fois par jour ; si allergie à la pénicilline, amoxicilline remplacée par métronidazole PO 500 mg 2 fois par jour ; durée à vérifier dans le guide MSF). Ulcère compliqué : voir la fiche Ulcère gastroduodénal (UGD).","q":{"df":{"st":"av","s":[62]},"sc":{"st":"av","s":[62]},"sa":{"st":"av","s":[62]},"ct":{"st":"av","s":[62]}},"sr":[62]},{"id":"ulcere-gastroduodenal-ugd","n":"Ulcère Gastroduodénal (UGD)","o":["ord-141","ord-142"],"df":"Lésion de la muqueuse de l'estomac ou du duodénum. La plupart des ulcères peptiques sont liés à une infection par Helicobacter pylori ; l'aspirine et les AINS sont l'autre cause à identifier.","sc":"Douleur épigastrique à type de brûlure ou de crampes entre les repas, réveillant la nuit. Épisodes récidivants durant typiquement quelques jours, souvent accompagnés de nausées, voire de vomissements.","sa":"Complications les plus fréquentes : perforation et hémorragie digestive. Penser à rechercher H. pylori en cas de crises fréquentes nécessitant des traitements antisécrétoires répétés ou prolongés (plus de 8 semaines) ou d'ulcère compliqué.","ct":"**Ulcère non compliqué (épisode isolé)** : identifier et arrêter l'aspirine et les AINS (ibuprofène, diclofénac, etc., contre-indiqués en cas d'ulcère ou d'antécédent) ; éviter alcool et tabac ; oméprazole PO 20 mg une fois par jour le matin pendant 7 à 10 jours. Récidives fréquentes non liées aux AINS : éradication d'Helicobacter pylori. **Éradication d'H. pylori (MSF)** : oméprazole PO 20 mg 2 fois par jour + clarithromycine PO 500 mg 2 fois par jour + amoxicilline PO 1 g 2 fois par jour ; si allergie à la pénicilline, amoxicilline remplacée par métronidazole PO 500 mg 2 fois par jour. La durée du traitement d'éradication n'apparaît pas dans l'extrait consulté : à vérifier dans le guide. Résistances d'H. pylori variables : suivre les recommandations nationales. **Ulcère compliqué (perforation, hémorragie)** : prise en charge hospitalière ; traitement chirurgical en urgence en cas de perforation ; aspiration par sonde gastrique et apports liquidiens (glucose 5 % et Ringer lactate en alternance) pendant 3 jours, puis reprise prudente de l'alimentation orale, retrait de la sonde et traitement d'éradication d'H. pylori. L'oméprazole est aussi efficace par voie orale qu'en IV.","q":{"df":{"st":"av","s":[62]},"sc":{"st":"av","s":[62]},"sa":{"st":"av","s":[62]},"ct":{"st":"av","s":[62]}},"sr":[62]},{"id":"uretrite","n":"Urétrite","o":["ord-143"],"df":"Inflammation de l'urètre avec écoulement urétral, observée presque exclusivement chez l'homme (chez la femme : même prise en charge qu'une cervicite). Germes principaux : Neisseria gonorrhoeae (gonococcie) et Chlamydia trachomatis (chlamydiose).","sc":"Écoulement urétral constaté lors de l'examen clinique ; masser doucement l'urètre si l'écoulement n'est pas visible. Le rechercher chez tout patient se plaignant de douleurs ou d'irritation à la miction (dysurie). Laboratoire : gonocoque recherchable sur prélèvement urétral après coloration au bleu de méthylène ou de Gram (diplocoques intracellulaires Gram négatif) ; C. trachomatis n'est pas aisément identifiable en laboratoire de terrain, d'où un traitement probabiliste. Dans les zones d'endémie de filariose lymphatique, ne pas confondre un écoulement urétral purulent avec des urines laiteuses ou « eau de riz » (chylurie).","ct":"**Homme** : si prélèvement urétral — sans gonocoque, traiter une chlamydiose ; avec gonocoques, traiter une chlamydiose ET une gonococcie. Sans laboratoire, traiter les deux. Chlamydiose : azithromycine PO 1 g dose unique, ou doxycycline PO 100 mg 2 fois par jour pendant 7 jours. PLUS gonococcie : ceftriaxone IM 500 mg dose unique, ou, si indisponible, céfixime PO 400 mg dose unique. **Écoulement persistant ou récidivant après 7 jours** : vérifier que le traitement reçu était bien l'une des associations ci-dessus ; si autre traitement (co-trimoxazole, kanamycine), suspecter une résistance du gonocoque et retraiter ; si traitement efficace et bien suivi, penser à une trichomonase (tinidazole ou métronidazole PO 2 g dose unique) et à une réinfection. **Partenaire sexuel** : même traitement que le patient, symptomatique ou non. **Femme** : même traitement que pour une cervicite.","q":{"df":{"st":"av","s":[43]},"sc":{"st":"av","s":[43]},"ct":{"st":"av","s":[43]}},"sr":[43]},{"id":"urticaire","n":"Urticaire","o":["ord-144"]},{"id":"varicocele","n":"Varicocèle","o":["ord-145"]},{"id":"varicelle","n":"Varicelle","o":["ord-146"],"df":"Infection systémique aiguë, très contagieuse, survenant habituellement dans l'enfance, due au virus varicelle-zona (herpèsvirus humain de type 3). Le virus reste latent et peut se réactiver plus tard sous forme de zona. Contagieuse de 48 heures avant l'éruption jusqu'à la formation de croûtes sur toutes les lésions.","sc":"Incubation moyenne de 14 à 16 jours (extrêmes 10 à 21). Prodrome possible (céphalées légères, fièvre modérée, malaise), plus fréquent et plus sévère chez l'adulte. Éruption par poussées : macules, papules, vésicules en « goutte » très prurigineuses sur base rouge, puis pustules et croûtes, à différents stades au même moment ; touche presque toujours le haut du tronc ; lésions possibles du cuir chevelu (ganglions sous-occipitaux et cervicaux postérieurs) et des muqueuses (bouche : douleur à la déglutition). Nouvelles lésions jusqu'au 5e jour, majorité croûteuse au 6e jour. Diagnostic clinique ; chez le sujet vacciné, forme généralement plus bénigne mais lésions aussi contagieuses.","sa":"Sujets à risque de forme sévère : adulte, nouveau-né, immunodéprimé, femme enceinte. Complications : surinfection bactérienne des vésicules (cellulite, rarement fasciite nécrosante ou choc toxique streptococcique), pneumonie (adulte, nouveau-né, immunodéprimé), myocardite, hépatite, complications hémorragiques, ataxie cérébelleuse aiguë (enfant), myélite transverse, encéphalite (potentiellement mortelle chez l'adulte), syndrome de Reye chez l'enfant (survenant principalement après usage d'aspirine). Infection pendant la grossesse : possible pneumonie ; transmission rare au fœtus, risque maximal au 1er trimestre et début du 2e.","ct":"**Forme bénigne de l'enfant** : traitement symptomatique. Prurit : compresses humides ; si prurit sévère, antihistaminiques par voie générale et bains d'avoine colloïdale. Hygiène : lavage régulier, mains et sous-vêtements propres, ongles courts. Pas d'antiseptique sauf lésions infectées ; surinfection bactérienne : antibiotiques. Éviction de l'école ou du travail jusqu'à croûtes de toutes les lésions. **Antiviraux oraux** (valaciclovir, famciclovir ou aciclovir), efficaces surtout dans les 24 h après le début de l'éruption : pas systématiques chez l'enfant immunocompétent de 12 ans ou moins ; à donner si risque de forme modérée à sévère : 12 ans ou plus non vacciné (18 ans ou plus pour le famciclovir), troubles cutanés (eczéma), pneumopathie chronique, salicylés au long cours, corticoïdes ou immunosuppresseur en cours, cas secondaire familial. Famciclovir ou valaciclovir préférés chez l'adulte immunocompétent (aciclovir : biodisponibilité orale moindre). **Immunodéprimé ou risque de forme sévère** : aciclovir IV. **Femme enceinte** : avis spécialisé ; certains experts proposent aciclovir (ou valaciclovir) oral ; aciclovir IV si forme grave. Prophylaxie post-exposition (immunoglobulines spécifiques, vaccin) pour sujets à risque. Les posologies ne figurent pas dans la source : à compléter avec le RCP.","q":{"df":{"st":"av","s":[46]},"sc":{"st":"av","s":[46]},"sa":{"st":"av","s":[46]},"ct":{"st":"av","s":[46]}},"sr":[46]},{"id":"verrues","n":"Verrues","o":["ord-147"]},{"id":"vers-dans-les-selles","n":"Vers dans les selles","o":["ord-148"],"df":"Infections intestinales par des vers ronds (nématodes) : ascaridiase (Ascaris lumbricoides), trichocéphalose (Trichuris trichiura), ankylostomiase (Ancylostoma duodenale, Necator americanus), anguillulose (Strongyloides stercoralis) et oxyurose (Enterobius vermicularis). Les co-infections à ascaris, trichocéphales et ankylostomes sont fréquentes. Transmission par ingestion d'œufs (ascaris, trichocéphale, oxyure) ou par pénétration transcutanée de larves au contact d'un sol contaminé (ankylostome, anguillule).","sc":"Ascaridiase : pendant la migration larvaire, syndrome de Loeffler (toux sèche, dyspnée, respiration sifflante, fièvre modérée) ; vers adultes dans l'intestin : douleur et distension abdominales ; le diagnostic est souvent posé quand des vers cylindriques de 15 à 30 cm, blanc-rosâtre, sont expulsés par l'anus (ou la bouche) ; œufs à l'examen parasitologique des selles. Trichocéphalose : douleurs abdominales et diarrhée en cas de forte infestation ; infestation massive : diarrhée sanglante chronique, ténesme, prolapsus rectal (surtout chez l'enfant) ; vers de 3 à 5 cm en forme de fouet. Ankylostomiase : éruption papulo-vésiculaire prurigineuse au site de pénétration (pied) et symptômes pulmonaires ; vers adultes : douleurs abdominales légères, saignement chronique et anémie. Anguillulose : signes cutanés et pulmonaires pendant la migration ; ballonnement, douleurs abdominales et épigastriques, vomissements, diarrhée ; forme chronique par auto-infection avec « larva currens » (ligne sinueuse, surélevée, très prurigineuse, migrant de 5 à 10 cm/heure, région anale et tronc). Oxyurose : prurit anal plus intense la nuit, vulvovaginite chez la fille (rare) ; vers blancs de 1 cm visibles sur la marge anale ; œufs au scotch test.","sa":"Ascaridiase : infestation massive pouvant entraîner une obstruction intestinale (douleur abdominale, vomissements, arrêt du transit), en particulier chez l'enfant de moins de 5 ans ; migration des vers vers la vésicule biliaire, le foie ou le péritoine : ictère, abcès hépatique, péritonite. Trichocéphalose massive : prolapsus rectal chez l'enfant. Ankylostomiase : anémie chronique (en zone endémique, antihelminthique chez les patients ayant une anémie ferriprive). Anguillulose : hyperinfection (exacerbation des signes pulmonaires et digestifs, dissémination au système nerveux central, au cœur) chez les patients sous corticoïdes ou autre traitement suppresseur, réfractaire au traitement conventionnel.","ct":"Ascaridiase : albendazole PO dose unique (enfant > 6 mois et adulte : 400 mg ; enfant > 6 mois mais \u003c 10 kg : 200 mg) ou mébendazole PO 3 jours (100 mg 2 fois par jour ; 50 mg 2 fois par jour si \u003c 10 kg). Oxyurose : albendazole dose unique comme pour l'ascaridiase ou mébendazole dose unique (100 mg ; 50 mg si \u003c 10 kg) ; une seconde dose peut être donnée 2 à 4 semaines plus tard. Trichocéphalose : albendazole 400 mg une fois par jour pendant 3 jours (200 mg si > 6 mois et \u003c 10 kg) ou mébendazole 3 jours ; une dose unique est très souvent insuffisante. Ankylostomiase : albendazole dose unique (beaucoup plus efficace que le mébendazole en dose unique) ; si mébendazole, traitement de 3 jours ; traiter l'anémie. Anguillulose : ivermectine PO dose unique 200 microgrammes/kg, à jeun (enfant > 15 kg et adulte) ; albendazole pendant 3 jours en alternative moins efficace ; hyperinfection : traitements prolongés ou intermittents à doses multiples. Tenir compte des co-infections lors de la prescription. Larva migrans cutanée : albendazole 400 mg en dose unique ou une fois par jour pendant 3 jours (200 mg si \u003c 10 kg), ou ivermectine 200 microgrammes/kg en dose unique.","q":{"df":{"st":"av","s":[41]},"sc":{"st":"av","s":[41]},"sa":{"st":"av","s":[41]},"ct":{"st":"av","s":[41]}},"sr":[41]},{"id":"vertige","n":"Vertige","o":["ord-149"]},{"id":"vomissement","n":"Vomissement","o":["ord-150"],"df":"Symptôme et non maladie : le traitement dépend de la cause (gastro-entérite, mal des transports, etc.). Les vomissements aigus bénins de l'adulte ne nécessitent pas de traitement ; chez l'enfant, les cas les plus bénins s'arrêtent sans médicament.","sa":"Aucun traitement symptomatique « d'épreuve » ne doit faire négliger la recherche de la cause, qui guide la conduite thérapeutique (Item 274). Rechercher une déshydratation (antécédent de vomissements ou diarrhée avec baisse du volume des urines ; tachycardie, hypotension, temps de recoloration allongé si sévère) : réhydratation orale ou IV selon le plan OMS (MSF). Liste détaillée des signes de gravité et des causes par âge : à compléter.","ct":"**Priorité : traiter la cause et réhydrater.** **Adulte** : traitement antiémétique réservé aux vomissements aigus pouvant entraîner des complications graves ou très gênants, le plus court possible (en général moins de 1 semaine, 5 jours pour le métoclopramide) ; antagonistes de la dopamine (métoclopramide) : risque d'effets cardiaques et neurologiques graves ; ondansétron (MSF) : seulement si le métoclopramide est contre-indiqué, 4 à 8 mg 2 à 3 fois par jour, durée aussi brève que possible, QT à surveiller. **Enfant** : seul l'ondansétron a démontré une efficacité (Item 274), mais l'AMM française est limitée aux vomissements post-chimiothérapie et post-opératoires ; MSF : enfant de 6 mois à 12 ans 0,1 à 0,15 mg/kg (dose maximale à vérifier dans la fiche MSF), une dose unique est souvent suffisante pour faciliter l'hydratation en cas de vomissements persistants ; ne pas administrer avant 6 mois. Depuis 2019 (HAS, VIDAL) : métoclopramide contre-indiqué avant 18 ans (sauf post-opératoire et chimiothérapie) ; dompéridone à ne plus utiliser avant 12 ans ou moins de 35 kg ; métopimazine à éviter chez l'enfant (efficacité mal établie). Grossesse : ondansétron à éviter au 1er trimestre ; pas de traitement des nausées gravidiques sans avis médical. Divergence à noter : l'ondansétron est positionné en 1re ligne chez l'enfant par MSF, mais hors AMM en France.","q":{"df":{"st":"av","s":[82,83,84,85,77]},"sa":{"st":"av","s":[82,83,84,85,77]},"ct":{"st":"av","s":[82,83,84,85,77]}},"sr":[77,82,83,84,85]}],"m":[{"id":"abufene","n":"Abufene","d":"ibuprofène","f":["cp"],"dz":[],"g":"ibuprofene","o":["ord-015"],"r":"","cl":"AINS","q":{"cl":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"pos":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ind":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"cix":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ei":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ma":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."}},"pos":"Adulte (valeur usuelle indicative) : 200–400 mg toutes les 6–8 h (max 1,2 g/j en OTC)","ind":"Douleur, fièvre, inflammation, dysménorrhée","cix":"Ulcère, insuffisance rénale, 3e trimestre, asthme aux AINS","ei":"Gastralgies, rétention hydrique, néphrotoxicité","ma":"Inhibe COX-1 et COX-2","sr":[122],"nc":["Advil","Nurofen"]},{"id":"aciclovir","n":"Aciclovir","d":"aciclovir","f":["Pde","cp"],"dz":["200mg"],"g":"aciclovir","o":["ord-071","ord-110"],"r":"","cl":"Antiviral, analogue nucléosidique","q":{"cl":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"pos":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nationaux)."},"ind":{"st":"av","s":[122],"n":"Document fourni (Fiches_medicaments.docx) : valeur indicative, à vérifier (RCP, protocoles nat (otite, angine, pyélonéphrite, abcès dentaire, bronchite chronique, Lyme) : se référer au tableau du RCP (regroupement des indications à confirmer). Durée la plus courte possible selon l'infection.","cix":"Hypersensibilité à l'amoxicilline, aux pénicillines ou à un excipient ; antécédent de réaction d'hypersensibilité immédiate sévère (anaphylaxie) à une autre bêta-lactamine (céphalosporine, carbapénème, monobactame).","ei":"Les plus fréquents : diarrhées, nausées, éruptions cutanées. Peu fréquents : vomissements, urticaire, prurit. Très rares : réactions allergiques sévères (œdème de Quincke, anaphylaxie, maladie sérique), réactions cutanées sévères (érythème polymorphe, Stevens-Johnson, nécrolyse épidermique toxique, PEAG, DRESS), colite associée aux antibiotiques, leucopénie, thrombopénie et anémie hémolytique réversibles, hépatite et ictère cholestatique, néphrite interstitielle, convulsions, vertiges, candidose. Fréquence indéterminée : syndrome de Kounis, lymphohistiocytose hémophagocytaire, entérocolite induite par le médicament (surtout enfant), cristallurie, méningite aseptique, réaction de Jarisch-Herxheimer.","pr":"Rechercher une allergie aux pénicillines/céphalosporines avant traitement ; arrêt immédiat en cas de manifestation allergique. Éviter en cas de suspicion de mononucléose infectieuse. Convulsions possibles (insuffisance rénale, fortes doses, antécédents). Colite associée aux antibiotiques : arrêt et avis médical, ne pas utiliser de freinateurs du péristaltisme. Traitement prolongé : surveiller fonctions rénale, hépatique et hématologique. Fortes doses : bonne hydratation (cristallurie). Anticoagulants oraux : surveiller le temps de Quick/INR. Glycosurie : utiliser la méthode enzymatique à la glucose oxydase.","it":"Probénécide : association non recommandée (↑ taux d'amoxicilline) ; allopurinol : ↑ risque de réactions cutanées allergiques ; tétracyclines et autres bactériostatiques : possible interférence avec l'effet bactéricide ; anticoagulants oraux (acénocoumarol, warfarine) : ↑ possible de l'INR, surveillance ; méthotrexate : ↑ de sa toxicité (excrétion réduite).","pen":"Enfant \u003c 40 kg : 20–90 mg/kg/j en plusieurs prises (sinusite, otite, pneumonie, cystite, pyélonéphrite, abcès dentaire) ; 40–90 mg/kg/j (angine) ; 100 mg/kg/j en 3 prises (fièvre typhoïde/paratyphoïde) ; prophylaxie de l'endocardite : 50 mg/kg en dose unique 30–60 min avant l'acte. Le schéma en 2 prises/jour est réservé aux doses les plus élevées. Première semaine de vie : limiter à 2 prises/jour. La notice patient donne une posologie usuelle plus simple (40–90 mg/kg/j, maximum 100 mg/kg/j) : le RCP, plus détaillé, a été retenu.","pgr":"Utilisable si le bénéfice attendu l'emporte sur le risque ; pas d'augmentation du risque de malformation sur données limitées. Peut fausser le dosage de l'œstriol.","pal":"Excrétée en petites quantités dans le lait (risque de sensibilisation, diarrhée et candidose possibles chez le nourrisson) ; utilisation après évaluation du rapport bénéfice/risque par le médecin.","pag":"Aucune adaptation posologique jugée nécessaire.","pir":"Adulte et enfant ≥ 40 kg : DFG > 30 mL/min aucune adaptation ; 10–30 : maximum 500 mg deux fois par jour ; \u003c 10 : maximum 500 mg/jour ; hémodialyse : 500 mg/24 h avec 500 mg supplémentaires avant et après la séance ; dialyse péritonéale : maximum 500 mg/jour. Enfant \u003c 40 kg : DFG 10–30 : 15 mg/kg deux fois par jour (maximum 500 mg deux fois par jour) ; \u003c 10 : 15 mg/kg une fois par jour (maximum 500 mg).","pih":"À utiliser avec précaution, avec surveillance régulière de la fonction hépatique.","q":{"cl":{"st":"av","s":[2,122],"n":"Divergence résolue : libellé de classe du Word plus général ; classification ATC du RCP de l'ANSM conservée. Valeur du Word non reprise : « Antibiotique, β-lactamine (aminopénicilline) »."},"ind":{"st":"av","s":[2,122],"n":"Divergence résolue : valeur du RCP de l'ANSM conservée (source officielle, plus récente et plus détaillée) ; le p"],"dz":[],"g":"bromhexine","o":["ord-079"],"r":""},{"id":"bleu-de-methylene","n":"Bleu de méthylène","d":"bleu de méthylène","f":["sol"],"dz":[],"g":"bleu-de-methylene","o":["ord-012","ord-085"],"r":""},{"id":"bristopen","n":"Bristopen","d":"oxacilline","f":["amp","gel"],"dz":["01g","500mg"],"g":"oxacilline","o":["ord-008","ord-062","ord-119"],"r":"","cl":"Pénicillines résistantes aux bêta-lactamases, groupe M (ATC J01CF02)","ind":"Adulte et enfant, traitement curatif des infections dues à des staphylocoques sensibles : respiratoires, ORL, rénales, uro-génitales, neuro-méningées, ostéo-articulaires, endocardites ; infections cutanées dues à des staphylocoques et/ou streptocoques sensibles ; prophylaxie des infections post-opératoires en neurochirurgie (dérivation interne du LCR). Voie intraveineuse uniquement (présentation 1 g/5 mL). Tenir compte des recommandations officielles sur l'usage des antibactériens.","ma":"Antibiotique bêta-lactamine, pénicilline du groupe M (résistante aux bêta-lactamases staphylococciques). Spectre : Streptococcus pyogenes et Clostridium perfringens habituellement sensibles ; Staphylococcus aureus inconstamment sensible (résistance à la méticilline d'environ 20 à 30 %, surtout en milieu hospitalier) ; staphylocoques à coagulase négative résistants dans 50 % des cas ou plus en France. Le RCP lu ne détaille pas le mécanisme moléculaire.","pos":"Présentation IV 1 g/5 mL : perfusion intraveineuse lente uniquement (la voie IM est inadéquate). Adulte à fonction rénale normale : traitement curatif 8 à 12 g/j en 4 à 6 administrations. Prévention en chirurgie (neurochirurgie) : 2 g IV à l'induction anesthésique, puis 1 g IV toutes les 2 h si l'intervention se prolonge ; antibioprophylaxie de courte durée, jamais plus de 48 h. Des doses inférieures aux doses recommandées peuvent favoriser des germes résistants.","pen":"Enfant à fonction rénale normale : 100 à 200 mg/kg/j en 4 à 6 administrations, sans dépasser 12 g/j. Posologie non étudiée chez l'enfant insuffisant rénal et/ou hépatique. Prudence chez le nouveau-né (risque d'hyperbilirubinémie par compétition de fixation sur les protéines, ictère nucléaire).","cix":"Hypersensibilité à l'oxacilline, aux autres bêta-lactamines (pénicillines, céphalosporines) ou à un excipient ; administration par voie sous-conjonctivale. Antécédent d'allergie typique à ces produits : contre-indication formelle.","ei":"Immunitaires : prurit, urticaire, bronchospasme, œdème de Quincke, exceptionnellement choc anaphylactique, éosinophilie. Cutanés : éruption maculo-papuleuse, exceptionnellement bulleuse ou pustuleuse. Digestifs : nausées, vomissements, diarrhée, stomatite, langue noire, colite pseudomembraneuse. Hépatiques : élévation des transaminases (parfois avec fièvre, nausées, vomissements), élévation transitoire des phosphatases alcalines. Neurologiques : encéphalopathie, troubles de la conscience, confusion, mouvements anormaux, myoclonies, crises épileptiformes (surtout en cas de surdosage ou d'insuffisance rénale). Rénaux : néphropathies interstitielles aiguës immuno-allergiques, tubulopathies. Hématologiques : éosinophilie, anémie hémolytique, agranulocytose, neutropénie, leucopénie, dépression médullaire. Fièvre. Surdosage : manifestations neuropsychiques, rénales et digestives ; non hémodialysable.","pr":"Toute manifestation allergique impose l'arrêt ; interrogatoire préalable (allergie croisée avec les céphalosporines dans 5 à 10 % des cas). Diarrhées associées à Clostridioides difficile possibles jusqu'à deux mois après le traitement : médicaments inhibant le péristaltisme contre-indiqués. Fortes doses chez l'insuffisant rénal ou en cas d'antécédents de convulsions, d'épilepsie traitée ou d'atteinte méningée : troubles neurologiques possibles. Encéphalopathie possible, surtout en cas d'insuffisance rénale ou de surdosage. Insuffisance rénale sévère : attention particulière. Insuffisance hépatique associée à une insuffisance rénale : contrôle de l'oxacillinémie. Insuffisant rénal ou plus de 65 ans : numération formule sanguine et fonction hépatique au moins une fois par semaine. Voie IM inadéquate. Prudence chez le nouveau-né.","it":"Association déconseillée : méthotrexate (augmentation de ses effets et de sa toxicité hématologique, par inhibition de sa sécrétion tubulaire rénale). Incompatibilité avec les aminoglycosides : ne pas mélanger, les administrer séparément (inactivation mutuelle in vitro, concentrations d'aminoglycoside faussement diminuées). Ne pas mélanger avec d'autres médicaments. Anticoagulants oraux : déséquilibres de l'INR rapportés avec les antibiotiques (surveillance).","pgr":"La sécurité d'emploi pendant la grossesse n'a pas été établie ; utilisation possible si elle est clairement justifiée.","pal":"L'oxacilline passe dans le lait maternel (faible passage selon la notice) ; précautions chez la femme qui allaite ; surveiller diarrhée, éruption et candidose chez le nouveau-né.","pag":"Plus de 65 ans : numération formule sanguine et fonction hépatique à surveiller au moins une fois par semaine.","pir":"Aucune adaptation posologique requise ; attention particulière en cas d'insuffisance rénale sévère (voir précautions).","pih":"Insuffisance hépatique associée à une insuffisance rénale : attention particulière et contrôle des taux d'oxacillinémie ; posologie non étudiée chez l'enfant insuffisant hépatique.","q":{"cl":{"st":"av","s":[18]},"ind":{"st":"av","s":[18]},"ma":{"st":"av","s":[18]},"pos":{"st":"av","s":[18]},"pen":{"st":"av","s":[18]},"cix":{"st":"av","s":[18]},"ei":{"st":"av","s":[18]},"pr":{"st":"av","s":[18]},"it":{"st":"av","s":[18]},"pgr":{"st":"av","s":[18]},"pal":{"st":"av","s":[18]},"pag":{"st":"av","s":[18]},"pir":{"st":"av","s":[18]},"pih":{"st":"av","s":[18]},"dci":{"st":"av","s":[18,19]}},"sr":[18,19]},{"id":"calcifediol","n":"Calcifediol","d":"calcifédiol","f":[],"dz":[],"g":"calcifediol","o":["ord-110"],"r":""},{"id":"cardular","n":"Cardular","d":"","f":["cp"],"dz":["02mg"],"g":null,"o"
